const SHIP_PATHS = [
  [0, -22, 4, -11, 5, -1, 17, 7, 18, 13, 5, 11, 4, 17, -4, 17, -5, 11, -18, 13, -17, 7, -5, -1, -4, -11],          // falcon
  [0, -24, 3, -9, 13, 12, 4, 9, 0, 15, -4, 9, -13, 12, -3, -9],                                                    // bolt
  [0, -19, 7, -13, 9, -3, 19, 1, 21, 12, 9, 14, 6, 19, -6, 19, -9, 14, -21, 12, -19, 1, -9, -3, -7, -13],          // aegis
  [0, -17, 5, -9, 6, 1, 14, -7, 18, -5, 16, 12, 6, 14, 3, 19, -3, 19, -6, 14, -16, 12, -18, -5, -14, -7, -6, 1, -5, -9], // havoc
  [0, -22, 5, -10, 8, 3, 16, 0, 22, 11, 12, 9, 6, 16, 0, 12, -6, 16, -12, 9, -22, 11, -16, 0, -8, 3, -5, -10],      // nyx
];

function drawShip(idx, x, y, tilt, scale, t, flame) {
  const pl = PILOTS[idx];
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (1 - Math.abs(tilt) * 0.16), scale);
  // engine flames
  if (flame !== false) {
    const fl = 8 + Math.sin(t * 60) * 2 + Math.random() * 3;
    ctx.globalCompositeOperation = 'lighter';
    const flames = idx === 2 ? [-5, 5] : idx === 3 ? [-3, 3] : [0];
    for (const fx of flames) {
      ctx.fillStyle = pl.color; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.moveTo(fx - 4, 15); ctx.lineTo(fx, 15 + fl * 1.6); ctx.lineTo(fx + 4, 15); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(fx - 2, 15); ctx.lineTo(fx, 15 + fl * 0.8); ctx.lineTo(fx + 2, 15); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // hull
  poly(SHIP_PATHS[idx]);
  ctx.fillStyle = metal(-22, 20, '#2a303c', '#9aa3b5');
  ctx.fill();
  ctx.lineWidth = 1.2; ctx.strokeStyle = '#11151c'; ctx.stroke();
  // accent: wing stripes in pilot colour
  ctx.fillStyle = pl.color;
  switch (idx) {
    case 0: poly([5, 1, 15, 8, 15, 10, 5, 5]); ctx.fill(); poly([-5, 1, -15, 8, -15, 10, -5, 5]); ctx.fill(); break;
    case 1: poly([3, -4, 10, 10, 7, 9, 2, 0]); ctx.fill(); poly([-3, -4, -10, 10, -7, 9, -2, 0]); ctx.fill(); break;
    case 2: ctx.fillRect(10, 3, 9, 3); ctx.fillRect(-19, 3, 9, 3); ctx.fillRect(-3, 12, 6, 4); break;
    case 3: ctx.fillRect(13, -14, 3, 12); ctx.fillRect(-16, -14, 3, 12);
      ctx.fillStyle = '#20252e'; ctx.fillRect(13.5, -18, 2, 5); ctx.fillRect(-15.5, -18, 2, 5); break;
    case 4: poly([8, 4, 19, 9, 12, 8]); ctx.fill(); poly([-8, 4, -19, 9, -12, 8]); ctx.fill(); break;
  }
  // canopy
  ctx.fillStyle = '#0b1622';
  ctx.beginPath(); ctx.ellipse(0, -8, 2.8, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = pl.trim; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.ellipse(-0.8, -10, 1, 2.6, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPlayer() {
  if (!P.alive) return;
  const blink = P.inv > 0 && Math.floor(Game.t * 14) % 2 === 0;
  ctx.globalAlpha = blink ? 0.35 : 1;
  drawShip(Game.pilotIdx, P.x, P.y, P.tilt, 1, Game.t);
  ctx.globalAlpha = 1;
  // the glowing core: the only part that takes hits
  const pl = Run.pilot, pulse = 0.75 + Math.sin(Game.t * 10) * 0.25;
  ctx.globalCompositeOperation = 'lighter';
  glowDot(P.x, P.y, pl.core + 1, pl.color, 0.6 * pulse);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(P.x, P.y, Math.max(1.5, pl.core * 0.6), 0, TAU); ctx.fill();
  if (P.focus) {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(P.x, P.y, pl.core + 0.5, 0, TAU); ctx.stroke();
    ctx.strokeStyle = pl.color; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(Game.t * 2);
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.arc(0, 0, pl.core + 7, 0.2, 1.2); ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------
// Enemies
// ---------------------------------------------------------------------
const HULL_D = '#262b35', HULL_L = '#7d8596', RED = '#ff4a5a';
const hullFill = (e, y0, y1) => e.flash > 0 ? metal(y0, y1, '#6a7282', '#e8edf7') : metal(y0, y1, HULL_D, HULL_L);

function drawEnemy(e) {
  if (e.wait > 0) return;
  if (e.boss) { drawBoss(e); return; }
  ctx.save();
  ctx.translate(e.x, e.y);
  const T = Game.t;
  switch (e.type) {
    case 'dart': {
      ctx.rotate(e.ang - Math.PI / 2);
      ctx.globalCompositeOperation = 'lighter'; glowDot(0, -11, 2.5, '#ff7a4a', 0.8); ctx.globalCompositeOperation = 'source-over';
      poly([0, 14, 6, 2, 13, -4, 12, -9, 4, -6, 0, -11, -4, -6, -12, -9, -13, -4, -6, 2]);
      ctx.fillStyle = hullFill(e, -10, 14); ctx.fill(); ctx.strokeStyle = '#0d1016'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = RED; poly([0, 10, 3, 1, 0, -3, -3, 1]); ctx.fill();
      break;
    }
    case 'kami': {
      ctx.rotate(e.data.a - Math.PI / 2);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#ff6a2a'; ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(0, -18 - Math.random() * 8); ctx.lineTo(4, -8); ctx.fill();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      poly([0, 13, 9, -6, 3, -3, 0, -9, -3, -3, -9, -6]);
      ctx.fillStyle = e.flash > 0 ? '#d88a94' : '#8a2a36'; ctx.fill(); ctx.strokeStyle = '#2a0a10'; ctx.stroke();
      ctx.fillStyle = '#ffd36a'; ctx.beginPath(); ctx.arc(0, 2, 2.2, 0, TAU); ctx.fill();
      break;
    }
    case 'drone': {
      const eye = P.alive ? angTo(e.x, e.y, P.x, P.y) : Math.PI / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(4, 8, 16, 9, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU);
      ctx.fillStyle = hullFill(e, -15, 15); ctx.fill(); ctx.strokeStyle = '#0d1016'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.save(); ctx.rotate(T * 2);
      ctx.fillStyle = '#3a404c';
      for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ctx.fillRect(12, -2, 7, 4); }
      ctx.restore();
      ctx.fillStyle = '#12161d'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      glowDot(Math.cos(eye) * 3, Math.sin(eye) * 3, 3, RED, 1);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 'tank': {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(-12, -12, 30, 34);
      ctx.fillStyle = '#1b1f18'; ctx.fillRect(-15, -16, 7, 32); ctx.fillRect(8, -16, 7, 32);
      ctx.fillStyle = '#3a3f33';
      const tr = (e.t * 30) % 6;
      for (let yy = -16 + tr; yy < 16; yy += 6) { ctx.fillRect(-15, yy, 7, 2); ctx.fillRect(8, yy, 7, 2); }
      roundRect(-10, -13, 20, 26, 3);
      ctx.fillStyle = e.flash > 0 ? '#a8ae96' : '#5a604a'; ctx.fill(); ctx.strokeStyle = '#14170f'; ctx.stroke();
      ctx.rotate(e.turret - Math.PI / 2);
      ctx.fillStyle = '#2a2e24'; ctx.fillRect(-2, 2, 4, 17);
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fillStyle = e.flash > 0 ? '#b8bea4' : '#737a5e'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff9a4a'; ctx.fillRect(-1, -2, 2, 2);
      break;
    }
    case 'spinner': {
      ctx.rotate(e.ang);
      ctx.fillStyle = hullFill(e, -18, 18);
      ctx.beginPath();
      for (let i = 0; i < 12; i++) { const r = i % 2 ? 9 : 19, a = i / 12 * TAU; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#0d1016'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glowDot(0, 0, 5 + Math.sin(T * 8), '#ff3db0', 1);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 'gunship': {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; poly([8, 44, 40, 8, 38, -16, 8, -24, -24, -16, -26, 8]); ctx.fill();
      poly([0, 36, 14, 22, 36, 6, 34, -14, 12, -24, 0, -18, -12, -24, -34, -14, -36, 6, -14, 22]);
      ctx.fillStyle = hullFill(e, -24, 36); ctx.fill(); ctx.strokeStyle = '#0d1016'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#1b1f27'; roundRect(-8, -14, 16, 36, 4); ctx.fill();
      ctx.fillStyle = '#ff8a3d'; ctx.fillRect(-30, -6, 12, 3); ctx.fillRect(18, -6, 12, 3);
      for (const s of [-1, 1]) {
        const a = aimAt(e.x + s * 18, e.y + 14) - Math.PI / 2;
        ctx.save(); ctx.translate(s * 18, 12); ctx.rotate(a);
        ctx.fillStyle = '#23272f'; ctx.fillRect(-1.5, 0, 3, 12);
        ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, TAU); ctx.fillStyle = '#505866'; ctx.fill(); ctx.restore();
      }
      ctx.globalCompositeOperation = 'lighter'; glowDot(0, 4, 4 + Math.sin(T * 6), RED, 0.9);
      glowDot(-10, -22, 2.5, '#ff7a4a', 0.8); glowDot(10, -22, 2.5, '#ff7a4a', 0.8);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 'carrier': {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(6, 10, 30, 14, 0, 0, TAU); ctx.fill();
      for (const s of [-1, 1]) {
        ctx.fillStyle = '#2e333d'; ctx.fillRect(s * 22 - 5, -10, 10, 20);
        ctx.save(); ctx.translate(s * 22, 0); ctx.rotate(T * 20 * s);
        ctx.fillStyle = 'rgba(200,210,230,0.35)'; ctx.fillRect(-14, -1.5, 28, 3); ctx.fillRect(-1.5, -14, 3, 28);
        ctx.restore();
      }
      roundRect(-18, -14, 36, 28, 10);
      ctx.fillStyle = hullFill(e, -14, 14); ctx.fill(); ctx.strokeStyle = '#0d1016'; ctx.lineWidth = 1.2; ctx.stroke();
      const pc = WEAPONS[Math.floor(T * 2) % 5].color;
      ctx.fillStyle = '#10131a'; roundRect(-9, -8, 18, 16, 5); ctx.fill();
      ctx.globalCompositeOperation = 'lighter'; glowDot(0, 0, 5 + Math.sin(T * 5) * 1.2, pc, 0.9); ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 'frigate': {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; poly([10, 58, 64, 20, 56, -18, 10, -34, -44, -18, -50, 20]); ctx.fill();
      poly([0, 48, 20, 36, 54, 16, 58, -2, 44, -18, 16, -26, 0, -32, -16, -26, -44, -18, -58, -2, -54, 16, -20, 36]);
      ctx.fillStyle = hullFill(e, -32, 48); ctx.fill(); ctx.strokeStyle = '#0d1016'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(40, 0); ctx.moveTo(-26, 20); ctx.lineTo(26, 20); ctx.stroke();
      ctx.fillStyle = '#1c2029'; roundRect(-12, -22, 24, 56, 6); ctx.fill();
      for (const [tx, ty] of [[-34, 6], [34, 6], [0, 14]]) {
        const a = aimAt(e.x + tx, e.y + ty) - Math.PI / 2;
        ctx.save(); ctx.translate(tx, ty); ctx.rotate(a);
        ctx.fillStyle = '#20242c'; ctx.fillRect(-4, 0, 3, 14); ctx.fillRect(1, 0, 3, 14);
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fillStyle = '#5a6272'; ctx.fill(); ctx.strokeStyle = '#11141a'; ctx.stroke();
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'lighter';
      glowDot(0, -6, 5 + Math.sin(T * 5), '#ff8a3d', 0.9);
      for (const s of [-1, 1]) glowDot(s * 50, -4, 2.5, RED, Math.floor(T * 3) % 2 ? 1 : 0.3);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
  }
  ctx.restore();
}

// Bosses
// ---------------------------------------------------------------------
function drawBoss(e) {
  const def = BOSSES[e.design], T = Game.t;
  const rage = clamp(1 - e.hp / e.maxHp, 0, 1);
  const fl = e.flash > 0;
  const dark = fl ? '#2c323d' : '#1f242d', light = fl ? '#b4bccb' : '#8a93a6';
  const acc = def.accent;
  const pulse = 0.7 + Math.sin(T * (4 + rage * 10)) * 0.3;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.data.phase === 'dying') ctx.globalAlpha = 0.6 + Math.random() * 0.4;
  const body = (pts, y0, y1) => { poly(pts); ctx.fillStyle = metal(y0, y1, dark, light); ctx.fill(); ctx.strokeStyle = '#0a0c11'; ctx.lineWidth = 1.6; ctx.stroke(); };
  const lines = (arr) => { ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.beginPath(); for (const [a, b, c, d] of arr) { ctx.moveTo(a, b); ctx.lineTo(c, d); } ctx.stroke(); };
  const shadow = (pts) => { ctx.save(); ctx.translate(12, 18); poly(pts); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill(); ctx.restore(); };

  switch (e.design) {
    case 0: { // WARDEN: armoured wing gunship
      const hull = [0, 62, 22, 44, 40, 20, 92, 14, 104, -6, 86, -24, 40, -30, 24, -52, 0, -60, -24, -52, -40, -30, -86, -24, -104, -6, -92, 14, -40, 20, -22, 44];
      shadow(hull); body(hull, -60, 62);
      lines([[-40, -30, -40, 20], [40, -30, 40, 20], [-86, -24, -92, 14], [86, -24, 92, 14], [-22, 44, 22, 44]]);
      ctx.fillStyle = '#161a22'; poly([0, 40, 18, 22, 22, -24, 0, -40, -22, -24, -18, 22]); ctx.fill();
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(s * 60, -4);
        ctx.fillStyle = fl ? '#59606e' : '#3a414f'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.fill(); ctx.strokeStyle = '#0a0c11'; ctx.stroke();
        ctx.fillStyle = '#12151b'; ctx.fillRect(-9, 8, 5, 16); ctx.fillRect(4, 8, 5, 16);
        ctx.restore();
        ctx.fillStyle = acc; ctx.fillRect(s * 76 - 8, -20, 16, 3);
      }
      ctx.globalCompositeOperation = 'lighter';
      glowDot(0, 0, 9 * pulse + 3, acc, 1);
      for (const s of [-1, 1]) glowDot(s * 60, -4, 4, acc, pulse);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 1: { // HYDRA: three heads on a domed carrier
      const hull = [0, 30, 36, 24, 60, 2, 56, -30, 26, -50, 0, -54, -26, -50, -56, -30, -60, 2, -36, 24];
      shadow(hull);
      for (const [hx, hy] of [[-52, 16], [52, 16], [0, 40]]) {
        const sway = Math.sin(T * 2 + hx) * 3;
        ctx.strokeStyle = '#2a2f38'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(hx * 0.5, hy * 0.2, hx + sway, hy); ctx.stroke();
      }
      body(hull, -54, 30);
      ctx.fillStyle = fl ? '#4a5260' : '#2c333f'; ctx.beginPath(); ctx.arc(0, -10, 26, 0, TAU); ctx.fill(); ctx.strokeStyle = '#0a0c11'; ctx.lineWidth = 1.5; ctx.stroke();
      lines([[-26, -10, 26, -10], [0, -36, 0, 16]]);
      for (const [hx, hy] of [[-52, 16], [52, 16], [0, 40]]) {
        const sway = Math.sin(T * 2 + hx) * 3;
        ctx.save(); ctx.translate(hx + sway, hy);
        const a = aimAt(e.x + hx, e.y + hy) - Math.PI / 2; ctx.rotate(a * 0.6);
        poly([0, 20, 12, 6, 12, -10, 0, -16, -12, -10, -12, 6]);
        ctx.fillStyle = metal(-16, 20, dark, light); ctx.fill(); ctx.strokeStyle = '#0a0c11'; ctx.stroke();
        ctx.globalCompositeOperation = 'lighter'; glowDot(0, 6, 3.5, acc, pulse); ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'lighter'; glowDot(0, -10, 8 * pulse + 2, acc, 0.9); ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 2: { // SERAPH: layered feather wings
      const flap = Math.sin(T * 3) * 4;
      for (const s of [-1, 1]) {
        for (let k = 2; k >= 0; k--) {
          const wx = s * (34 + k * 22), wy = -10 - k * 8 + flap * (k + 1) * 0.3;
          const pts = [s * 12, 6, wx + s * 30, wy - 26, wx + s * 18, wy + 6, s * 18, 18];
          shadow(pts);
          poly(pts); ctx.fillStyle = metal(wy - 26, 18, dark, light); ctx.fill(); ctx.strokeStyle = '#0a0c11'; ctx.lineWidth = 1.2; ctx.stroke();
          ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = acc; ctx.globalAlpha = 0.5 * pulse; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(s * 16, 10); ctx.lineTo(wx + s * 26, wy - 20); ctx.stroke();
          ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        }
      }
      body([0, 44, 12, 20, 14, -18, 0, -46, -14, -18, -12, 20], -46, 44);
      ctx.fillStyle = '#141820'; poly([0, 30, 6, 10, 6, -14, 0, -30, -6, -14, -6, 10]); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      glowDot(0, 0, 7 * pulse + 2, acc, 1);
      glowDot(0, -30, 3, '#ffffff', 0.8);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
    case 3: { // LEVIATHAN: a battleship the width of the screen
      const hull = [0, 58, 44, 46, 96, 18, 150, -6, 168, -26, 140, -44, 80, -40, 40, -56, 0, -62, -40, -56, -80, -40, -140, -44, -168, -26, -150, -6, -96, 18, -44, 46];
      shadow(hull); body(hull, -62, 58);
      lines([[-80, -40, -96, 18], [80, -40, 96, 18], [-40, -56, -44, 46], [40, -56, 44, 46], [-140, -44, -150, -6], [140, -44, 150, -6]]);
      for (let k = -3; k <= 3; k++) { ctx.fillStyle = '#161a22'; ctx.fillRect(k * 18 - 6, -48 + Math.abs(k) * 4, 12, 6); }
      for (const c of def.circles) {
        ctx.save(); ctx.translate(c.x, c.y);
        ctx.fillStyle = fl ? '#58606e' : '#39404d'; ctx.beginPath(); ctx.arc(0, 0, c.r * 0.72, 0, TAU); ctx.fill(); ctx.strokeStyle = '#0a0c11'; ctx.stroke();
        ctx.fillStyle = '#12151b'; ctx.fillRect(-3, c.r * 0.4, 6, c.r * 0.7);
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'lighter';
      glowDot(0, 0, 12 * pulse + 3, acc, 1);
      for (const c of def.circles.slice(1)) glowDot(c.x, c.y, 3.5, acc, pulse);
      ctx.globalCompositeOperation = 'source-over';
      break;
    }
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
// Bullets, pods, effects
// ---------------------------------------------------------------------
function drawPlayerBullets() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  // vulcan & nose gun
  for (const pass of [0, 1]) {
    ctx.beginPath();
    for (const b of pBullets) {
      if (b.kind !== 'v' && b.kind !== 'n') continue;
      const k = b.kind === 'v' ? 0.02 : 0.016;
      ctx.moveTo(b.x - b.vx * k, b.y - b.vy * k); ctx.lineTo(b.x, b.y);
    }
    ctx.strokeStyle = pass ? '#fff8e0' : 'rgba(255,170,40,0.6)';
    ctx.lineWidth = (pass ? 2.2 : 6.5) * clamp(Math.sqrt(Run.pilot.dmg), 0.72, 1.3);
    ctx.stroke();
  }
  for (const b of pBullets) {
    if (b.kind === 'l') {
      ctx.strokeStyle = 'rgba(40,170,255,0.45)'; ctx.lineWidth = b.w * 2.6;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + b.len); ctx.stroke();
      ctx.strokeStyle = '#e8fdff'; ctx.lineWidth = b.w * 0.6;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + b.len); ctx.stroke();
    } else if (b.kind === 'p') {
      const r = b.r * (1 + Math.sin(b.t) * 0.12);
      ctx.fillStyle = 'rgba(40,230,90,0.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, r * 2, 0, TAU); ctx.fill();
      ctx.fillStyle = '#7dff8a'; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#f2fff2'; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.45, 0, TAU); ctx.fill();
    } else if (b.kind === 'm') {
      const cx = Math.cos(b.ang), sy = Math.sin(b.ang);
      ctx.strokeStyle = 'rgba(255,110,30,0.6)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(b.x - cx * 12, b.y - sy * 12); ctx.lineTo(b.x - cx * 4, b.y - sy * 4); ctx.stroke();
      ctx.strokeStyle = '#ffe0c0'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(b.x - cx * 5, b.y - sy * 5); ctx.lineTo(b.x + cx * 4, b.y + sy * 4); ctx.stroke();
    }
  }
  // arc lightning
  for (const a of arcs) {
    const alpha = a.life / a.max;
    for (const pass of [0, 1]) {
      ctx.beginPath();
      for (let i = 0; i < a.pts.length - 1; i++) {
        const p0 = a.pts[i], p1 = a.pts[i + 1];
        const dx = p1.x - p0.x, dy = p1.y - p0.y, len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const segs = Math.max(3, Math.min(10, Math.floor(len / 22)));
        ctx.moveTo(p0.x, p0.y);
        for (let s = 1; s < segs; s++) {
          const u = s / segs, j = rand(-9, 9) * (pass ? 0.6 : 1);
          ctx.lineTo(p0.x + dx * u + nx * j, p0.y + dy * u + ny * j);
        }
        ctx.lineTo(p1.x, p1.y);
      }
      ctx.globalAlpha = pass ? alpha : alpha * 0.5;
      ctx.strokeStyle = pass ? '#ffffff' : '#7d8cff';
      ctx.lineWidth = pass ? a.w : a.w * 4.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt';
}

function drawEnemyBullets() {
  // batched by kind: outer glow, body, core
  const T = Game.t;
  const groups = { dot: [], needle: [], orb: [], big: [], mine: [] };
  for (const b of eBullets) (groups[b.kind] || groups.dot).push(b);

  ctx.lineCap = 'round';
  if (groups.needle.length) {
    const pass = (w, c) => {
      ctx.beginPath();
      for (const b of groups.needle) { const s = Math.hypot(b.vx, b.vy) || 1, k = 7 / s; ctx.moveTo(b.x - b.vx * k, b.y - b.vy * k); ctx.lineTo(b.x + b.vx * k * 0.4, b.y + b.vy * k * 0.4); }
      ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke();
    };
    pass(8, 'rgba(255,60,40,0.45)'); pass(4.5, '#ff6a3d'); pass(1.8, '#fff4e8');
  }
  ctx.lineCap = 'butt';

  const circles = (list, r, color) => {
    if (!list.length) return;
    ctx.fillStyle = color; ctx.beginPath();
    for (const b of list) { const rr = typeof r === 'function' ? r(b) : r; ctx.moveTo(b.x + rr, b.y); ctx.arc(b.x, b.y, rr, 0, TAU); }
    ctx.fill();
  };
  circles(groups.dot, 6.5, 'rgba(255,40,120,0.35)');
  circles(groups.dot, 4.2, '#ff3d8b');
  circles(groups.dot, 2, '#fff0f6');

  circles(groups.orb, 10, 'rgba(170,70,255,0.35)');
  circles(groups.orb, 6.5, '#b04bff');
  circles(groups.orb, 3, '#f6ecff');

  circles(groups.big, b => 15 + Math.sin(T * 12 + b.x) * 2, 'rgba(255,40,200,0.3)');
  circles(groups.big, 10, '#ff2fd0');
  circles(groups.big, 5, '#fff0fb');

  circles(groups.mine, b => 13 + (b.burst ? (b.t / b.burst) * 6 : 0), 'rgba(255,170,40,0.3)');
  circles(groups.mine, 8, '#ffb13d');
  circles(groups.mine, b => (b.burst && Math.floor(b.t * (4 + b.t * 12)) % 2) ? 5 : 3, '#fffbe8');
}

function drawPods() {
  const T = Game.t;
  for (const p of pods) {
    const blinking = p.bounces === 3;
    if (blinking && Math.floor(p.t * 10) % 2 === 0) { ctx.globalAlpha = 0.25; }
    ctx.save(); ctx.translate(p.x, p.y);
    if (p.kind === 'power') {
      ctx.save(); ctx.rotate(T * 1.5);
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,200,60,0.35)';
      for (let i = 0; i < 8; i++) { ctx.rotate(TAU / 8); ctx.beginPath(); ctx.moveTo(-2.5, 12); ctx.lineTo(0, 21); ctx.lineTo(2.5, 12); ctx.fill(); }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU);
      const g = ctx.createRadialGradient(-4, -4, 1, 0, 0, 13); g.addColorStop(0, '#fff6c0'); g.addColorStop(0.6, GOLD); g.addColorStop(1, '#b8860b');
      ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff2a8'; ctx.stroke();
      text('P', 0, 1, 15, '#4a3000', 'center', '900');
    } else {
      const w = WEAPONS[p.w];
      const col = p.flashT > 0 ? '#ffffff' : w.color;
      ctx.globalCompositeOperation = 'lighter'; glowDot(0, 0, 12, w.glow, 0.35); ctx.globalCompositeOperation = 'source-over';
      roundRect(-15, -11, 30, 22, 8);
      ctx.fillStyle = '#10141c'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
      text(w.key, 0, 1, 14, col, 'center', '900');
      // time until this pod cycles to the next weapon
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, 19, -Math.PI / 2, -Math.PI / 2 + TAU * (p.cycleT / 10)); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  ctx.globalCompositeOperation = 'source-over';
  for (const p of parts) {
    const a = p.life / p.max;
    if (p.type === 'smoke') {
      ctx.fillStyle = p.color + (0.45 * a).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    } else if (p.type === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = p.life / p.max;
    if (p.type === 'spark') {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
    } else if (p.type === 'glow') {
      ctx.fillStyle = p.color;
      const s = p.size * (0.4 + a * 0.6);
      ctx.globalAlpha = a * 0.35; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
      ctx.globalAlpha = a * 0.8; ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.4, 0, TAU); ctx.fill();
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = (p.width || 2) * a + 0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r), 0, TAU); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawTexts() {

// ---------------------------------------------------------------------
// Background
// ---------------------------------------------------------------------
function drawBackground(scroll, hazeScroll, biome, prev, fade) {
  const y = ((scroll % TILE_H) + TILE_H) % TILE_H;
  const draw = (img) => { ctx.drawImage(img, 0, Math.floor(y - TILE_H)); ctx.drawImage(img, 0, Math.floor(y)); };
  if (fade < 1) { draw(getBiome(prev)); ctx.globalAlpha = fade; draw(getBiome(biome)); ctx.globalAlpha = 1; }
  else draw(getBiome(biome));
  const hy = ((hazeScroll % TILE_H) + TILE_H) % TILE_H;
  const haze = getHaze();
  ctx.drawImage(haze, 0, Math.floor(hy - TILE_H)); ctx.drawImage(haze, 0, Math.floor(hy));
  ctx.fillStyle = 'rgba(2,4,10,0.22)'; ctx.fillRect(0, 0, W, H);
}

// ---------------------------------------------------------------------
// UI: buttons registered while drawing, hit-tested on the next update
// ---------------------------------------------------------------------
const UI = { btns: [], hover: null };

function button(id, x, y, w, h, label, o) {
  o = o || {};
  UI.btns.push({ id, x, y, w, h });
  const sel = !!o.selected;
  roundRect(x, y, w, h, o.r == null ? 8 : o.r);
  ctx.fillStyle = sel ? (o.selFill || 'rgba(88,214,255,0.16)') : (o.fill || 'rgba(10,16,28,0.72)');
  ctx.fill();
  ctx.lineWidth = sel ? 2 : 1;
  ctx.strokeStyle = sel ? (o.color || '#58d6ff') : 'rgba(160,180,210,0.28)';
  ctx.stroke();
  if (label) text(label, x + w / 2, y + h / 2 + 1, o.size || 15, sel ? '#ffffff' : (o.textColor || '#b8c4d8'), 'center', 'bold', FONT_UI, o.spacing == null ? 3 : o.spacing);
}

function tappedButton() {
  for (const t of Input.taps) {
    for (const b of UI.btns) {
      if (t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h) {
        if (Input.drag && Input.drag.id === t.id) Input.drag.ui = true;
        return b.id;
      }
    }
  }
  return null;
}

function setState(s) {
  Game.prevState = Game.state; Game.state = s; Game.stateT = 0;
  Input.taps.length = 0;
}

let menuNote = null, menuNoteT = 0;
function note(msg) {
  if (Run && (Game.state === 'play')) toast(msg, '#cfe3ff');
  else { menuNote = msg; menuNoteT = 1.4; }
}

// ---------------------------------------------------------------------
// Global keys (work on every screen)
// ---------------------------------------------------------------------
function globalKeys() {
  if (hit('mute')) { Audio2.setMuted(!Audio2.muted); note(Audio2.muted ? 'SOUND OFF' : 'SOUND ON'); if (!Audio2.muted) sfx('toggle'); }
  if (hit('music')) { Audio2.setMusicOff(!Audio2.musicOff); note(Audio2.musicOff ? 'MUSIC OFF' : 'MUSIC ON'); sfx('toggle'); }
  if (hit('auto')) { Game.autoFire = !Game.autoFire; note(Game.autoFire ? 'AUTO-FIRE ON' : 'AUTO-FIRE OFF'); sfx('toggle'); }
}

  if (choice === 'start') { sfx('menuOk'); setState('pilot'); }

function updatePilot(dt) {
  Music.play('menu');
  const n = PILOTS.length;
  if (hit('left')) { Game.pilotIdx = (Game.pilotIdx + n - 1) % n; sfx('menuMove'); }
  if (hit('right')) { Game.pilotIdx = (Game.pilotIdx + 1) % n; sfx('menuMove'); }
  const tb = tappedButton();
  if (tb && tb.startsWith('pilot')) { const i = +tb.slice(5); if (i === Game.pilotIdx) { sfx('menuOk'); setState('diff'); return; } Game.pilotIdx = i; sfx('menuMove'); }
  if (tb === 'prev') { Game.pilotIdx = (Game.pilotIdx + n - 1) % n; sfx('menuMove'); }
  if (tb === 'next') { Game.pilotIdx = (Game.pilotIdx + 1) % n; sfx('menuMove'); }
  if (tb === 'ok' || (hit('confirm') && Game.stateT > 0.15)) { sfx('menuOk'); setState('diff'); return; }
  if (tb === 'back' || hit('back')) { sfx('menuBack'); setState('title'); }
}

function openPause() {
  if (Game.state !== 'play') return;
  Game.manualReturn = 'play';
  setState('pause');
  Music.play('menu');
  Input.drag = null;
}

function resumePlay() {
  setState('play');
  Music.play(Run.overT > 0 ? 'death' : (Run.bossActive || (Run.wave % 5 === 0 && Run.between <= 0)) ? 'boss' : 'combat');
  sfx('menuOk');
}

function updatePlay(dt) {
  if (hit('pause')) { sfx('menuBack'); openPause(); return; }
  for (const t of Input.taps) {
    if (dist2(t.x, t.y, PAUSE_BTN.x, PAUSE_BTN.y) < 26 * 26) { if (Input.drag && Input.drag.id === t.id) Input.drag.ui = true; openPause(); return; }
    if (dist2(t.x, t.y, BOMB_BTN.x, BOMB_BTN.y) < (BOMB_BTN.r + 6) ** 2) { if (Input.drag && Input.drag.id === t.id) Input.drag.ui = true; useBomb(); }
  }
  stepWorld(dt, true);
  if (Run.overT > 0) { Run.overT -= dt; if (Run.overT <= 0) endRun(false); }
}

function stepWorld(dt, live) {
  const R = Run;
  R.t += dt;
  R.scroll += 42 * dt; R.hazeScroll += 96 * dt;
  R.biomeFade = Math.min(1, R.biomeFade + dt / 2.5);
  R.shake *= Math.exp(-7 * dt); if (R.shake < 0.2) R.shake = 0;
  R.flash = Math.max(0, R.flash - dt * 2.2);
  R.toastT = Math.max(0, R.toastT - dt);
  if (R.chainT > 0) { R.chainT -= dt; if (R.chainT <= 0) R.chain = 0; }
  if (live) {
    updatePlayer(dt);
    updateBomb(dt);
    updateWaves(dt);
  } else if (R.bannerT > 0) R.bannerT -= dt;
  updateEnemies(dt);
  updatePlayerBullets(dt);
  updateEnemyBullets(dt);
  if (live) updatePods(dt);
  updateEffects(dt);
}

function endRun(abandoned) {
  const newHi = Run.score > Game.hi;
  if (newHi) Game.hi = Run.score;
  Game.lastResult = {
    score: Run.score, wave: Math.max(1, Run.wave), chain: Run.bestChain, kills: Run.kills,
    pilot: Run.pilot, diff: Run.diff, abandoned, newHi: newHi && Run.score > 0, bosses: Run.bossesBeaten,
  };
  Game.menuIdx = 0;
  setState('over');
  Music.play('death');
}

function drawWorld() {
  const R = Run;
  ctx.save();
  if (R.shake > 0) ctx.translate(rand(-R.shake, R.shake), rand(-R.shake, R.shake));
  drawBackground(R.scroll, R.hazeScroll, R.biome, R.biomePrev, R.biomeFade);
  for (const e of enemies) if (e.ground) drawEnemy(e);
  for (const e of enemies) if (!e.ground && !e.boss) drawEnemy(e);
  for (const e of enemies) if (e.boss) drawEnemy(e);
  drawPods();
  drawPlayerBullets();
  if (Game.state === 'play' || Game.state === 'pause') drawPlayer();
  drawParticles();
  drawEnemyBullets();
  drawTexts();
  ctx.restore();
  ctx.drawImage(getVignette(), 0, 0);
  if (R.flash > 0) { ctx.globalAlpha = Math.min(0.85, R.flash * 0.7); ctx.fillStyle = R.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------------------------------------------------------------------
// Manual (pause screen)
// ---------------------------------------------------------------------
const MANUAL_TABS = ['CONTROLS', 'WEAPONS', 'PILOTS', 'FIELD NOTES'];

function updateManual(dt) {
  const inGame = Game.state === 'pause';
  if (!inGame) Music.play('menu');
  const n = MANUAL_TABS.length;
  if (hit('left')) { Game.manualTab = (Game.manualTab + n - 1) % n; sfx('menuMove'); }
  if (hit('right')) { Game.manualTab = (Game.manualTab + 1) % n; sfx('menuMove'); }
  const tb = tappedButton();
  if (tb && tb.startsWith('tab')) { Game.manualTab = +tb.slice(3); sfx('menuMove'); }
  if (tb === 'tSound') { Audio2.setMuted(!Audio2.muted); if (!Audio2.muted) sfx('toggle'); }
  if (tb === 'tMusic') { Audio2.setMusicOff(!Audio2.musicOff); sfx('toggle'); }
  if (tb === 'tAuto') { Game.autoFire = !Game.autoFire; sfx('toggle'); }
  if (inGame) {
    if ((hit('pause') && Game.stateT > 0.05) || tb === 'resume') { resumePlay(); return; }
    if (hit('quit') || tb === 'abandon') { sfx('menuBack'); endRun(true); return; }
  } else if (tb === 'close' || (hit('back') && Game.stateT > 0.05)) { sfx('menuBack'); setState('title'); }
}

function drawManual() {
  const inGame = Game.state === 'pause';
  const T = Game.t;
  if (inGame) { ctx.fillStyle = 'rgba(2,4,10,0.8)'; ctx.fillRect(0, 0, W, H); }
  else {
    drawBackground(T * 30, T * 70, 0, 0, 1);
    ctx.fillStyle = 'rgba(2,4,10,0.72)'; ctx.fillRect(0, 0, W, H);
  }
  UI.btns.length = 0;
  const px = 14, py = 18, pw = W - 28, ph = H - 36;
  roundRect(px, py, pw, ph, 14); ctx.fillStyle = 'rgba(8,12,22,0.92)'; ctx.fill();
  ctx.strokeStyle = 'rgba(88,214,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();

  text('FLIGHT MANUAL', px + 20, py + 28, 16, '#e8eef8', 'left', '900', FONT_UI, 4);
  if (inGame) {
    const on = Math.floor(T * 1.5) % 2 === 0;
    text('PAUSED', px + pw - 20, py + 28, 12, on ? '#ffd24a' : '#9a8a50', 'right', 'bold', FONT_UI, 4);
  }

  const tw = (pw - 32) / 4;
  MANUAL_TABS.forEach((t, i) => button('tab' + i, px + 16 + i * tw, py + 50, tw - 6, 30, t, { selected: Game.manualTab === i, size: 10, spacing: 1.5 }));

  const cx = px + 24, cw = pw - 48;
  let y = py + 106;
  const head = (s) => { text(s, cx, y, 11, '#58d6ff', 'left', 'bold', FONT_UI, 3); y += 20; };
  const para = (s, color) => { y = wrapText(s, cx, y, cw, 17, 12, color || '#c7d0de'); y += 6; };

  switch (Game.manualTab) {
    case 0: {
      const rows = [
        ['MOVE', 'Arrow keys or WASD, or drag anywhere'],
        ['FIRE', 'Z, J or Space · hold to keep firing'],
        ['AUTO-FIRE', 'F toggles it · touch always auto-fires'],
        ['BOMB', 'X or K, or the round BOMB button'],
        ['PRECISION', 'Hold Shift or C for half speed'],
        ['PAUSE', 'Esc or P opens this manual'],
        ['ABANDON', 'Q while paused ends the run'],
        ['SOUND', 'M silences everything · N music only'],
      ];
      for (const [k, v] of rows) {
        ctx.fillStyle = 'rgba(255,255,255,0.035)'; ctx.fillRect(cx - 8, y - 13, cw + 16, 26);
        text(k, cx, y, 11, '#ffd24a', 'left', 'bold', FONT_UI, 2);
        text(v, cx + 104, y, 12, '#dfe6f2', 'left', 'normal');
        y += 32;
      }
      y += 10;
      head('YOUR CORE');
      para('Only the glowing core takes hits, not the whole ship. Hold precision to see exactly where it sits, then thread the gaps.');
      // core demo
      const dx = W / 2, dy = y + 44;
      drawShip(Game.pilotIdx, dx, dy, 0, 2, T);
      const core = PILOTS[Game.pilotIdx].core * 2;
      ctx.globalCompositeOperation = 'lighter'; glowDot(dx, dy, core, PILOTS[Game.pilotIdx].color, 0.8); ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(dx, dy, core + 1, 0, TAU); ctx.stroke();
      break;
    }
    case 1: {
      for (let i = 0; i < WEAPONS.length; i++) {
        const w = WEAPONS[i];
        roundRect(cx, y - 14, 28, 28, 7); ctx.fillStyle = '#10141c'; ctx.fill(); ctx.strokeStyle = w.color; ctx.lineWidth = 2; ctx.stroke();
        text(w.key, cx + 14, y + 1, 14, w.color, 'center', '900');
        text(w.name, cx + 42, y - 6, 12, w.color, 'left', 'bold', FONT_UI, 2);
        text(w.desc, cx + 42, y + 10, 11, '#c7d0de', 'left', 'normal');
        y += 44;
      }
      y += 4;
      head('POWER');
      para('Five weapons, five levels each. A lettered pod swaps your weapon and keeps your level. Your current letter again, or a gold P, raises the level toward 5.');
      // gold P vs weapon pod
      const gy = y + 14;
      ctx.beginPath(); ctx.arc(cx + 14, gy, 12, 0, TAU); ctx.fillStyle = GOLD; ctx.fill(); ctx.strokeStyle = '#fff2a8'; ctx.lineWidth = 2; ctx.stroke();
      text('P', cx + 14, gy + 1, 13, '#4a3000', 'center', '900');
      text('Gold round pod: power up', cx + 34, gy, 11, '#e8d8a0', 'left', 'bold');
      roundRect(cx + 234, gy - 10, 28, 20, 7); ctx.fillStyle = '#10141c'; ctx.fill(); ctx.strokeStyle = WEAPONS[2].color; ctx.stroke();
      text('P', cx + 248, gy + 1, 12, WEAPONS[2].color, 'center', '900');
      text('Capsule: weapon', cx + 270, gy, 11, '#c7d0de', 'left', 'bold');
      y += 40;
      para('Arc never misses and never needs aiming, but strikes only a limited number of targets per pulse, two at level 1 and six at level 5, with damage falling off along each chain.', '#aab6c9');
      break;
    }
    case 2: {
      for (let i = 0; i < PILOTS.length; i++) {
        const p = PILOTS[i];
        ctx.fillStyle = i === Game.pilotIdx ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
        ctx.fillRect(cx - 8, y - 26, cw + 16, 72);
        drawShip(i, cx + 24, y + 8, 0, 1.2, T);
        text(p.name, cx + 60, y - 6, 15, p.color, 'left', '900', FONT_UI, 3);
        text(p.blurb, cx + 60, y + 16, 11, '#c7d0de', 'left', 'normal');
        y += 82;
      }
      para('Pilots are real trade-offs, not palette swaps. Aegis carries momentum through every turn; Havoc hits hard but slowly; Nyx sprays feather-light rounds.', '#aab6c9');
      break;
    }
    case 3: {
      head('PODS');
      para('Pods travel in a straight line and bounce off the screen edges. Each survives three bounces, blinks on its last, and pops on the fourth, so a pod you miss will usually swing back past you.');
      para('Weapon pods cycle to the next weapon every ten seconds. The ring around a capsule shows how long until it changes.');
      head('CHAIN');
      para('Kill enemies in quick succession to build a chain. Every five kills adds ×1 to the score multiplier, up to ×8. Wipe out a whole formation for a bonus.');
      head('WAVES & BOSSES');
      para('Waves escalate without end. Every fifth wave brings a boss, drawn from four designs. Each boss cycles three attack patterns and grows more aggressive as its health falls.');
      head('BOMBS');
      para('A bomb erases every enemy bullet, damages everything on screen and shields you briefly. Losing a ship refills your bombs and costs two power levels.');
      break;
    }
  }

  // toggles
  const ty = py + ph - 108;
  const tgw = (pw - 48) / 3;
  const tog = (id, i, label, on) => {
    button(id, px + 16 + i * (tgw + 8), ty, tgw, 36, '', { selected: on, color: on ? '#62f0a0' : '#58d6ff', selFill: 'rgba(98,240,160,0.1)' });
    text(label, px + 16 + i * (tgw + 8) + tgw / 2, ty + 12, 9, '#8f9bb3', 'center', 'bold', FONT_UI, 1.5);
    text(on ? 'ON' : 'OFF', px + 16 + i * (tgw + 8) + tgw / 2, ty + 26, 11, on ? '#62f0a0' : '#ff8a8a', 'center', 'bold', FONT_UI, 2);
  };
  tog('tSound', 0, 'SOUND · M', !Audio2.muted);
  tog('tMusic', 1, 'MUSIC · N', !Audio2.musicOff);
  tog('tAuto', 2, 'AUTO-FIRE · F', Game.autoFire);

  const byy = py + ph - 60;
  if (inGame) {
    button('resume', px + 16, byy, (pw - 40) * 0.6, 44, 'RESUME · ESC', { selected: true, size: 14, spacing: 3 });
    button('abandon', px + 24 + (pw - 40) * 0.6, byy, (pw - 40) * 0.4, 44, 'ABANDON · Q', { size: 12, spacing: 2, textColor: '#ff9a9a' });
  } else {
    button('close', px + 16, byy, pw - 32, 44, 'BACK', { selected: true, size: 14, spacing: 4 });
  }
  if (!Input.touchMode) text('← → TURN PAGES', W / 2, py + ph - 124, 9, '#5d6880', 'center', 'bold', FONT_UI, 2);
}

// ---------------------------------------------------------------------
// Game over
// ---------------------------------------------------------------------
function updateOver(dt) {
  if (Run) stepWorld(dt, false);
  if (Game.stateT < 1.0) return;
  if (hit('left') || hit('right') || hit('up') || hit('down')) { Game.menuIdx = 1 - Game.menuIdx; sfx('menuMove'); }
  const tb = tappedButton();
  let c = tb;
  if (!c && hit('confirm')) c = Game.menuIdx === 0 ? 'retry' : 'menu';
  if (!c && hit('pause')) c = 'menu';
  if (c === 'retry') launch();
  else if (c === 'menu') { sfx('menuBack'); Run = null; setState('title'); }
}

function drawOver() {
  const r = Game.lastResult, T = Game.t, k = Math.min(1, Game.stateT * 1.5);
  ctx.fillStyle = 'rgba(2,4,10,' + (0.72 * k).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
  UI.btns.length = 0;
  if (!r) return;
  ctx.globalAlpha = k;
  text(r.abandoned ? 'RUN ABANDONED' : 'SHOT DOWN', W / 2, 150, r.abandoned ? 30 : 40, r.abandoned ? '#c9d2e3' : '#ff5f6a', 'center', '900', FONT_UI, 8);
  text('WAVE ' + r.wave + ' · ' + r.pilot.name + ' · ' + r.diff.name, W / 2, 192, 11, '#8f9bb3', 'center', 'bold', FONT_UI, 3);
  text('SCORE', W / 2, 250, 11, '#8f9bb3', 'center', 'bold', FONT_UI, 4);
  text(pad(r.score, 8), W / 2, 290, 44, '#ffffff', 'center', 'bold', FONT_NUM);
  if (r.newHi && Math.floor(T * 3) % 2 === 0) text('NEW HIGH SCORE', W / 2, 332, 14, '#ffd24a', 'center', 'bold', FONT_UI, 5);
  const rows = [['BEST CHAIN', String(r.chain)], ['KILLS', String(r.kills)], ['BOSSES DOWN', String(r.bosses)], ['HIGH SCORE', pad(Game.hi, 8)]];
  let y = 384;
  for (const [a, b] of rows) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(90, y - 13, W - 180, 26);
    text(a, 104, y, 11, '#8f9bb3', 'left', 'bold', FONT_UI, 2);
    text(b, W - 104, y, 14, '#e8eef8', 'right', 'bold', FONT_NUM);
    y += 32;
  }
  ctx.globalAlpha = 1;
  if (Game.stateT > 1.0) {
    button('retry', W / 2 - 150, 570, 140, 48, 'RETRY', { selected: Game.menuIdx === 0, size: 16, spacing: 4 });
    button('menu', W / 2 + 10, 570, 140, 48, 'MENU', { selected: Game.menuIdx === 1, size: 16, spacing: 4 });
  }
}

// ---------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------
function update(dt) {
  Game.t += dt; Game.stateT += dt;
  if (menuNoteT > 0) menuNoteT -= dt;
  globalKeys();
  switch (Game.state) {
    case 'title': updateTitle(dt); break;
    case 'pilot': updatePilot(dt); break;
    case 'diff': updateDiff(dt); break;
    case 'play': updatePlay(dt); break;
    case 'pause': case 'manual': updateManual(dt); break;
    case 'over': updateOver(dt); break;
  }
}

function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = '#04060b'; ctx.fillRect(0, 0, W, H);
  switch (Game.state) {
    case 'title': drawTitle(); break;
    case 'pilot': drawPilot(); break;
    case 'diff': drawDiff(); break;
    case 'play': drawWorld(); drawHUD(); UI.btns.length = 0; break;
    case 'pause': drawWorld(); drawHUD(); drawManual(); break;
    case 'manual': drawManual(); break;
    case 'over': if (Run) { drawWorld(); drawHUD(); } drawOver(); break;
  }
  if (menuNote && menuNoteT > 0) {
    ctx.globalAlpha = Math.min(1, menuNoteT * 3);
    roundRect(W / 2 - 80, H - 150, 160, 28, 14); ctx.fillStyle = 'rgba(8,12,22,0.85)'; ctx.fill();
    text(menuNote, W / 2, H - 135, 11, '#cfe3ff', 'center', 'bold', FONT_UI, 2);
    ctx.globalAlpha = 1;
  }
}

let lastTime = performance.now();
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  const steps = Math.max(1, Math.ceil(dt / (1 / 60)));
  const sub = dt / steps;
  for (let i = 0; i < steps; i++) { update(sub); endInputFrame(); }
  render();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------
// Backgrounding: suspend audio, leave the game paused on the manual
// ---------------------------------------------------------------------
function onHidden() {
  Audio2.suspend();
  Input.down.clear(); Input.drag = null;
  if (Game.state === 'play') { Game.manualTab = 0; openPause(); }
}
function onVisible() {
  Audio2.resume();
  lastTime = performance.now();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) onHidden(); else onVisible(); });
window.addEventListener('pagehide', onHidden);
window.addEventListener('pageshow', () => { if (!document.hidden) onVisible(); });
document.addEventListener('freeze', onHidden);
document.addEventListener('resume', onVisible);

// warm the background cache so the first frames don't hitch
getBiome(0); getHaze(); getVignette();
requestAnimationFrame(frame);
</script>
</body>
</html>
