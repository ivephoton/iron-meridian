<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060b">
<meta name="description" content="Iron Meridian — a vertical scrolling shooter in one HTML file.">
<title>Iron Meridian</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2304060b'/%3E%3Cpath d='M32 6 L40 30 L58 42 L58 48 L38 44 L35 56 L29 56 L26 44 L6 48 L6 42 L24 30 Z' fill='%2394e6ff'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #04060b;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; touch-action: none; }
  noscript { color: #9ab; font: 16px system-ui, sans-serif; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" width="480" height="720" tabindex="0" aria-label="Iron Meridian game canvas"></canvas>
<noscript>Iron Meridian needs JavaScript to run.</noscript>
<script>
'use strict';
/* =====================================================================
   IRON MERIDIAN
   A vertical scrolling shooter. Plain JavaScript, one canvas, no assets.
   ===================================================================== */

// ---------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------
const W = 480, H = 720;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function wrapAngle(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function pad(n, len) { let s = String(Math.floor(n)); while (s.length < len) s = '0' + s; return s; }

// Seeded PRNG for backgrounds, so terrain is stable
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const FONT_UI = "'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
const FONT_NUM = "ui-monospace, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace";

// ---------------------------------------------------------------------
// Canvas & scaling
// ---------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1, dpr = 1;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  viewScale = Math.min(vw / W, vh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssW = Math.floor(W * viewScale), cssH = Math.floor(H * viewScale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
resize();

// ---------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------
const Input = {
  down: new Set(),
  pressed: new Set(),     // edge-triggered this frame
  touchMode: false,       // set once a touch has been seen: touch always auto-fires
  drag: null,             // {id, sx, sy, px, py} in game coordinates
  taps: [],               // queued taps in game coordinates for UI hit-testing
  anyKeyThisFrame: false,
};

const KEYMAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  fire: ['KeyZ', 'KeyJ', 'Space'],
  bomb: ['KeyX', 'KeyK'],
  focus: ['ShiftLeft', 'ShiftRight', 'KeyC'],
  pause: ['Escape', 'KeyP'],
  quit: ['KeyQ'],
  auto: ['KeyF'],
  mute: ['KeyM'], music: ['KeyN'],
  confirm: ['Enter', 'NumpadEnter', 'Space', 'KeyZ', 'KeyJ'],
  back: ['Escape', 'Backspace', 'KeyX', 'KeyK'],
};
const GAME_KEYS = new Set([].concat(...Object.values(KEYMAP)));

function held(action) { for (const k of KEYMAP[action]) if (Input.down.has(k)) return true; return false; }
function hit(action) { for (const k of KEYMAP[action]) if (Input.pressed.has(k)) return true; return false; }

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  Audio2.unlock();
  if (!e.repeat) Input.pressed.add(e.code);
  if (GAME_KEYS.has(e.code) && e.code !== 'Escape') Input.touchMode = false;
  Input.down.add(e.code);
  Input.anyKeyThisFrame = true;
});
window.addEventListener('keyup', e => { Input.down.delete(e.code); });
window.addEventListener('blur', () => { Input.down.clear(); Input.drag = null; });

function toGame(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  Audio2.unlock();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  canvas.focus({ preventScroll: true });
  if (e.pointerType === 'touch' || e.pointerType === 'pen') Input.touchMode = true;
  const p = toGame(e.clientX, e.clientY);
  Input.taps.push({ x: p.x, y: p.y, id: e.pointerId, type: e.pointerType });
  if (!Input.drag) Input.drag = { id: e.pointerId, sx: p.x, sy: p.y, px: p.x, py: p.y, fresh: true, used: false };
});
canvas.addEventListener('pointermove', e => {
  if (!Input.drag || Input.drag.id !== e.pointerId) return;
  const p = toGame(e.clientX, e.clientY);
  Input.drag.px = p.x; Input.drag.py = p.y;
});
function endPointer(e) { if (Input.drag && Input.drag.id === e.pointerId) Input.drag = null; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
// iOS only unlocks audio inside certain gestures, so try on these too
window.addEventListener('touchend', () => Audio2.unlock(), { passive: true });
window.addEventListener('click', () => Audio2.unlock());

function endInputFrame() {
  Input.pressed.clear();
  Input.taps.length = 0;
  Input.anyKeyThisFrame = false;
}

// ---------------------------------------------------------------------
// Audio: every sound and all four music tracks are synthesised here
// ---------------------------------------------------------------------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

const Audio2 = {
  ac: null, master: null, sfxBus: null, musicBus: null, musicIn: null, fxSend: null,
  noiseBuf: null, muted: false, musicOff: false, last: Object.create(null), failed: false,

  unlock() {
    if (this.failed) return;
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.failed = true; return; }
      try { this.ac = new AC(); } catch (e) { this.failed = true; return; }
      this.build();
    }
    if (this.ac.state !== 'running' && !document.hidden) {
      const p = this.ac.resume(); if (p && p.catch) p.catch(() => {});
    }
  },

  build() {
    const ac = this.ac;
    this.master = ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.25;
    this.master.connect(comp); comp.connect(ac.destination);

    this.sfxBus = ac.createGain(); this.sfxBus.gain.value = 0.6; this.sfxBus.connect(this.master);
    this.musicBus = ac.createGain(); this.musicBus.gain.value = this.musicOff ? 0 : 0.4; this.musicBus.connect(this.master);
    this.musicIn = ac.createGain(); this.musicIn.connect(this.musicBus);

    // A dotted-eighth feedback delay gives leads and bells some space
    const delay = ac.createDelay(1.5); delay.delayTime.value = 0.32;
    const fb = ac.createGain(); fb.gain.value = 0.33;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2600;
    const wet = ac.createGain(); wet.gain.value = 0.28;
    this.fxSend = ac.createGain();
    this.fxSend.connect(delay); delay.connect(tone); tone.connect(fb); fb.connect(delay);
    tone.connect(wet); wet.connect(this.musicBus);

    const len = ac.sampleRate * 2;
    this.noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    // iOS unlock: play one silent frame inside the gesture
    const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, ac.sampleRate);
    s.connect(ac.destination); s.start(0);
  },

  ready() { return this.ac && this.ac.state === 'running'; },

  suspend() {
    if (this.ac && this.ac.state === 'running') { const p = this.ac.suspend(); if (p && p.catch) p.catch(() => {}); }
  },
  resume() {
    if (this.ac && this.ac.state !== 'running' && !document.hidden) { const p = this.ac.resume(); if (p && p.catch) p.catch(() => {}); }
  },

  setMuted(m) {
    this.muted = m;
    if (this.ac) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.ac.currentTime, 0.03);
  },
  setMusicOff(m) {
    this.musicOff = m;
    if (this.ac) this.musicBus.gain.setTargetAtTime(m ? 0 : 0.4, this.ac.currentTime, 0.05);
  },

  // ---- primitive voices ----
  tone(dest, t, f, dur, o) {
    const ac = this.ac;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * o.slide), t + (o.a || 0.004) + (o.hold || 0) + dur);
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    const vol = o.vol == null ? 0.2 : o.vol, a = o.a == null ? 0.004 : o.a, hold = o.hold || 0;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    if (hold) g.gain.setValueAtTime(vol, t + a + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + dur);
    let node = osc;
    if (o.lp) {
      const fl = ac.createBiquadFilter(); fl.type = 'lowpass';
      fl.frequency.setValueAtTime(o.lp, t);
      if (o.lpEnd) fl.frequency.exponentialRampToValueAtTime(o.lpEnd, t + a + hold + dur);
      fl.Q.value = o.q == null ? 0.8 : o.q;
      osc.connect(fl); node = fl;
    }
    node.connect(g); g.connect(dest);
    if (o.send) g.connect(this.fxSend);
    osc.start(t); osc.stop(t + a + hold + dur + 0.05);
  },

  noise(dest, t, dur, o) {
    const ac = this.ac;
    const src = ac.createBufferSource(); src.buffer = this.noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = o.ft || 'lowpass';
    fl.frequency.setValueAtTime(o.f || 2000, t);
    if (o.fEnd) fl.frequency.exponentialRampToValueAtTime(o.fEnd, t + dur);
    fl.Q.value = o.q == null ? 0.7 : o.q;
    const g = ac.createGain();
    const vol = o.vol == null ? 0.2 : o.vol, a = o.a || 0.002;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
    src.connect(fl); fl.connect(g); g.connect(dest);
    if (o.send) g.connect(this.fxSend);
    src.start(t, Math.random() * 1.5); src.stop(t + a + dur + 0.05);
  },

  play(name, arg) {
    if (!this.ready() || this.muted) return;
    const fx = SFX[name]; if (!fx) return;
    const now = this.ac.currentTime;
    const th = fx.th || 0;
    if (th && this.last[name] && now - this.last[name] < th) return;
    this.last[name] = now;
    try { fx.fn(this, now + 0.005, this.sfxBus, arg); } catch (e) { /* never let audio break the game */ }
  },
};
const sfx = (n, a) => Audio2.play(n, a);

const SFX = {
  vulcan: { th: 0.075, fn(A, t, d) { A.tone(d, t, rand(880, 980), 0.045, { type: 'square', vol: 0.045, slide: 0.45, lp: 3200 }); } },
  lance: { th: 0.11, fn(A, t, d) { A.tone(d, t, 1500, 0.08, { type: 'sawtooth', vol: 0.035, slide: 0.3, lp: 5200 }); A.tone(d, t, 3000, 0.04, { type: 'sine', vol: 0.03, slide: 0.5 }); } },
  plasma: { th: 0.16, fn(A, t, d) { A.tone(d, t, 240, 0.14, { type: 'sine', vol: 0.12, slide: 2.2 }); A.tone(d, t, 480, 0.1, { type: 'triangle', vol: 0.04, slide: 1.6 }); } },
  splash: { th: 0.07, fn(A, t, d) { A.noise(d, t, 0.22, { f: 1100, fEnd: 180, vol: 0.14 }); A.tone(d, t, 150, 0.16, { type: 'sine', vol: 0.12, slide: 0.45 }); } },
  missile: { th: 0.14, fn(A, t, d) { A.noise(d, t, 0.2, { ft: 'bandpass', f: 2400, fEnd: 700, q: 2, vol: 0.09 }); } },
  nose: { th: 0.1, fn(A, t, d) { A.tone(d, t, 1250, 0.03, { type: 'square', vol: 0.025, slide: 0.6, lp: 3000 }); } },
  arc: { th: 0.085, fn(A, t, d) {
    A.noise(d, t, 0.09, { ft: 'bandpass', f: rand(2500, 4200), q: 1.5, vol: 0.11 });
    A.tone(d, t, rand(1800, 2600), 0.05, { type: 'sawtooth', vol: 0.025, slide: 0.35, lp: 6000 });
  } },
  hit: { th: 0.05, fn(A, t, d) { A.tone(d, t, 260, 0.025, { type: 'square', vol: 0.025, slide: 0.7, lp: 1800 }); } },
  armor: { th: 0.08, fn(A, t, d) { A.tone(d, t, 140, 0.035, { type: 'square', vol: 0.04, slide: 0.8, lp: 900 }); } },
  boomS: { th: 0.05, fn(A, t, d) { A.noise(d, t, 0.28, { f: 2200, fEnd: 260, vol: 0.2 }); A.tone(d, t, 170, 0.2, { type: 'sine', vol: 0.16, slide: 0.35 }); } },
  boomM: { th: 0.09, fn(A, t, d) { A.noise(d, t, 0.55, { f: 1600, fEnd: 140, vol: 0.3 }); A.tone(d, t, 95, 0.45, { type: 'sine', vol: 0.32, slide: 0.35 }); } },
  boomL: { th: 0.18, fn(A, t, d) {
    A.noise(d, t, 1.4, { f: 1400, fEnd: 70, vol: 0.42 }); A.tone(d, t, 70, 1.0, { type: 'sine', vol: 0.5, slide: 0.3 });
    A.noise(d, t + 0.18, 0.9, { f: 900, fEnd: 90, vol: 0.25 });
  } },
  eshot: { th: 0.1, fn(A, t, d) { A.tone(d, t, 620, 0.06, { type: 'triangle', vol: 0.03, slide: 0.55 }); } },
  pickup: { fn(A, t, d) { [72, 76, 79].forEach((m, i) => A.tone(d, t + i * 0.045, mtof(m), 0.08, { type: 'square', vol: 0.06, lp: 4000 })); } },
  power: { fn(A, t, d, lvl) {
    const base = 67 + (lvl || 1) * 2;
    [0, 4, 7, 12].forEach((s, i) => A.tone(d, t + i * 0.04, mtof(base + s), 0.1, { type: 'square', vol: 0.06, lp: 5000 }));
    A.tone(d, t + 0.16, mtof(base + 24), 0.25, { type: 'sine', vol: 0.05 });
  } },
  maxed: { fn(A, t, d) { [72, 76, 79, 84, 88].forEach((m, i) => A.tone(d, t + i * 0.05, mtof(m), 0.18, { type: 'square', vol: 0.05, lp: 5000 })); } },
  swap: { fn(A, t, d) { A.tone(d, t, mtof(79), 0.06, { type: 'square', vol: 0.06 }); A.tone(d, t + 0.06, mtof(86), 0.12, { type: 'square', vol: 0.06 }); } },
  pop: { th: 0.05, fn(A, t, d) { A.tone(d, t, 900, 0.08, { type: 'sine', vol: 0.07, slide: 0.4 }); } },
  cycle: { th: 0.2, fn(A, t, d) { A.tone(d, t, 1320, 0.05, { type: 'triangle', vol: 0.035 }); } },
  chain: { th: 0.06, fn(A, t, d, n) { A.tone(d, t, mtof(72 + Math.min(24, n || 0)), 0.05, { type: 'square', vol: 0.03, lp: 5000 }); } },
  cancel: { th: 0.1, fn(A, t, d) { for (let i = 0; i < 4; i++) A.tone(d, t + i * 0.03, mtof(88 + i * 3), 0.06, { type: 'sine', vol: 0.035 }); } },
  bomb: { fn(A, t, d) {
    A.tone(d, t, 220, 1.3, { type: 'sine', vol: 0.5, slide: 0.12 });
    A.noise(d, t, 1.7, { f: 3500, fEnd: 90, vol: 0.5 });
    A.tone(d, t, 90, 0.9, { type: 'sawtooth', vol: 0.14, slide: 0.5, lp: 500 });
  } },
  death: { fn(A, t, d) {
    A.noise(d, t, 1.6, { f: 2600, fEnd: 60, vol: 0.5 });
    A.tone(d, t, 420, 1.2, { type: 'sawtooth', vol: 0.12, slide: 0.1, lp: 1400, lpEnd: 200 });
    A.tone(d, t, 110, 1.0, { type: 'sine', vol: 0.4, slide: 0.25 });
  } },
  respawn: { fn(A, t, d) { A.tone(d, t, 300, 0.4, { type: 'triangle', vol: 0.08, slide: 3 }); } },
  warning: { fn(A, t, d) {
    for (let i = 0; i < 6; i++) A.tone(d, t + i * 0.28, i % 2 ? 330 : 440, 0.24, { type: 'sawtooth', vol: 0.08, lp: 1800, hold: 0.02 });
  } },
  bossShot: { th: 0.12, fn(A, t, d) { A.tone(d, t, 380, 0.09, { type: 'square', vol: 0.03, slide: 0.5, lp: 1500 }); } },
  menuMove: { th: 0.03, fn(A, t, d) { A.tone(d, t, 660, 0.04, { type: 'square', vol: 0.045, lp: 3000 }); } },
  menuOk: { fn(A, t, d) { A.tone(d, t, 880, 0.05, { type: 'square', vol: 0.05 }); A.tone(d, t + 0.06, 1320, 0.1, { type: 'square', vol: 0.05 }); } },
  menuBack: { fn(A, t, d) { A.tone(d, t, 520, 0.08, { type: 'square', vol: 0.045, slide: 0.6 }); } },
  toggle: { fn(A, t, d) { A.tone(d, t, 1040, 0.05, { type: 'triangle', vol: 0.06 }); } },
};

// ---- Music: a lookahead step sequencer -------------------------------
// Notes are scheduled a little ahead on the audio clock, so tempo never
// depends on the frame rate.
const Inst = {
  out() { return Audio2.musicIn; },
  kick(t, v) {
    const A = Audio2, ac = A.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(this.out()); o.start(t); o.stop(t + 0.36);
  },
  snare(t, v) {
    Audio2.noise(this.out(), t, 0.16, { ft: 'bandpass', f: 1900, q: 0.6, vol: v });
    Audio2.tone(this.out(), t, 190, 0.08, { type: 'triangle', vol: v * 0.5, slide: 0.6 });
  },
  hat(t, v, open) { Audio2.noise(this.out(), t, open ? 0.14 : 0.03, { ft: 'highpass', f: 7200, vol: v }); },
  crash(t, v) { Audio2.noise(this.out(), t, 1.2, { ft: 'highpass', f: 4500, fEnd: 2500, vol: v, send: true }); },
  tom(t, m, v) { Audio2.tone(this.out(), t, mtof(m), 0.22, { type: 'sine', vol: v, slide: 0.5 }); },
  bass(t, m, dur, v, bright) {
    Audio2.tone(this.out(), t, mtof(m), dur, { type: 'sawtooth', vol: v, lp: bright || 900, lpEnd: 180, q: 3 });
    Audio2.tone(this.out(), t, mtof(m - 12), dur, { type: 'square', vol: v * 0.35, lp: 400 });
  },
  sub(t, m, dur, v) { Audio2.tone(this.out(), t, mtof(m), dur, { type: 'sine', vol: v, a: 0.02 }); },
  lead(t, m, dur, v) {
    Audio2.tone(this.out(), t, mtof(m), dur, { type: 'square', vol: v, lp: 3400, send: true, hold: dur * 0.3 });
    Audio2.tone(this.out(), t, mtof(m), dur, { type: 'sawtooth', vol: v * 0.5, detune: 9, lp: 2600, hold: dur * 0.3 });
  },
  arp(t, m, v) { Audio2.tone(this.out(), t, mtof(m), 0.09, { type: 'square', vol: v, lp: 2400, send: true }); },
  bell(t, m, v, dur) {
    Audio2.tone(this.out(), t, mtof(m), dur || 1.4, { type: 'sine', vol: v, send: true });
    Audio2.tone(this.out(), t, mtof(m + 19), (dur || 1.4) * 0.4, { type: 'sine', vol: v * 0.25, send: true });
  },
  pad(t, notes, dur, v) {
    for (const m of notes) {
      Audio2.tone(this.out(), t, mtof(m), 0.6, { type: 'sawtooth', vol: v, a: dur * 0.35, hold: dur * 0.45, lp: 900, q: 0.5, detune: -7, send: true });
      Audio2.tone(this.out(), t, mtof(m), 0.6, { type: 'triangle', vol: v, a: dur * 0.35, hold: dur * 0.45, detune: 7 });
    }
  },
  stab(t, notes, v) { for (const m of notes) Audio2.tone(this.out(), t, mtof(m), 0.16, { type: 'sawtooth', vol: v, lp: 2200, lpEnd: 400, q: 4 }); },
  glide(t, m1, m2, dur, v) { Audio2.tone(this.out(), t, mtof(m1), dur, { type: 'sine', vol: v, a: 0.3, hold: dur * 0.5, slide: mtof(m2) / mtof(m1), send: true }); },

const Music = {
  name: null, tr: null, step: 0, next: 0,
  play(name) {
    if (name === this.name) return;
    this.name = name; this.tr = TRACKS[name] || null; this.step = 0;
    if (Audio2.ac) this.next = Audio2.ac.currentTime + 0.06;
  },
  tick() {
    const A = Audio2;
    if (!A.ready() || !this.tr || A.musicOff || A.muted) { if (A.ac) this.next = A.ac.currentTime + 0.05; return; }
    const now = A.ac.currentTime, spb = 60 / this.tr.bpm / 4;
    if (this.next < now - 0.25) this.next = now + 0.05; // recovered from a stall: don't burst
    let guard = 0;
    while (this.next < now + 0.14 && guard++ < 32) {
      const total = this.tr.bars * 16, s = this.step % total;
      try { this.tr.play(Math.floor(s / 16), s % 16, this.next, spb); } catch (e) { /* ignore */ }
      this.next += spb; this.step++;
    }
  },
};
setInterval(() => Music.tick(), 25);

const BIOMES = [
  { name: 'COASTLINE', base: '#0b1a24', patch: '#17271f', patch2: '#1c2f25', line: 'rgba(120,180,200,0.07)', block: '#22332c', blockTop: '#2d4238', light: '#6fd6ff', water: true },

  { name: 'NIGHT GRID', base: '#080a18', patch: '#0e1224', patch2: '#12172d', line: 'rgba(120,130,255,0.09)', block: '#151a33', blockTop: '#1d2445', light: '#8f9bff', grid: true },
];
const TILE_H = 1024;
const bgCache = [];

// Draw something at y, and again one tile up or down if it crosses an edge,
// so the tile repeats without a seam. ext is how far it reaches from y.
function drawWrapped(g, fn, y, ext) {
  fn(y); if (y + ext > TILE_H) fn(y - TILE_H); if (y - ext < 0) fn(y + TILE_H);
}

function buildBiome(index) {
  const b = BIOMES[index];
  const c = document.createElement('canvas');
  c.width = W; c.height = TILE_H;
  const g = c.getContext('2d');
  const R = mulberry32(1234 + index * 977);
  const rr = (a, bb) => a + R() * (bb - a);

  g.fillStyle = b.base; g.fillRect(0, 0, W, TILE_H);

  // big organic patches (land masses, slag fields, dune shadows)
  for (let i = 0; i < 9; i++) {
    const cx = rr(-60, W + 60), cy = rr(0, TILE_H), rad = rr(80, 200);
    const pts = []; const n = 14;
    for (let k = 0; k < n; k++) { const a = k / n * TAU; const rv = rad * rr(0.65, 1.15); pts.push([Math.cos(a) * rv, Math.sin(a) * rv * rr(0.8, 1.3)]); }
    drawWrapped(g, yy => {
      g.fillStyle = i % 3 === 0 ? b.patch2 : b.patch;
      g.beginPath();
      pts.forEach(([px, py], k) => k ? g.lineTo(cx + px, yy + py) : g.moveTo(cx + px, yy + py));
      g.closePath(); g.fill();
      if (b.water) { g.strokeStyle = 'rgba(140,210,220,0.08)'; g.lineWidth = 3; g.stroke(); }
    }, cy, rad * 1.5);
  }

  if (b.dunes) {
    for (let i = 0; i < 40; i++) {
      const y = rr(0, TILE_H), x = rr(-40, W), len = rr(80, 220), amp = rr(6, 16), lw = rr(2, 5);
      drawWrapped(g, yy => {
        g.strokeStyle = 'rgba(255,220,160,0.05)'; g.lineWidth = lw;
        g.beginPath(); g.moveTo(x, yy);
        g.quadraticCurveTo(x + len / 2, yy - amp, x + len, yy); g.stroke();
      }, y, 30);
    }
  }

  if (b.plates) {
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 2;
    for (let y = 0; y < TILE_H; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    for (let x = 0; x <= W; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, TILE_H); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,0.035)';
    for (let y = 0; y < TILE_H; y += 64) for (let x = 0; x < W; x += 80) { g.fillRect(x + 4, y + 4, 2, 2); g.fillRect(x + 74, y + 4, 2, 2); g.fillRect(x + 4, y + 58, 2, 2); g.fillRect(x + 74, y + 58, 2, 2); }
    // hazard stripes and pipes
    for (let i = 0; i < 6; i++) {
      const y = rr(0, TILE_H); const x = rr(0, W - 120);
      drawWrapped(g, yy => {
        g.save(); g.beginPath(); g.rect(x, yy, 120, 12); g.clip();
        for (let s = -20; s < 140; s += 16) { g.fillStyle = 'rgba(255,170,60,0.07)'; g.beginPath(); g.moveTo(x + s, yy + 12); g.lineTo(x + s + 8, yy + 12); g.lineTo(x + s + 20, yy); g.lineTo(x + s + 12, yy); g.fill(); }
        g.restore();
      }, y, 20);
    }
    for (let i = 0; i < 5; i++) {
      const x = rr(20, W - 20);
      g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x - 7, 0, 14, TILE_H);
      g.fillStyle = 'rgba(255,255,255,0.03)'; g.fillRect(x - 5, 0, 3, TILE_H);
    }
  }

  if (b.grid) {
    g.strokeStyle = b.line; g.lineWidth = 1;
    for (let y = 0; y < TILE_H; y += 32) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
    for (let x = 0; x <= W; x += 32) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, TILE_H); g.stroke(); }
  } else {
    // roads / seams
    g.strokeStyle = b.line; g.lineWidth = 6;
    for (let i = 0; i < 3; i++) { const x = rr(40, W - 40); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, TILE_H); g.stroke(); }
    for (let i = 0; i < 5; i++) { const y = rr(0, TILE_H), dy = rr(-40, 40); drawWrapped(g, yy => { g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy + dy); g.stroke(); }, y, 50); }
  }

  // structures: blocks with a lit top face and a shadow
  for (let i = 0; i < 70; i++) {
    const w = rr(12, 44), h = rr(12, 40), x = rr(0, W - w), y = rr(0, TILE_H), lit = R() < 0.35;
    drawWrapped(g, yy => {
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x + 5, yy + 6, w, h);
      g.fillStyle = b.block; g.fillRect(x, yy, w, h);
      g.fillStyle = b.blockTop; g.fillRect(x, yy, w, Math.min(5, h * 0.3));
      if (lit) { g.fillStyle = b.light; g.globalAlpha = 0.35; g.fillRect(x + w * 0.5 - 1, yy + h * 0.5 - 1, 2, 2); g.globalAlpha = 1; }
    }, y, h + 10);
  }

  // craters
  for (let i = 0; i < 14; i++) {
    const x = rr(0, W), y = rr(0, TILE_H), r = rr(6, 22);
    drawWrapped(g, yy => {
      g.fillStyle = 'rgba(0,0,0,0.28)'; g.beginPath(); g.ellipse(x, yy, r, r * 0.8, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 2; g.beginPath(); g.ellipse(x - 1, yy - 1, r, r * 0.8, 0, Math.PI, TAU); g.stroke();
    }, y, r + 2);
  }

  // speckle
  for (let i = 0; i < 900; i++) {
    g.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.12)';
    const s = rr(1, 3); g.fillRect(rr(0, W), rr(0, TILE_H), s, s);
  }
  return c;
}

function getBiome(i) { if (!bgCache[i]) bgCache[i] = buildBiome(i); return bgCache[i]; }

// Cloud / haze layer shared by every biome
let hazeTile = null;
function getHaze() {
  if (hazeTile) return hazeTile;
  const c = document.createElement('canvas'); c.width = W; c.height = TILE_H;
  const g = c.getContext('2d'); const R = mulberry32(99);
  for (let i = 0; i < 16; i++) {
    const x = R() * W, y = R() * TILE_H, r = 60 + R() * 110;
    drawWrapped(g, yy => {
      const gr = g.createRadialGradient(x, yy, 0, x, yy, r);
      gr.addColorStop(0, 'rgba(200,220,255,0.07)'); gr.addColorStop(1, 'rgba(200,220,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, yy, r, 0, TAU); g.fill();
    }, y, r);
  }
  hazeTile = c; return c;
}

let vignette = null;
function getVignette() {
  if (vignette) return vignette;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  vignette = c; return c;
}

const MAX_PARTS = 1100;
function part(o) {
  if (parts.length >= MAX_PARTS) { if (o.type === 'smoke' || o.type === 'debris') return; parts.shift(); }
  o.life = o.max = o.life || 0.5;
  o.vx = o.vx || 0; o.vy = o.vy || 0;
  parts.push(o);
}

function sparks(x, y, n, color, spMin, spMax, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(spMin || 60, spMax || 260);
    part({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.18, life || 0.45), color, size: rand(1, 2.2), drag: 3 });
  }
}

function explode(x, y, size, color) {
  color = color || '#ffb347';
  const s = size;
  part({ type: 'ring', x, y, r: 4 * s, vr: 120 * Math.sqrt(s), life: 0.32 + 0.06 * s, color: '#ffe9b0', width: 2 + s });
  part({ type: 'glow', x, y, size: 16 * s, life: 0.16 + 0.03 * s, color: '#fff6d8' });
  part({ type: 'glow', x, y, size: 26 * s, life: 0.3 + 0.05 * s, color });
  sparks(x, y, Math.min(40, 7 * s), color, 60, 200 + 60 * s, 0.35 + 0.08 * s);
  for (let i = 0; i < 2 + s * 2; i++) {
    const a = Math.random() * TAU, sp = rand(10, 50 * Math.sqrt(s));
    part({ type: 'smoke', x: x + rand(-6, 6) * s, y: y + rand(-6, 6) * s, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 30,
           size: rand(6, 10) * Math.sqrt(s), grow: 22, life: rand(0.5, 0.9), color: 'rgba(40,36,44,' });
  }
  for (let i = 0; i < 1 + s * 2; i++) {
    const a = Math.random() * TAU, sp = rand(60, 220);
    part({ type: 'debris', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * TAU, vr: rand(-12, 12),
           size: rand(2, 4) + s * 0.6, life: rand(0.4, 0.9), color: '#6b6f7a', drag: 1.5 });
  }
  if (s >= 2 && Run) Run.shake = Math.max(Run.shake, s * 2.2);
  sfx(s >= 4 ? 'boomL' : s >= 2 ? 'boomM' : 'boomS');
}

function floatText(x, y, text, color, size) {
  texts.push({ x, y, text, color: color || '#fff', size: size || 12, life: 0.9, max: 0.9 });
  if (texts.length > 40) texts.shift();
}

function updateEffects(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'ring') p.r += p.vr * dt;
    else if (p.type === 'smoke') p.size += p.grow * dt;
    else if (p.type === 'debris') p.rot += p.vr * dt;
  }
  for (let i = arcs.length - 1; i >= 0; i--) { arcs[i].life -= dt; if (arcs[i].life <= 0) arcs.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= 26 * dt; if (t.life <= 0) texts.splice(i, 1); }
}

// ---------------------------------------------------------------------
// Player
// ---------------------------------------------------------------------
const BOMB_BTN = { x: W - 50, y: H - 56, r: 34 };
const PAUSE_BTN = { x: W - 24, y: 24, r: 18 };

function updatePlayer(dt) {
  const pl = Run.pilot;
  if (!P.alive) {
    if (Run.ships > 0) { P.respawnT -= dt; if (P.respawnT <= 0) respawn(); }
    return;
  }
  P.inv = Math.max(0, P.inv - dt);
  P.focus = held('focus');

  if (P.enterT > 0) {
    P.enterT -= dt;
    const k = easeOut(1 - Math.max(0, P.enterT) / 0.8);
    P.x = lerp(P.x, W / 2, 0.08); P.y = lerp(H + 40, H - 110, k);
    P.vx = 0; P.vy = 0; P.tx = P.x; P.ty = P.y;
    if (Input.drag) { Input.drag.lx = Input.drag.px; Input.drag.ly = Input.drag.py; }
    return;
  }

  const spd = pl.speed * (P.focus ? 0.5 : 1);
  let desVx, desVy;
  const d = Input.drag;
  if (d && !d.ui) {
    if (d.lx === undefined) { d.lx = d.px; d.ly = d.py; P.tx = P.x; P.ty = P.y; }
    P.tx = clamp(P.tx + (d.px - d.lx), 14, W - 14);
    P.ty = clamp(P.ty + (d.py - d.ly), 28, H - 20);
    d.lx = d.px; d.ly = d.py;
    let ex = (P.tx - P.x) * 11, ey = (P.ty - P.y) * 11;
    const m = Math.hypot(ex, ey), cap = spd * 1.7;
    if (m > cap) { ex *= cap / m; ey *= cap / m; }
    desVx = ex; desVy = ey;
  } else {
    let dx = (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
    let dy = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
    if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
    desVx = dx * spd; desVy = dy * spd;
    P.tx = P.x; P.ty = P.y;
  }
  const k = 1 - Math.exp(-pl.resp * dt);
  P.vx += (desVx - P.vx) * k; P.vy += (desVy - P.vy) * k;
  P.x += P.vx * dt; P.y += P.vy * dt;
  if (P.x < 14) { P.x = 14; P.vx = Math.max(0, P.vx); }
  if (P.x > W - 14) { P.x = W - 14; P.vx = Math.min(0, P.vx); }
  if (P.y < 28) { P.y = 28; P.vy = Math.max(0, P.vy); }
  if (P.y > H - 20) { P.y = H - 20; P.vy = Math.min(0, P.vy); }
  P.tilt = lerp(P.tilt, clamp(P.vx / pl.speed, -1, 1), 1 - Math.exp(-10 * dt));

  const firing = held('fire') || Game.autoFire || Input.touchMode;
  if (firing) fireWeapon(dt);
  else { P.fireT = Math.max(0, P.fireT - dt); P.noseT = Math.max(0, P.noseT - dt); P.missileT = Math.max(0, P.missileT - dt); }

  if (hit('bomb')) useBomb();

  // engine trail
  P.trail -= dt;
  if (P.trail <= 0) {
    P.trail = 0.03;
    part({ type: 'glow', x: P.x + rand(-2, 2), y: P.y + 17, vx: rand(-10, 10), vy: rand(120, 180), size: rand(3, 5), life: 0.14, color: pl.color });
  }
}

function respawn() {
  P.alive = true; P.x = W / 2; P.y = H + 40; P.vx = P.vy = 0; P.enterT = 0.8; P.inv = 3.2;
  P.fireT = P.noseT = P.missileT = 0;
  Run.bombs = Math.max(Run.bombs, BASE_BOMBS + Run.pilot.bombs);
  cancelBullets(false);
  sfx('respawn');
}

function killPlayer() {
  if (!P.alive || P.inv > 0 || P.enterT > 0) return;
  P.alive = false;
  explode(P.x, P.y, 4, Run.pilot.color);
  sparks(P.x, P.y, 30, '#ffffff', 80, 420, 0.8);
  sfx('death');
  Run.shake = 16; Run.flash = 0.55; Run.flashColor = '#ffffff';
  Run.ships--; Run.chain = 0; Run.chainT = 0;
  const lost = Run.level - Math.max(1, Run.level - 2);
  Run.level = Math.max(1, Run.level - 2);
  if (lost > 0) spawnPod(P.x, P.y, 'power');
  if (Run.ships <= 0) { Run.overT = 2.6; Music.play('death'); }
  else P.respawnT = 1.5;
}

function useBomb() {
  if (!P.alive || P.enterT > 0 || Run.bombs <= 0 || Run.bombT > 0) return;
  Run.bombs--; Run.bombT = 1.6; Run.bombTick = 0;
  P.inv = Math.max(P.inv, 2.8);
  Run.flash = 0.8; Run.flashColor = '#fff2c0'; Run.shake = 12;
  cancelBullets(true);
  for (let i = 0; i < 3; i++) part({ type: 'ring', x: P.x, y: P.y, r: 10 + i * 20, vr: 520 + i * 160, life: 0.9, color: i ? '#ffd27a' : '#ffffff', width: 10 - i * 3 });
  part({ type: 'glow', x: P.x, y: P.y, size: 180, life: 0.5, color: '#ffcf6a' });
  for (let i = 0; i < 26; i++) {
    const a = i / 26 * TAU;
    part({ type: 'spark', x: P.x, y: P.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 0.7, color: '#ffe19a', size: 3, drag: 1.5 });
  }
  for (const e of enemies) if (onScreen(e, 0)) damageEnemy(e, e.boss ? 14 : 30, 'bomb');
  sfx('bomb');
}

function updateBomb(dt) {
  if (Run.bombT <= 0) return;
  Run.bombT -= dt;
  if (eBullets.length) cancelBullets(true);
  Run.bombTick -= dt;
  if (Run.bombTick <= 0) {
    Run.bombTick = 0.1;
    for (const e of enemies) if (onScreen(e, 0)) damageEnemy(e, e.boss ? 0.8 : 1.6, 'bomb');
    for (let i = 0; i < 3; i++) {
      const x = rand(20, W - 20), y = rand(40, H - 100);
      part({ type: 'glow', x, y, size: rand(20, 50), life: 0.3, color: '#ffb347' });
    }
  }
}

function cancelBullets(score) {
  let n = 0;
  for (const b of eBullets) {
    if (n < 120) part({ type: 'glow', x: b.x, y: b.y, size: 6, life: 0.3, color: '#ffe6a8', vy: -40 });
    n++;
  }
  if (score && n) { addScore(n * 10); sfx('cancel'); }
  eBullets.length = 0;
}

// ---------------------------------------------------------------------
// Weapons
// ---------------------------------------------------------------------
function addPB(o) { pBullets.push(o); }

function fireWeapon(dt) {
  const pl = Run.pilot, L = Run.level, rate = pl.rate, dm = pl.dmg;
  const size = clamp(Math.sqrt(dm), 0.72, 1.3);
  const nx = P.x, ny = P.y - 16;
  P.fireT -= dt;

  switch (Run.weapon) {
    case W_VULCAN: {
      if (P.fireT > 0) break;
      P.fireT += 0.085 / rate;
      const n = L, spread = [0, 5, 13, 22, 32][L - 1] * Math.PI / 180;
      for (let i = 0; i < n; i++) {
        const a = n === 1 ? 0 : -spread / 2 + spread * i / (n - 1);
        const off = n === 1 ? 0 : (i - (n - 1) / 2) * 5;
        addPB({ kind: 'v', x: nx + off, y: ny, vx: Math.sin(a) * 920, vy: -Math.cos(a) * 920, dmg: 1.0 * dm, r: 4 * size, size, life: 1.2 });
      }
      sfx('vulcan');
      break;
    }
    case W_LANCE: {
      if (P.fireT > 0) break;
      P.fireT += 0.14 / rate;
      const offs = [[0], [-7, 7], [-12, 0, 12], [-14, 0, 14], [-20, -10, 0, 10, 20]][L - 1];
      const dmg = [1.6, 1.6, 1.6, 1.9, 1.6][L - 1] * dm;
      for (const o of offs) addPB({ kind: 'l', x: nx + o, y: ny + Math.abs(o) * 0.4, vx: 0, vy: -1180, dmg, r: 3, len: 36, w: (L >= 4 ? 4 : 3) * size, pierce: true, hitSet: new Set(), life: 1, size });
      sfx('lance');
      break;
    }
    case W_PLASMA: {
      if (P.fireT > 0) break;
      P.fireT += 0.32 / rate;
      const cfg = [
        { o: [[0, 0]], r: 6, dmg: 3.2, sp: 2.4, rad: 34 },
        { o: [[0, 0]], r: 8, dmg: 4.2, sp: 3.0, rad: 42 },
        { o: [[-10, 0], [10, 0]], r: 7, dmg: 3.6, sp: 2.6, rad: 44 },
        { o: [[-11, -3], [11, 3]], r: 8, dmg: 4.4, sp: 3.2, rad: 52 },
        { o: [[0, 0], [-14, -6], [14, 6]], r: 8, dmg: 4.4, sp: 3.2, rad: 58 },
      ][L - 1];
      for (const [ox, deg] of cfg.o) {
        const a = deg * Math.PI / 180;
        addPB({ kind: 'p', x: nx + ox, y: ny, vx: Math.sin(a) * 420, vy: -Math.cos(a) * 420, dmg: cfg.dmg * dm, splash: cfg.sp * dm, splashR: cfg.rad, r: cfg.r * size, life: 2, t: Math.random() * 6, size });
      }
      sfx('plasma');
      break;
    }
    case W_HORNET: {
      if (P.fireT <= 0) {
        P.fireT += 0.11 / rate;
        const offs = L >= 3 ? [-6, 6] : [0];
        for (const o of offs) addPB({ kind: 'n', x: nx + o, y: ny, vx: 0, vy: -880, dmg: 0.7 * dm, r: 3 * size, life: 1.2, size });
        sfx('nose');
      }
      P.missileT -= dt;
      if (P.missileT <= 0) {
        P.missileT += [0.55, 0.45, 0.55, 0.45, 0.5][L - 1] / rate;
        const count = [2, 2, 4, 4, 6][L - 1], dmg = (L >= 4 ? 2.2 : 2.0) * dm;
        for (let i = 0; i < count; i++) {
          const side = i % 2 ? 1 : -1, row = Math.floor(i / 2);
          const ang = -Math.PI / 2 + side * (0.9 + row * 0.35);
          addPB({ kind: 'm', x: P.x + side * (10 + row * 4), y: P.y + 2, ang, spd: 170, vx: 0, vy: 0, dmg, r: 5, life: 3.2, t: 0, target: null, retarget: 0, size });
        }
        sfx('missile');
      }
      break;
    }
    case W_ARC: {
      if (P.fireT > 0) break;
      P.fireT += 0.22 / rate;
      arcPulse(L, dm);
      break;
    }
  }
  if (P.fireT < -0.1) P.fireT = 0;
}

function onScreen(e, m) { m = m == null ? 0 : m; return e.y > -m + (e.boss ? 0 : 6) && e.y < H + m && e.x > -m && e.x < W + m; }

function arcPulse(L, dm) {
  const cand = [];
  for (const e of enemies) if (!e.dead && onScreen(e, 0) && !e.intangible && !e.invuln && !(e.wait > 0)) cand.push(e);
  const ox = P.x, oy = P.y - 18;
  if (!cand.length) {
    if (Math.random() < 0.5) part({ type: 'spark', x: ox + rand(-6, 6), y: oy, vx: rand(-60, 60), vy: rand(-160, -60), life: 0.15, color: '#b9c6ff', size: 1.5 });
    return;
  }
  const total = L + 1, chains = L >= 3 ? 2 : 1;
  const per = chains === 1 ? [total] : [Math.ceil(total / 2), Math.floor(total / 2)];
  const struck = new Set();
  const base = (3 + 0.6 * L) * dm;
  for (let c = 0; c < chains; c++) {
    let fx = ox, fy = oy, dmg = base;
    const pts = [{ x: ox, y: oy }];
    for (let k = 0; k < per[c]; k++) {
      let best = null, bd = Infinity;
      for (const e of cand) {
        if (struck.has(e) || e.dead) continue;
        const d = dist2(fx, fy, e.x, e.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (!best) break;
      struck.add(best);
      const tx = best.x + rand(-4, 4), ty = best.y + rand(-4, 4);
      pts.push({ x: tx, y: ty });
      part({ type: 'glow', x: tx, y: ty, size: 14, life: 0.12, color: '#c9d4ff' });
      damageEnemy(best, dmg, 'arc');
      fx = tx; fy = ty; dmg *= 0.72;
    }
    if (pts.length > 1) arcs.push({ pts, life: 0.1, max: 0.1, w: 1 + L * 0.35 });
  }
  if (struck.size) sfx('arc');
}

let missileClaims = new Map();
function updatePlayerBullets(dt) {
  missileClaims = new Map();
  for (const o of pBullets) if (o.kind === 'm' && o.target) missileClaims.set(o.target, (missileClaims.get(o.target) || 0) + 1);
  for (let i = pBullets.length - 1; i >= 0; i--) {
    const b = pBullets[i];
    b.life -= dt;
    if (b.kind === 'm') updateMissile(b, dt);
    else { b.x += b.vx * dt; b.y += b.vy * dt; if (b.kind === 'p') b.t += dt * 12; }
    let remove = b.life <= 0 || b.y < -50 || b.y > H + 50 || b.x < -50 || b.x > W + 50;
    if (!remove) {
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.dead || e.intangible) continue;
        if (b.pierce) {
          if (b.hitSet.has(e)) continue;
          if (hitsBeam(e, b)) { b.hitSet.add(e); damageEnemy(e, b.dmg, 'l'); sparks(b.x, e.y + (e.r || 10) * 0.6, 2, '#9ff3ff', 40, 160, 0.2); }
        } else if (hitsCircle(e, b.x, b.y, b.r)) {
          if (b.kind === 'p') detonatePlasma(b, e);
          else {
            damageEnemy(e, b.dmg, b.kind);
            const c = b.kind === 'm' ? '#ffb070' : b.kind === 'n' ? '#ffd0a0' : '#ffe38a';
            part({ type: 'glow', x: b.x, y: b.y, size: b.kind === 'm' ? 14 : 6, life: 0.09, color: c });
            if (b.kind === 'm') sparks(b.x, b.y, 5, '#ffb070', 40, 200, 0.25);
          }
          remove = true; break;
        }
      }
    }
    if (remove) pBullets.splice(i, 1);
  }
}

function updateMissile(b, dt) {
  b.t += dt;
  b.retarget -= dt;
  if (!b.target || b.target.dead || !onScreen(b.target, 20) || b.retarget <= 0) {
    if (!b.target || b.target.dead || !onScreen(b.target, 20)) {
      if (b.target) missileClaims.set(b.target, Math.max(0, (missileClaims.get(b.target) || 1) - 1));
      b.target = pickMissileTarget(b);
      if (b.target) missileClaims.set(b.target, (missileClaims.get(b.target) || 0) + 1);
    }
    b.retarget = 0.4;
  }
  const turn = 3.5 + b.t * 7;
  if (b.t > 0.12) {
    const want = b.target ? angTo(b.x, b.y, b.target.x, b.target.y) : -Math.PI / 2;
    const diff = wrapAngle(want - b.ang);
    b.ang += clamp(diff, -turn * dt, turn * dt);
  }
  b.spd = Math.min(620, b.spd + 900 * dt);
  b.vx = Math.cos(b.ang) * b.spd; b.vy = Math.sin(b.ang) * b.spd;
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (parts.length < 700 && Math.random() < 36 * dt) part({ type: 'smoke', x: b.x - Math.cos(b.ang) * 6, y: b.y - Math.sin(b.ang) * 6, size: 2.2, grow: 10, life: 0.28, color: 'rgba(200,190,180,' });
}

// Hornet warheads spread themselves out, and prefer targets outside
// the column in front of the ship: the nose gun already covers that.
function pickMissileTarget(b) {
  let best = null, bs = Infinity;
  for (const e of enemies) {
    if (e.dead || e.intangible || e.invuln || e.wait > 0 || !onScreen(e, -4)) continue;
    const claimed = missileClaims.get(e) || 0;
    const inColumn = Math.abs(e.x - P.x) < 36 ? 180 : 0;
    const s = Math.sqrt(dist2(b.x, b.y, e.x, e.y)) + inColumn + claimed * (e.boss ? 60 : 260);
    if (s < bs) { bs = s; best = e; }
  }
  return best;
}

function detonatePlasma(b, direct) {
  if (direct) damageEnemy(direct, b.dmg, 'p');
  for (const e of enemies) {
    if (e === direct || e.dead || e.intangible) continue;
    if (hitsCircle(e, b.x, b.y, b.splashR)) damageEnemy(e, b.splash, 'p');
  }
  part({ type: 'ring', x: b.x, y: b.y, r: 4, vr: b.splashR * 5, life: 0.2, color: '#9dffa8', width: 3 });
  part({ type: 'glow', x: b.x, y: b.y, size: b.splashR * 0.9, life: 0.2, color: '#5dff7a' });
  sparks(b.x, b.y, 6, '#b6ffbe', 60, 220, 0.3);
  sfx('splash');
}

// ---------------------------------------------------------------------
// Pods
// ---------------------------------------------------------------------
const POD_R = 13, POD_SPEED = 88;

function spawnPod(x, y, kind, w) {
  kind = kind || (Math.random() < 0.55 ? 'power' : 'weapon');
  const a = rand(0.45, Math.PI - 0.45);
  pods.push({
    kind, w: w == null ? randi(0, 4) : w,
    x: clamp(x, POD_R + 2, W - POD_R - 2), y: clamp(y, POD_R + 40, H - POD_R - 2),
    vx: Math.cos(a) * POD_SPEED, vy: Math.sin(a) * POD_SPEED,
    bounces: 0, cycleT: 10, t: 0, flashT: 0,
  });
}

function updatePods(dt) {
  for (let i = pods.length - 1; i >= 0; i--) {
    const p = pods[i];
    p.t += dt; p.flashT = Math.max(0, p.flashT - dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    let bounced = false;
    if (p.x < POD_R) { p.x = POD_R; p.vx = Math.abs(p.vx); bounced = true; }
    else if (p.x > W - POD_R) { p.x = W - POD_R; p.vx = -Math.abs(p.vx); bounced = true; }
    if (p.y < POD_R) { p.y = POD_R; p.vy = Math.abs(p.vy); bounced = true; }
    else if (p.y > H - POD_R) { p.y = H - POD_R; p.vy = -Math.abs(p.vy); bounced = true; }
    if (bounced) {
      p.bounces++;
      if (p.bounces >= 4) {
        sparks(p.x, p.y, 10, p.kind === 'power' ? GOLD : WEAPONS[p.w].color, 40, 180, 0.35);
        part({ type: 'ring', x: p.x, y: p.y, r: 6, vr: 90, life: 0.25, color: '#ffffff', width: 2 });
        sfx('pop');
        pods.splice(i, 1); continue;
      }
    }
    if (p.kind === 'weapon') {
      p.cycleT -= dt;
      if (p.cycleT <= 0) { p.w = (p.w + 1) % WEAPONS.length; p.cycleT = 10; p.flashT = 0.3; sfx('cycle'); }
    }
    if (P.alive && P.enterT <= 0 && dist2(p.x, p.y, P.x, P.y) < 28 * 28) {
      collectPod(p); pods.splice(i, 1);
    }
  }
}

function collectPod(p) {
  const color = p.kind === 'power' ? GOLD : WEAPONS[p.w].color;
  part({ type: 'ring', x: p.x, y: p.y, r: 8, vr: 160, life: 0.3, color, width: 3 });
  sparks(p.x, p.y, 10, color, 60, 200, 0.35);
  if (p.kind === 'power' || p.w === Run.weapon) {
    if (Run.level < 5) {
      Run.level++;
      toast(Run.level === 5 ? WEAPONS[Run.weapon].name + ' · MAX POWER' : WEAPONS[Run.weapon].name + ' · POWER ' + Run.level, color);
      sfx('power', Run.level);
    } else {
      addScore(5000); floatText(p.x, p.y - 10, '+5000', GOLD, 14);
      toast('FULL POWER · +5000', GOLD); sfx('maxed');
    }
  } else {
    Run.weapon = p.w;
    toast(WEAPONS[p.w].name + ' · POWER ' + Run.level, WEAPONS[p.w].color);
    sfx('swap');
  }
  addScore(250);
}

// ---------------------------------------------------------------------
// Enemies
// ---------------------------------------------------------------------
const ETYPES = {
  dart:    { hp: 3,   r: 12, score: 100,  drop: 0.01,  size: 1 },
  drone:   { hp: 9,   r: 15, score: 300,  drop: 0.04,  size: 1.6 },
  tank:    { hp: 12,  r: 15, score: 400,  drop: 0.04,  size: 1.6, ground: true },
  spinner: { hp: 18,  r: 17, score: 600,  drop: 0.08,  size: 2 },
  kami:    { hp: 4,   r: 11, score: 150,  drop: 0.015, size: 1 },
  gunship: { hp: 40,  r: 26, score: 1500, drop: 0.25,  size: 3 },
  carrier: { hp: 24,  r: 22, score: 1000, drop: 1.0,   size: 2.4 },
  frigate: { hp: 95,  r: 34, score: 3000, drop: 0.45,  size: 3.5 },
};

// Every enemy and boss hull is multiplied by this, on every wave and difficulty.
const ENEMY_HP_SCALE = 0.7;
const hpScale = () => ENEMY_HP_SCALE * Run.diff.hull * (1 + 0.085 * (Run.wave - 1));
const fireScale = () => Run.diff.fireInterval * Math.max(0.5, 1 - 0.03 * (Run.wave - 1));
const bspd = v => v * Run.diff.bulletSpeed * (1 + Math.min(0.35, 0.018 * (Run.wave - 1)));
const dens = () => Run.diff.density * (1 + Math.min(0.5, 0.035 * (Run.wave - 1)));
const cnt = base => Math.max(1, Math.round(base * dens()));

function spawnEnemy(type, x, y, o) {
  const T = ETYPES[type];
  const hp = T.hp * hpScale();
  const e = Object.assign({
    type, x, y, vx: 0, vy: 0, hp, maxHp: hp, r: T.r, score: T.score, drop: T.drop, size: T.size,
    ground: !!T.ground, t: 0, wait: 0, fireT: rand(0.8, 1.8), fireI: 0, fire: null, beh: null,
    ang: Math.PI / 2, turret: Math.PI / 2, flash: 0, dead: false, group: 0, data: {},
  }, o || {});
  enemies.push(e);
  return e;
}

function newGroup(size) {
  const id = Run.nextGroup++;
  Run.groups[id] = { size, killed: 0, escaped: 0 };
  return id;
}

function hitsCircle(e, x, y, r) {
  if (e.wait > 0) return false;
  if (e.circles) {
    for (const c of e.circles) { const rr = c.r + r; if (dist2(e.x + c.x, e.y + c.y, x, y) < rr * rr) return true; }
    return false;
  }
  const rr = e.r + r;
  return dist2(e.x, e.y, x, y) < rr * rr;
}

function hitsBeam(e, b) {
  if (e.wait > 0) return false;
  const list = e.circles || [{ x: 0, y: 0, r: e.r }];
  const hw = b.w / 2;
  for (const c of list) {
    const cx = e.x + c.x, cy = e.y + c.y;
    const dx = Math.abs(cx - b.x);
    if (dx > c.r + hw) continue;
    const ny = clamp(cy, b.y - b.len, b.y + 4);
    const rr = c.r + hw;
    if (dist2(cx, cy, b.x, ny) < rr * rr) return true;
  }
  return false;
}

function damageEnemy(e, dmg, src) {
  if (e.dead || e.wait > 0) return false;
  if (e.invuln) { if (Math.random() < 0.3) part({ type: 'spark', x: e.x + rand(-20, 20), y: e.y + rand(0, 20), vx: rand(-80, 80), vy: rand(-80, 0), life: 0.15, color: '#aab', size: 1.5 }); return false; }
  e.hp -= dmg; e.flash = 0.07;
  if (e.hp <= 0) { killEnemy(e); return true; }
  if (src !== 'bomb') sfx(e.boss || e.size >= 3 ? 'armor' : 'hit');
  return false;
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  if (e.boss) { bossDefeated(e); return; }
  Run.kills++;
  Run.chain = Run.chainT > 0 ? Run.chain + 1 : 1;
  Run.chainT = CHAIN_WINDOW;
  Run.bestChain = Math.max(Run.bestChain, Run.chain);
  const mult = chainMult();
  const pts = e.score * mult;
  addScore(pts);
  if (e.size >= 2.4 || mult > 1) floatText(e.x, e.y - 10, String(pts), mult > 1 ? '#ffe28a' : '#ffffff', e.size >= 3 ? 14 : 11);
  if (Run.chain >= 5 && Run.chain % 5 === 0) sfx('chain', Run.chain / 5);
  explode(e.x, e.y, e.size, e.ground ? '#ff9a4a' : '#ffb347');
  if (e.type === 'carrier') spawnPod(e.x, e.y, Math.random() < 0.6 ? 'weapon' : 'power');
  else if (Run.podsThisWave < 3 && Math.random() < e.drop * Run.diff.drop) { spawnPod(e.x, e.y); Run.podsThisWave++; }
  if (e.group) {
    const g = Run.groups[e.group];
    if (g) {
      g.killed++;
      if (g.killed === g.size && g.escaped === 0 && g.size >= 4) {
        const bonus = g.size * 200 * mult;
        addScore(bonus);
        floatText(e.x, e.y - 24, 'FORMATION +' + bonus, '#9ff3ff', 12);
        if (Run.podsThisWave < 3 && Math.random() < 0.2 * Run.diff.drop) { spawnPod(e.x, e.y); Run.podsThisWave++; }
      }
    }
  }
  if (e.onDeath) e.onDeath(e);
}

// ---- enemy bullets ----------------------------------------------------
const BR = { dot: 4, needle: 3.2, orb: 6.5, big: 10, mine: 8 };

function eBullet(x, y, ang, speed, kind, extra) {
  const b = { x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, kind: kind || 'dot', r: BR[kind || 'dot'], t: 0 };
  if (extra) Object.assign(b, extra);
  eBullets.push(b);
  return b;
}
function aimAt(x, y) { return P.alive ? angTo(x, y, P.x, P.y) : Math.PI / 2; }
function fan(x, y, ang, n, spread, speed, kind, extra) {
  for (let i = 0; i < n; i++) eBullet(x, y, n === 1 ? ang : ang - spread / 2 + spread * i / (n - 1), speed, kind, extra);
}
function ringShot(x, y, n, speed, kind, off, extra) {
  for (let i = 0; i < n; i++) eBullet(x, y, (off || 0) + i / n * TAU, speed, kind, extra);
}
function canFire(e) {
  return P.alive && Run.overT < 0 && Run.bombT <= 0 && e.y > 18 && e.y < H * 0.72 && e.x > 0 && e.x < W && dist2(e.x, e.y, P.x, P.y) > 80 * 80;
}

function updateEnemyBullets(dt) {
  const core = Run.pilot.core;
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.t += dt;
    if (b.acc) { const k = 1 + b.acc * dt; b.vx *= k; b.vy *= k; const s = Math.hypot(b.vx, b.vy); if (b.maxSpd && s > b.maxSpd) { b.vx *= b.maxSpd / s; b.vy *= b.maxSpd / s; } }
    if (b.turn) { const a = Math.atan2(b.vy, b.vx) + b.turn * dt, s = Math.hypot(b.vx, b.vy); b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; }
    if (b.fall) b.vy += b.fall * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.burst && b.t >= b.burst) {
      ringShot(b.x, b.y, b.burstN || 10, b.burstSpd || bspd(120), b.burstKind || 'dot', Math.random() * TAU);
      part({ type: 'ring', x: b.x, y: b.y, r: 4, vr: 120, life: 0.2, color: '#ff8ad0', width: 2 });
      eBullets.splice(i, 1); continue;
    }
    if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) { eBullets.splice(i, 1); continue; }
    if (P.alive && P.enterT <= 0) {
      const rr = b.r * 0.8 + core;
      if (dist2(b.x, b.y, P.x, P.y) < rr * rr) {
        if (P.inv <= 0) { eBullets.splice(i, 1); killPlayer(); }
      }
    }
  }
}

// ---- update ------------------------------------------------------------
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    if (e.wait > 0) { e.wait -= dt; continue; }
    e.t += dt;
    e.flash = Math.max(0, e.flash - dt);
    const ox = e.x, oy = e.y;
    if (e.beh) e.beh(e, dt);
    if (!e.noFace) {
      const mvx = e.x - ox, mvy = e.y - oy;
      if (mvx * mvx + mvy * mvy > 0.01) e.ang = lerp(e.ang, e.ang + wrapAngle(Math.atan2(mvy, mvx) - e.ang), 1 - Math.exp(-8 * dt));
    }
    if (e.fireI && e.fire) {
      e.fireT -= dt;
      if (e.fireT <= 0) {
        e.fireT = e.fireI * fireScale() * rand(0.8, 1.2);
        if (canFire(e)) e.fire(e);
      }
    }
    // damaged heavy craft trail smoke
    if (e.size >= 2.4 && e.hp < e.maxHp * 0.5 && Math.random() < 18 * dt)
      part({ type: 'smoke', x: e.x + rand(-8, 8), y: e.y + rand(-8, 8), vy: -20, size: 4, grow: 14, life: 0.5, color: 'rgba(50,46,52,' });
    // ship collision with airborne hulls
    if (!e.ground && !e.boss && P.alive && P.enterT <= 0 && P.inv <= 0) {
      const rr = e.r * 0.72 + Run.pilot.core;
      if (dist2(e.x, e.y, P.x, P.y) < rr * rr) killPlayer();
    }
    if (e.t > 2 && !e.boss && (e.y > H + 70 || e.y < -140 || e.x < -110 || e.x > W + 110)) {
      if (e.group && Run.groups[e.group]) Run.groups[e.group].escaped++;
      enemies.splice(i, 1);
    }
  }
}

// ---- behaviours ------------------------------------------------------------
function behBezier(p0, p1, p2, dur) {
  return (e) => {
    const u = e.t / dur;
    const iu = 1 - u;
    e.x = iu * iu * p0.x + 2 * iu * u * p1.x + u * u * p2.x;
    e.y = iu * iu * p0.y + 2 * iu * u * p1.y + u * u * p2.y;
  };
}

function dartFire(e) { eBullet(e.x, e.y + 8, aimAt(e.x, e.y), bspd(190), 'dot'); sfx('eshot'); }

// ---- formations -------------------------------------------------------------
function formVee() {
  const n = cnt(5), x0 = rand(110, W - 110), g = newGroup(n);
  const peelY = rand(170, 280);
  for (let i = 0; i < n; i++) {
    const k = i - (n - 1) / 2;
    spawnEnemy('dart', x0 + k * 32, -24 - Math.abs(k) * 28, {
      group: g, fireI: Math.random() < 0.45 ? 2.4 : 0, fire: dartFire,
      data: { side: k === 0 ? pick([-1, 1]) : Math.sign(k), vy: 165 },
      beh(e, dt) {
        if (e.y < peelY) e.y += e.data.vy * dt;
        else { e.vx += e.data.side * 340 * dt; e.x += e.vx * dt; e.y += (e.data.vy + 20) * dt; }
      },
    });
  }
}

function formSwoop() {
  const n = cnt(6), side = pick([-1, 1]), g = newGroup(n);
  const sx = side < 0 ? rand(40, 110) : rand(W - 110, W - 40);
  const cy = rand(420, 620), dur = rand(4.2, 5.0);
  const path = behBezier({ x: sx, y: -30 }, { x: W / 2, y: cy }, { x: W - sx, y: -60 }, dur);
  for (let i = 0; i < n; i++) {
    spawnEnemy('dart', sx, -30, {
      group: g, wait: i * 0.22, fireI: 0, beh(e, dt) {
        path(e);
        if (!e.data.shot && e.t > dur * 0.42 && Math.random() < 0.5) { e.data.shot = true; if (canFire(e)) dartFire(e); }
        if (e.t > dur + 0.3) e.y = -200;
      },
    });
  }
}

function formSweep() {
  const n = cnt(5), side = pick([-1, 1]), g = newGroup(n);
  const y0 = rand(70, 230), sp = rand(150, 190), amp = rand(18, 40);
  for (let i = 0; i < n; i++) {
    spawnEnemy('dart', side < 0 ? -30 : W + 30, y0, {
      group: g, wait: i * 0.28, fireI: Math.random() < 0.5 ? 2.2 : 0, fire: dartFire,
      beh(e, dt) { e.x += -side * sp * dt; e.y = y0 + Math.sin(e.t * 2.2) * amp + e.t * 14; },
    });
  }
}

function formColumn() {
  const n = cnt(6), g = newGroup(n);
  const x = P.alive ? clamp(P.x + rand(-60, 60), 40, W - 40) : rand(60, W - 60);
  for (let i = 0; i < n; i++) {
    spawnEnemy('dart', x, -30, {
      group: g, wait: i * 0.2, hp: 4 * hpScale(), maxHp: 4 * hpScale(),
      beh(e, dt) { e.y += 250 * dt; },
    });
  }
}

function formDrones() {
  const n = clamp(cnt(3), 1, 6), g = newGroup(n);
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) / n * (W - 80) + 40 + rand(-12, 12);
    const hy = rand(90, 230);
    spawnEnemy('drone', x, -30, {
      group: g, wait: i * 0.25, fireI: 1.7, noFace: true,
      fire(e) { fan(e.x, e.y + 10, aimAt(e.x, e.y), Run.wave >= 6 ? 5 : 3, 0.5, bspd(170), 'dot'); sfx('eshot'); },
      beh(e, dt) {
        const T = e.t;
        if (T < 1.3) e.y = lerp(-30, hy, easeOut(T / 1.3));
        else if (T < 6.5) e.x += Math.sin(T * 1.3 + i) * 30 * dt;
        else { e.vy += 260 * dt; e.y += e.vy * dt; e.fireI = 0; }
      },
    });
  }
}

function formTanks() {
  const n = clamp(cnt(3), 1, 6), g = newGroup(n);
  for (let i = 0; i < n; i++) {
    const x0 = (i + 0.5) / n * (W - 100) + 50;
    const drift = rand(-25, 25);
    spawnEnemy('tank', x0, -30 - i * 40, {
      group: g, fireI: 2.0, noFace: true, ang: Math.PI / 2,
      fire(e) {
        const a = aimAt(e.x, e.y);
        eBullet(e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14, a, bspd(210), 'needle');
        if (Run.wave >= 7) eBullet(e.x + Math.cos(a) * 14, e.y + Math.sin(a) * 14, a, bspd(170), 'needle');
        sfx('eshot');
      },
      beh(e, dt) {
        e.y += (40 + 22) * dt; e.x += Math.sin(e.t * 0.8) * drift * dt;
        const want = aimAt(e.x, e.y);
        e.turret += clamp(wrapAngle(want - e.turret), -2.5 * dt, 2.5 * dt);
      },
    });
  }
}

function formSpinner() {
  const n = Run.wave >= 10 || dens() > 1.25 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const x = n === 1 ? rand(140, W - 140) : (i ? W - rand(100, 150) : rand(100, 150));
    const hy = rand(130, 210);
    spawnEnemy('spinner', x, -30, {
      wait: i * 0.8, noFace: true,
      data: { spin: Math.random() * TAU, shotT: 0 },
      beh(e, dt) {
        const T = e.t;
        e.ang += dt * 3;
        if (T < 1.6) e.y = lerp(-30, hy, easeOut(T / 1.6));
        else if (T < 9) {
          const on = ((T - 1.6) % 4) < 2.8;
          e.data.shotT -= dt;
          if (on && e.data.shotT <= 0 && canFire(e)) {
            e.data.shotT = 0.16 * Math.max(0.6, Run.diff.fireInterval);
            const arms = Run.wave >= 12 ? 3 : 2;
            for (let k = 0; k < arms; k++) eBullet(e.x, e.y, e.data.spin + k * TAU / arms, bspd(135), 'dot');
            e.data.spin += 0.33;
          }
        } else { e.vy += 120 * dt; e.y += e.vy * dt; }
      },
    });
  }
}

function formKami() {
  const n = cnt(4), g = newGroup(n);
  for (let i = 0; i < n; i++) {
    spawnEnemy('kami', rand(40, W - 40), -24, {
      group: g, wait: i * 0.35, data: { a: Math.PI / 2, s: 110 },
      beh(e, dt) {
        const d = e.data;
        if (P.alive && e.y < P.y - 60) {
          const want = angTo(e.x, e.y, P.x, P.y);
          d.a += clamp(wrapAngle(want - d.a), -2.1 * dt, 2.1 * dt);
        }
        d.s = Math.min(320 * Math.sqrt(Run.diff.bulletSpeed), d.s + 150 * dt);
        e.x += Math.cos(d.a) * d.s * dt; e.y += Math.sin(d.a) * d.s * dt;
      },
    });
  }
}

function formGunship() {
  const x = rand(120, W - 120);
  spawnEnemy('gunship', x, -50, {
    fireI: 1.25, noFace: true, data: { mode: 0 },
    fire(e) {
      if (e.data.mode++ % 3 === 2) { ringShot(e.x, e.y, Run.wave >= 9 ? 16 : 12, bspd(135), 'dot', Math.random()); }
      else {
        const a = aimAt(e.x, e.y);
        fan(e.x - 18, e.y + 14, a, 3, 0.28, bspd(230), 'needle');
        fan(e.x + 18, e.y + 14, a, 3, 0.28, bspd(230), 'needle');
      }
      sfx('bossShot');
    },
    beh(e, dt) {
      const T = e.t;
      if (T < 2.2) e.y = lerp(-50, 140, easeOut(T / 2.2));
      else if (T < 11) e.x = clamp(e.x + Math.sin(T * 0.7) * 45 * dt, 50, W - 50);
      else { e.y += 50 * dt; e.fireI = T < 14 ? e.fireI : 0; }
    },
  });
}

function formFrigate() {
  spawnEnemy('frigate', W / 2 + rand(-80, 80), -70, {
    fireI: 1.0, noFace: true, data: { mode: 0 },
    circles: [{ x: 0, y: 0, r: 30 }, { x: -34, y: 6, r: 16 }, { x: 34, y: 6, r: 16 }],
    fire(e) {
      const m = e.data.mode++ % 3;
      if (m === 0) fan(e.x, e.y + 24, aimAt(e.x, e.y), 5, 0.7, bspd(165), 'orb');
      else if (m === 1) ringShot(e.x, e.y, 18, bspd(125), 'dot', e.t);
      else for (let k = 0; k < 4; k++) eBullet(e.x + (k - 1.5) * 16, e.y + 20, aimAt(e.x, e.y), bspd(200 + k * 25), 'needle');
      sfx('bossShot');
    },
    beh(e, dt) {
      const T = e.t;
      if (T < 2.6) e.y = lerp(-70, 130, easeOut(T / 2.6));
      else if (T < 14) e.x = W / 2 + Math.sin((T - 2.6) * 0.5) * 150;
      else { e.y += 45 * dt; e.fireI = 0; }
    },
  });
}

function formCarrier() {
  const side = pick([-1, 1]);
  const y0 = rand(90, 250);
  spawnEnemy('carrier', side < 0 ? -40 : W + 40, y0, {
    noFace: true, ang: Math.PI / 2,
    beh(e, dt) { e.x += -side * 72 * dt; e.y = y0 + Math.sin(e.t * 1.5) * 10; },
  });
}

const FORMATIONS = [
  { min: 1, w: 3.0, fn: formVee },
  { min: 1, w: 3.0, fn: formSwoop },
  { min: 1, w: 2.5, fn: formSweep },
  { min: 2, w: 1.8, fn: formColumn },
  { min: 1, w: 2.2, fn: formDrones },
  { min: 2, w: 2.0, fn: formTanks },
  { min: 3, w: 1.4, fn: formSpinner, heavy: 1 },
  { min: 4, w: 1.6, fn: formKami },
  { min: 3, w: 1.1, fn: formGunship, heavy: 2 },
  { min: 8, w: 0.8, fn: formFrigate, heavy: 3 },
];

function buildWave(n) {
  const ev = [];
  const avail = FORMATIONS.filter(f => f.min <= n);
  const total = avail.reduce((s, f) => s + f.w, 0);
  const groups = Math.round(Math.min(17, 6 + n * 0.65) * (0.8 + 0.2 * Run.diff.density));
  const gap = Math.max(1.25, 3.0 - n * 0.09) / Math.sqrt(Run.diff.density);
  let t = 0.6, heavyCount = 0;
  for (let i = 0; i < groups; i++) {
    let r = Math.random() * total, f = avail[0];
    for (const c of avail) { r -= c.w; if (r <= 0) { f = c; break; } }
    if (f.heavy && heavyCount >= 1 + Math.floor(n / 6)) { f = avail[i % 3]; }
    if (f.heavy) heavyCount++;
    ev.push({ t, fn: f.fn });
    t += gap * rand(0.8, 1.2) + (f.heavy ? f.heavy * 0.9 : 0);
  }
  ev.push({ t: t * rand(0.35, 0.55), fn: formCarrier });
  if (Math.random() < 0.2 * Run.diff.drop) ev.push({ t: t * rand(0.7, 0.9), fn: formCarrier });
  ev.sort((a, b) => a.t - b.t);
  return ev;
}

// ---------------------------------------------------------------------
// Wave flow
// ---------------------------------------------------------------------
function startWave(n) {
  Run.wave = n; Run.waveT = 0; Run.evIdx = 0; Run.podsThisWave = 0;
  const newBiome = Math.floor((n - 1) / 5) % BIOMES.length;
  if (newBiome !== Run.biome) { Run.biomePrev = Run.biome; Run.biome = newBiome; Run.biomeFade = 0; }
  if (n % 5 === 0) {
    Run.events = [{ t: 3.0, fn: spawnBoss }];
    Run.banner = { title: 'WARNING', sub: 'HEAVY SIGNATURE INBOUND', color: '#ff4a6a', warn: true };
    Run.bannerT = 3.0;
    Music.play('boss');
    sfx('warning');
  } else {
    Run.events = buildWave(n);
    const loop = Math.floor((n - 1) / 5);
    Run.banner = { title: 'WAVE ' + n, sub: (n - 1) % 5 === 0 ? BIOMES[Run.biome].name : '', color: '#e8f4ff' };
    Run.bannerT = 2.2;
    Music.play('combat');
    if (loop > 0 && (n - 1) % 5 === 0) Run.banner.sub = BIOMES[Run.biome].name + ' · LOOP ' + (loop + 1);
  }
}

function updateWaves(dt) {
  if (Run.bannerT > 0) Run.bannerT -= dt;
  if (Run.between > 0) {
    Run.between -= dt;
    if (Run.between <= 0) startWave(Run.wave + 1);
    return;
  }
  Run.waveT += dt;
  while (Run.evIdx < Run.events.length && Run.events[Run.evIdx].t <= Run.waveT) {
    Run.events[Run.evIdx].fn();
    Run.evIdx++;
  }
  if (Run.bossActive) return;
  if (Run.evIdx >= Run.events.length) {
    let alive = false;
    for (const e of enemies) if (!e.dead) { alive = true; break; }
    if (!alive) Run.between = 1.8;
  }
}

    patterns: ['TWIN SPIRALS', 'FALLING WALLS', 'FEATHER VOLLEYS'] },
  { name: 'LEVIATHAN', hp: 1450, hy: 132, accent: '#ffb347',
    circles: [{ x: 0, y: 0, r: 48 }, { x: -82, y: -12, r: 26 }, { x: 82, y: -12, r: 26 }, { x: -134, y: -22, r: 17 }, { x: 134, y: -22, r: 17 }],
    patterns: ['RAIN LANES', 'BLOOM ORBS', 'ROSE'] },
];

function spawnBoss() {
  const num = Run.wave / 5;                    // 1, 2, 3...
  const design = (num - 1) % BOSSES.length;
  const def = BOSSES[design];
  const hp = ENEMY_HP_SCALE * def.hp * Run.diff.bossHp * (1 + 0.25 * (num - 1));
  const e = spawnEnemy('gunship', W / 2, -150, {
    boss: true, design, hp, maxHp: hp, r: 40, score: 0, drop: 0, size: 5, noFace: true,
    circles: def.circles, invuln: true, name: def.name,
    data: { phase: 'enter', pat: 0, patT: 0, shotT: 0.8, time: 0, spin: 0, head: 0, hx: W / 2, hy: def.hy, gap: 0, brood: 0 },
    beh: bossUpdate,
  });
  Run.boss = e; Run.bossActive = true;
}

function bossUpdate(e, dt) {
  const d = e.data, def = BOSSES[e.design];
  if (d.phase === 'enter') {
    const k = Math.min(1, e.t / 3.2);
    e.y = lerp(-150, d.hy, easeOut(k)); e.x = W / 2;
    if (k >= 1) { d.phase = 'fight'; e.invuln = false; d.patT = 0; d.shotT = 0.6; toast(def.patterns[0], def.accent); }
    return;
  }
  if (d.phase === 'dying') { bossDying(e, dt); return; }

  const rage = clamp(1 - e.hp / e.maxHp, 0, 1);
  const agg = 1 + rage * 0.9;
  d.time += dt; d.patT += dt;

  // movement grows livelier as health falls
  const mv = 1 + rage * 0.5;
  switch (e.design) {
    case 0: e.x = W / 2 + Math.sin(d.time * 0.6 * mv) * 110; e.y = d.hy + Math.sin(d.time * 1.1) * 10; break;
    case 1: e.x = W / 2 + Math.sin(d.time * 0.5 * mv) * 120; e.y = d.hy + Math.sin(d.time * 1.0 * mv) * 28; break;
    case 2: e.x = W / 2 + Math.sin(d.time * 0.85 * mv) * 150; e.y = d.hy + Math.cos(d.time * 1.7) * 20; break;
    case 3: e.x = W / 2 + Math.sin(d.time * 0.3 * mv) * 50; e.y = d.hy + Math.sin(d.time * 0.7) * 8; break;
  }

  // body contact
  if (P.alive && P.enterT <= 0 && P.inv <= 0 && hitsCircle(e, P.x, P.y, Run.pilot.core)) killPlayer();

  const patDur = 6.5, rest = 0.9 * (1 - rage * 0.5);
  if (d.patT < patDur) {
    if (canBossFire()) BOSS_PATTERNS[e.design][d.pat](e, d, dt, agg, rage);
  } else if (d.patT > patDur + rest) {
    d.pat = (d.pat + 1) % 3; d.patT = 0; d.shotT = 0.2; d.spin = Math.random() * TAU;
    toast(def.patterns[d.pat], def.accent);
  }
}

function canBossFire() { return P.alive && Run.overT < 0 && Run.bombT <= 0; }

// Returns how many shots are due this frame at the given interval.
function due(d, dt, interval, agg) {
  d.shotT -= dt * agg;
  let n = 0;
  const iv = interval * Math.pow(Run.diff.fireInterval, 0.75);
  while (d.shotT <= 0 && n < 4) { d.shotT += iv; n++; }
  return n;
}

const BOSS_PATTERNS = [
  // WARDEN
  [
    (e, d, dt, agg, rage) => { // wing batteries
      if (!due(d, dt, 0.6, agg)) return;
      const n = rage > 0.5 ? 5 : 3;
      for (const s of [-1, 1]) {
        const gx = e.x + s * 60, gy = e.y + 14;
        fan(gx, gy, aimAt(gx, gy), n, 0.32 + rage * 0.15, bspd(215), 'needle');
      }
      sfx('bossShot');
    },
    (e, d, dt, agg, rage) => { // core rings
      if (!due(d, dt, 0.95, agg)) return;
      d.spin += 0.2;
      ringShot(e.x, e.y + 8, 14 + Math.round(rage * 8), bspd(128), 'dot', d.spin);
      if (rage > 0.4) ringShot(e.x, e.y + 8, 8, bspd(175), 'orb', d.spin + 0.3);
      sfx('bossShot');
    },
    (e, d, dt, agg, rage) => { // sweep curtain
      if (due(d, dt, 0.09, 1 + rage * 0.3)) {
        const sw = Math.sin(d.patT * 1.6) * 0.9;
        eBullet(e.x - 60, e.y + 10, Math.PI / 2 + sw, bspd(245), 'needle');
        eBullet(e.x + 60, e.y + 10, Math.PI / 2 - sw, bspd(245), 'needle');
        d.gap += dt * 2;
      }
      if (rage > 0.55) {
        d.head -= dt;
        if (d.head <= 0) { d.head = 0.9; eBullet(e.x, e.y + 30, aimAt(e.x, e.y), bspd(150), 'big'); sfx('bossShot'); }
      }
    },
  ],
  // HYDRA
  [
    (e, d, dt, agg, rage) => { // triple heads
      if (!due(d, dt, 0.28, agg)) return;
      const heads = [[-52, 20], [0, 44], [52, 20]];
      const [hx, hy] = heads[d.head++ % 3];
      const x = e.x + hx, y = e.y + hy, a = aimAt(x, y);
      for (let k = 0; k < 3; k++) eBullet(x, y, a, bspd(195 + k * 32), 'needle');
      if (rage > 0.5) fan(x, y, a, 3, 0.6, bspd(140), 'dot');
      sfx('bossShot');
    },
    (e, d, dt, agg, rage) => { // spores
      if (!due(d, dt, 1.3, 1 + rage * 0.5)) return;
      const n = rage > 0.7 ? 4 : 3;
      for (let k = 0; k < n; k++) {
        const a = Math.PI / 2 + (k - (n - 1) / 2) * 0.55;
        eBullet(e.x, e.y + 30, a, bspd(95), 'mine', { burst: 1.1, burstN: rage > 0.5 ? 12 : 10, burstSpd: bspd(115) });
      }
      sfx('bossShot');
    },
    (e, d, dt, agg, rage) => { // brood: launches darts, lays a slow spiral
      d.brood -= dt * agg;
      if (d.brood <= 0) {
        d.brood = 1.7;
        let spawned = 0; for (const o of enemies) if (o.brood && !o.dead) spawned++;
        if (spawned < 8) {
          for (const s of [-1, 1]) {
            const sx = e.x + s * 52, sy = e.y + 20;
            spawnEnemy('dart', sx, sy, {
              brood: true, score: 50, drop: 0, hp: 3 * hpScale(), maxHp: 3 * hpScale(),
              data: { vx: s * 160, vy: 60 },
              beh(o, dt2) { o.data.vy += 220 * dt2; o.data.vx *= Math.exp(-1.2 * dt2); o.x += o.data.vx * dt2; o.y += o.data.vy * dt2; },
              fireI: 1.2, fireT: 0.5, fire: dartFire,
            });
          }
        }
      }
      if (due(d, dt, 0.18, 1 + rage * 0.3)) { d.spin += 0.37; eBullet(e.x, e.y, d.spin, bspd(120), 'dot'); eBullet(e.x, e.y, d.spin + Math.PI, bspd(120), 'dot'); }
    },
  ],
  // SERAPH
  [
    (e, d, dt, agg, rage) => { // twin spirals
      if (!due(d, dt, 0.09, 1 + rage * 0.35)) return;
      const arms = rage > 0.6 ? 3 : 2;
      d.spin += 0.23;
      for (let k = 0; k < arms; k++) {
        eBullet(e.x, e.y + 6, d.spin + k * TAU / arms, bspd(150), 'dot');
        if (rage > 0.45 && k === 0) eBullet(e.x, e.y + 6, -d.spin * 0.8, bspd(115), 'needle');
      }
    },
    (e, d, dt, agg, rage) => { // falling walls with a gap
      if (!due(d, dt, rage > 0.5 ? 0.62 : 0.8, 1)) return;
      const gapW = 78 - rage * 14;
      const gx = clamp((P.alive ? P.x : W / 2) + rand(-110, 110), gapW, W - gapW);
      for (let x = 12; x < W; x += 22) {
        if (Math.abs(x - gx) < gapW / 2) continue;
        eBullet(x, e.y - 10 + Math.sin(x * 0.05) * 6, Math.PI / 2, bspd(150), 'needle');
      }
      sfx('bossShot');
    },
    (e, d, dt, agg, rage) => { // feather volleys: wide fans with a slot where you stand
      if (!due(d, dt, 0.95, agg)) return;
      const a = aimAt(e.x, e.y);
      const n = 11, spread = 1.35;
      for (let i = 0; i < n; i++) {
        if (i === 5) continue;
        eBullet(e.x, e.y + 20, a - spread / 2 + spread * i / (n - 1), bspd(250), 'needle');
      }
      if (rage > 0.45) { eBullet(e.x - 42, e.y, aimAt(e.x - 42, e.y), bspd(170), 'orb'); eBullet(e.x + 42, e.y, aimAt(e.x + 42, e.y), bspd(170), 'orb'); }
      sfx('bossShot');
    },
  ],
  // LEVIATHAN
  [
    (e, d, dt, agg, rage) => { // rain lanes
      const n = due(d, dt, 0.11, 1 + rage * 0.8);
      for (let k = 0; k < n; k++) {
        const c = BOSSES[3].circles[randi(0, 4)];
        eBullet(e.x + c.x + rand(-10, 10), e.y + c.y + 10, Math.PI / 2 + rand(-0.25, 0.25), bspd(rand(150, 200)), 'dot');
      }
    },
    (e, d, dt, agg, rage) => { // bloom orbs
      if (!due(d, dt, 1.45, 1 + rage * 0.5)) return;
      const src = rage > 0.5 ? [-82, 0, 82] : [-82, 82];
      for (const sx of src) {
        const x = e.x + sx, y = e.y + 14;
        eBullet(x, y, aimAt(x, y), bspd(80), 'big', { burst: 1.35, burstN: 16, burstSpd: bspd(120), burstKind: 'dot' });
      }
      sfx('bossShot');
    },
    (e, d, dt, agg, rage) => { // rose
      if (!due(d, dt, 0.15, 1 + rage * 0.4)) return;
      const arms = rage > 0.5 ? 6 : 5;
      d.spin += 0.11;
      const sp = bspd(115 + 45 * Math.sin(d.spin * 3));
      for (let k = 0; k < arms; k++) eBullet(e.x, e.y + 20, d.spin + k * TAU / arms, sp, k % 2 ? 'dot' : 'orb');
    },
  ],
];

function bossDefeated(e) {
  // keep the hull on screen for its death sequence
  e.dead = false; e.invuln = true; e.intangible = true; e.fireI = 0;
  e.data.phase = 'dying'; e.data.dieT = 2.4;
  Run.bossActive = false;
  cancelBullets(true);
  for (const o of enemies) if (o !== e && !o.dead) { o.dead = true; explode(o.x, o.y, o.size); }
  Run.shake = 10; Run.flash = 0.5; Run.flashColor = '#ffffff';
  sfx('boomL');
}

function bossDying(e, dt) {
  const d = e.data;
  d.dieT -= dt;
  e.x += rand(-1.5, 1.5); e.y += 8 * dt;
  if (Math.random() < 21 * dt) {
    const c = pick(e.circles);
    explode(e.x + c.x + rand(-c.r, c.r) * 0.7, e.y + c.y + rand(-c.r, c.r) * 0.7, randi(1, 2), pick(['#ffb347', '#ff7a3d', BOSSES[e.design].accent]));
  }
  if (d.dieT <= 0) {
    e.dead = true;
    const num = Run.wave / 5;
    const pts = 20000 * num;
    addScore(pts);
    Run.bossesBeaten++;
    for (let i = 0; i < 4; i++) explode(e.x + rand(-60, 60), e.y + rand(-30, 30), 3, '#ffcf6a');
    explode(e.x, e.y, 6, '#fff0c0');
    part({ type: 'ring', x: e.x, y: e.y, r: 20, vr: 700, life: 0.8, color: '#ffffff', width: 8 });
    Run.flash = 1; Run.flashColor = '#fff6e0'; Run.shake = 20;
    floatText(e.x, e.y, BOSSES[e.design].name + ' DOWN  +' + pts, '#ffe28a', 16);
    spawnPod(e.x - 30, e.y, 'power');
    spawnPod(e.x + 30, e.y, 'weapon');
    if (Run.diff.drop > 1.2) spawnPod(e.x, e.y + 20, 'power');
    Run.boss = null;
    Run.between = 3.8;
    Run.banner = { title: 'TARGET DESTROYED', sub: BOSSES[e.design].name + ' · +' + pts, color: '#ffe28a' };
    Run.bannerT = 3.2;
    Music.play('combat');
  }
}

// ---------------------------------------------------------------------
// Drawing helpers
// ---------------------------------------------------------------------
const hasLetterSpacing = 'letterSpacing' in ctx;

function text(str, x, y, size, color, align, weight, font, spacing) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + (font || FONT_UI);
  ctx.fillStyle = color || '#fff';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (hasLetterSpacing) {
    ctx.letterSpacing = (spacing || 0) + 'px';
    // canvas adds the spacing after the last glyph too; recentre for that
    if (spacing && ctx.textAlign === 'center') x += spacing / 2;
    else if (spacing && ctx.textAlign === 'right') x += spacing;
  }
  ctx.fillText(str, x, y);
  if (hasLetterSpacing && spacing) ctx.letterSpacing = '0px';
}

function wrapText(str, x, y, maxW, lineH, size, color, weight, align) {
  ctx.font = (weight || 'normal') + ' ' + size + 'px ' + FONT_UI;
  if (hasLetterSpacing) ctx.letterSpacing = '0px';
  const words = str.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      text(line, x, y, size, color, align || 'left', weight || 'normal');
      line = w; y += lineH;
    } else line = test;
  }
  if (line) { text(line, x, y, size, color, align || 'left', weight || 'normal'); y += lineH; }
  return y;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function poly(pts) {
  ctx.beginPath();
  for (let i = 0; i < pts.length; i += 2) i ? ctx.lineTo(pts[i], pts[i + 1]) : ctx.moveTo(pts[i], pts[i + 1]);
  ctx.closePath();
}

function glowDot(x, y, r, color, a) {
  ctx.globalAlpha = (a == null ? 1 : a) * 0.35; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, TAU); ctx.fill();
  ctx.globalAlpha = a == null ? 1 : a;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

function metal(y0, y1, dark, light) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, light); g.addColorStop(1, dark);
  return g;
}

// Player ships
