// Other constants that shape the feel, kept together for easy tweaking.
const GROUND_SPEED = 38;          // px per second

// ---- Palette ---------------------------------------------------------------
const C = {
  ink: '#f2ead8',       // warm paper white for HUD text
  dim: '#8d93a3',
  brass: '#e8b64c',     // the meridian line, gold pods, highlights
  signal: '#5fe1e6',    // selection and player UI

// ---- Maths -----------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const DEG = Math.PI / 180;
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Remove dead entries in place without allocating.
function compact(arr) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (!o.dead) arr[j++] = o; }
  arr.length = j;
}

// ---- Canvas and scaling ------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1, dpr = 1, RES = 1;
const resizeListeners = [];

function resize() {
  const r = document.body.getBoundingClientRect();
  const vw = Math.max(1, r.width || window.innerWidth), vh = Math.max(1, r.height || window.innerHeight);
  viewScale = Math.min(vw / W, vh / H);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cssW = Math.floor(W * viewScale), cssH = Math.floor(H * viewScale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  const newRes = canvas.width / W;
  if (Math.abs(newRes - RES) > 0.01) { RES = newRes; for (const fn of resizeListeners) fn(); }
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

// ---- Input -------------------------------------------------------------------
const ACTIONS = {
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  fire: ['KeyZ', 'KeyJ', 'Space'], bomb: ['KeyX', 'KeyK'], slow: ['ShiftLeft', 'ShiftRight', 'KeyC'],
  pause: ['Escape', 'KeyP'], confirm: ['KeyZ', 'Enter', 'NumpadEnter', 'Space'], back: ['KeyX', 'Escape', 'Backspace'],
  abandon: ['KeyQ'], auto: ['KeyF'], mute: ['KeyM'], music: ['KeyN'],
};
const GAME_CODES = new Set(Object.values(ACTIONS).flat());

const Input = {
  down: new Set(),
  pressed: new Set(),
  held(action) { for (const c of ACTIONS[action]) if (this.down.has(c)) return true; return false; },
  hit(action) {
    let got = false;
    for (const c of ACTIONS[action]) if (this.pressed.has(c)) { this.pressed.delete(c); got = true; }
    return got;
  },
  endFrame() { this.pressed.clear(); },
};

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (GAME_CODES.has(e.code)) e.preventDefault();
  const menuRepeat = e.repeat && (e.code.startsWith('Arrow') || e.code === 'KeyW' || e.code === 'KeyS' || e.code === 'KeyA' || e.code === 'KeyD');
  if (!e.repeat || menuRepeat) Input.pressed.add(e.code);
  Input.down.add(e.code);
  Sound.unlock();
});
window.addEventListener('keyup', e => { Input.down.delete(e.code); });
window.addEventListener('blur', () => Input.down.clear());

// Pointer: drag anywhere to move; taps go to whatever UI was drawn last frame.
const Pointer = {
  dragId: null, lastX: 0, lastY: 0, dx: 0, dy: 0,
  x: -99, y: -99,
  taps: [],
  touchMode: !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches),
  get dragging() { return this.dragId !== null; },
};

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.unlock();
  canvas.focus({ preventScroll: true });
  if (e.pointerType === 'touch' || e.pointerType === 'pen') Pointer.touchMode = true;
  const p = toLogical(e);
  Pointer.x = p.x; Pointer.y = p.y;
  if (Game.state === 'play' && !Game.paused) {
    if (hudButtonAt(p.x, p.y)) return;
    if (Pointer.dragId === null) {
      Pointer.dragId = e.pointerId; Pointer.lastX = p.x; Pointer.lastY = p.y;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
    return;
  }
  Pointer.taps.push(p);
});
canvas.addEventListener('pointermove', e => {
  const p = toLogical(e);
  Pointer.x = p.x; Pointer.y = p.y;
  if (e.pointerId === Pointer.dragId) {
    Pointer.dx += p.x - Pointer.lastX; Pointer.dy += p.y - Pointer.lastY;
    Pointer.lastX = p.x; Pointer.lastY = p.y;
  }
});
function endPointer(e) { if (e.pointerId === Pointer.dragId) { Pointer.dragId = null; Pointer.dx = Pointer.dy = 0; } }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());


// ---- Sound -------------------------------------------------------------------
// Everything is synthesised at runtime with the Web Audio API.
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);

const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null,
  muted: false, musicMuted: false,
  noiseBuf: null, voices: 0, gates: {},

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
      comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9; this.master.connect(comp);
      this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.75; this.sfxBus.connect(this.master);
      this.musicBus = c.createGain(); this.musicBus.gain.value = this.musicMuted ? 0 : 0.38; this.musicBus.connect(this.master);
      const len = c.sampleRate | 0;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      Music.start();
    }
    if (this.ctx.state !== 'running' && !document.hidden) this.ctx.resume().catch(() => {});
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resume() { if (this.ctx && this.ctx.state !== 'running' && !document.hidden) this.ctx.resume().catch(() => {}); },
  get ready() { return !!(this.ctx && this.ctx.state === 'running'); },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02);
  },
  setMusicMuted(m) {
    this.musicMuted = m;
    if (this.musicBus) this.musicBus.gain.setTargetAtTime(m ? 0 : 0.38, this.ctx.currentTime, 0.02);
  },

  gate(name, gap) {
    const now = this.ctx.currentTime;
    if (this.gates[name] !== undefined && now - this.gates[name] < gap) return false;
    this.gates[name] = now; return true;
  },

  // A single oscillator voice with an attack/decay envelope and optional pitch slide.
  tone(freq, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const bus = o.bus || this.sfxBus;
    if (bus === this.sfxBus && this.voices > 40) return;
    const t = o.when || c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + (o.slideTime || dur));
    if (o.detune) osc.detune.setValueAtTime(o.detune, t);
    const vol = o.vol === undefined ? 0.2 : o.vol, atk = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + atk);
    if (o.hold) g.gain.setValueAtTime(vol, t + atk + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filter) {
      const f = c.createBiquadFilter(); f.type = o.filterType || 'lowpass'; f.Q.value = o.q || 0.7;
      f.frequency.setValueAtTime(o.filter, t);
      if (o.filterEnd) f.frequency.exponentialRampToValueAtTime(o.filterEnd, t + dur);
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(bus);
    osc.start(t); osc.stop(t + dur + 0.05);
    if (bus === this.sfxBus) { this.voices++; osc.onended = () => { this.voices--; }; }
  },

  noise(dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const bus = o.bus || this.sfxBus;
    if (bus === this.sfxBus && this.voices > 40) return;
    const t = o.when || c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.freq || 2000, t);
    if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t + dur);
    const g = c.createGain();
    const vol = o.vol === undefined ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
    if (bus === this.sfxBus) { this.voices++; src.onended = () => { this.voices--; }; }
  },

  play(name, arg) {
    if (!this.ready) return;
    const fx = SFX[name]; if (fx) fx(this, arg);
  },
};

const SFX = {
  shot(s, w) {
    if (!s.gate('shot', 0.07)) return;
    if (w === 0) s.tone(1100, 0.045, { type: 'square', vol: 0.025, slide: 500 });
    else if (w === 1) s.tone(1700, 0.06, { type: 'triangle', vol: 0.04, slide: 900 });
    else if (w === 2) s.tone(320, 0.1, { type: 'sine', vol: 0.07, slide: 140 });
    else if (w === 3) s.noise(0.04, { type: 'highpass', freq: 5000, vol: 0.03 });
  },
  missile(s) { if (s.gate('missile', 0.12)) s.noise(0.16, { type: 'bandpass', freq: 900, freqEnd: 2600, q: 2, vol: 0.06 }); },
  arc(s) {
    if (!s.gate('arc', 0.08)) return;
    s.noise(0.07, { type: 'bandpass', freq: 3200, q: 5, vol: 0.09 });
    s.tone(2200, 0.05, { type: 'square', vol: 0.02, slide: 700 });
  },
  hit(s) { if (s.gate('hit', 0.04)) s.noise(0.03, { type: 'highpass', freq: 3500, vol: 0.045 }); },
  clink(s) { if (s.gate('clink', 0.09)) s.tone(2600, 0.05, { type: 'triangle', vol: 0.05, slide: 2200 }); },
  splash(s) { if (s.gate('splash', 0.06)) s.noise(0.12, { type: 'lowpass', freq: 2400, freqEnd: 400, vol: 0.08 }); },
  explode(s, size = 1) {
    if (!s.gate('explode' + size, 0.035)) return;
    s.noise(0.18 + 0.12 * size, { type: 'lowpass', freq: 2600, freqEnd: 160, vol: 0.12 + 0.07 * size });
    s.tone(150, 0.16 + 0.08 * size, { type: 'sine', vol: 0.14 + 0.08 * size, slide: 38 });
  },
  bigBoom(s) {
    s.noise(1.6, { type: 'lowpass', freq: 2200, freqEnd: 60, vol: 0.5 });
    s.tone(95, 1.3, { type: 'sine', vol: 0.5, slide: 25 });
    s.tone(60, 1.6, { type: 'triangle', vol: 0.25, slide: 20, attack: 0.05 });
  },
  bomb(s) {
    s.noise(0.7, { type: 'bandpass', freq: 300, freqEnd: 5000, q: 1.2, vol: 0.3 });

// A step sequencer that schedules notes slightly ahead of the audio clock,
// so timing never drifts with the frame rate.
const Inst = {
  kick(t, v = 0.5) { Sound.tone(150, 0.24, { type: 'sine', vol: v, slide: 42, slideTime: 0.12, bus: Sound.musicBus, when: t }); },
  snare(t, v = 0.28) {
    Sound.noise(0.15, { type: 'highpass', freq: 1400, vol: v, bus: Sound.musicBus, when: t });
    Sound.tone(190, 0.09, { type: 'triangle', vol: v * 0.7, slide: 140, bus: Sound.musicBus, when: t });
  },
  hat(t, v = 0.08, open = false) { Sound.noise(open ? 0.14 : 0.035, { type: 'highpass', freq: 7200, vol: v, bus: Sound.musicBus, when: t }); },
  tom(t, n, v = 0.3) { Sound.tone(mtof(n), 0.22, { type: 'sine', vol: v, slide: mtof(n) * 0.55, bus: Sound.musicBus, when: t }); },
  bass(t, n, dur, v = 0.22, cut = 900) {
    Sound.tone(mtof(n), dur, { type: 'sawtooth', vol: v, filter: cut, filterEnd: 180, q: 3, bus: Sound.musicBus, when: t, hold: dur * 0.3 });
  },
  lead(t, n, dur, v = 0.08, type = 'square', cut = 2800) {
    Sound.tone(mtof(n), dur, { type, vol: v, filter: cut, detune: -7, bus: Sound.musicBus, when: t, attack: 0.01, hold: dur * 0.55 });
    Sound.tone(mtof(n), dur, { type, vol: v * 0.7, filter: cut, detune: 7, bus: Sound.musicBus, when: t, attack: 0.01, hold: dur * 0.55 });
  },
  pad(t, notes, dur, v = 0.05) {
    for (const n of notes) Sound.tone(mtof(n), dur, { type: 'triangle', vol: v, bus: Sound.musicBus, when: t, attack: dur * 0.35, hold: dur * 0.2, filter: 1600 });
  },
  bell(t, n, dur, v = 0.07) {
    Sound.tone(mtof(n), dur, { type: 'sine', vol: v, bus: Sound.musicBus, when: t, attack: 0.005 });
    Sound.tone(mtof(n) * 2.76, dur * 0.4, { type: 'sine', vol: v * 0.25, bus: Sound.musicBus, when: t, attack: 0.002 });
  },
  stab(t, notes, dur, v = 0.05, type = 'square') {
    for (const n of notes) Sound.tone(mtof(n), dur, { type, vol: v, filter: 2000, filterEnd: 500, bus: Sound.musicBus, when: t });
  },
  fall(t, n, dur, v = 0.1) {
    Sound.tone(mtof(n), dur, { type: 'sawtooth', vol: v, slide: mtof(n - 3), slideTime: dur, filter: 1400, filterEnd: 300, bus: Sound.musicBus, when: t, attack: 0.03, hold: dur * 0.4 });
  },
};

function notesAt(list, step) { // list of [step, note, len]
  const out = [];
  for (const e of list) if (e[0] === step) out.push(e);
  return out;
}

const TRACKS = {
  // Sparse, for the menus.
  menu: (() => {
    const roots = [45, 41, 48, 43];
    const chords = [[57, 60, 64], [53, 57, 60, 64], [55, 60, 64], [55, 59, 62]];
    const bells = [
      [[0, 76], [6, 72], [12, 69]],
      [[4, 77], [10, 76]],
      [[0, 79], [8, 76], [14, 74]],
      [[6, 71], [12, 74]],
    ];
    return {
      bpm: 76, length: 64,
      play(step, t, spb) {
        const bar = (step / 16) | 0, s = step % 16;
        if (s === 0) { Inst.pad(t, chords[bar], spb * 16, 0.035); Inst.bass(t, roots[bar] - 12, spb * 12, 0.12, 300); }
        for (const b of bells[bar]) if (b[0] === s) Inst.bell(t, b[1], spb * 10, 0.06);
        if (s === 8) Inst.hat(t, 0.025, true);
      },
    };
  })(),

  // Driving, for combat.
  combat: (() => {
    const roots = [45, 45, 41, 43, 45, 45, 41, 40];
    const chords = [[57, 60, 64], [57, 60, 64], [53, 57, 60], [55, 59, 62], [57, 60, 64], [57, 60, 64], [53, 57, 60], [52, 56, 59]];
    const bassPat = [0, -1, 0, 12, 0, -1, 0, 12, 0, -1, 0, 12, 0, 7, 12, 7];
    const melody = [
      [[0, 69, 3], [3, 72, 3], [6, 76, 2], [8, 74, 4], [12, 72, 2], [14, 71, 2]],
      [[0, 69, 6], [8, 64, 2], [10, 67, 2], [12, 69, 4]],
      [[0, 72, 3], [3, 74, 3], [6, 77, 2], [8, 76, 4], [12, 74, 2], [14, 72, 2]],
      [[0, 74, 6], [8, 71, 2], [10, 74, 2], [12, 79, 4]],
      [[0, 81, 3], [3, 79, 3], [6, 76, 2], [8, 77, 2], [10, 76, 2], [12, 74, 4]],
      [[0, 72, 4], [4, 76, 4], [8, 69, 8]],
      [[0, 77, 3], [3, 76, 3], [6, 72, 2], [8, 74, 4], [12, 76, 4]],
      [[0, 80, 4], [4, 76, 4], [8, 71, 4], [12, 68, 4]],
    ];
    return {
      bpm: 140, length: 128,
      play(step, t, spb) {
        const bar = (step / 16) | 0, s = step % 16, loop = (step / 128) | 0;
        const r = roots[bar];
        const bp = bassPat[s];
        if (bp >= 0) Inst.bass(t, r - 12 + bp, spb * 0.9, 0.2, 1100);
        if (s % 4 === 0) Inst.kick(t, 0.42);
        if (s === 10 && bar % 2 === 1) Inst.kick(t, 0.3);
        if (s === 4 || s === 12) Inst.snare(t, 0.2);
        if (s % 2 === 0) Inst.hat(t, s % 4 === 2 ? 0.06 : 0.03);
        if (s === 0 || s === 6) Inst.stab(t, chords[bar], spb * 1.5, 0.028, 'sawtooth');
        if (bar === 7 && s >= 12) Inst.tom(t, 50 - (s - 12) * 3, 0.18);
        if (step >= 16 || loop > 0) for (const m of notesAt(melody[bar], s)) Inst.lead(t, m[1], spb * m[2] * 0.95, 0.045);
      },
    };
  })(),

  // Dissonant, for bosses.
  boss: (() => {
    const roots = [45, 46, 45, 51];
    const bassPat = [0, 0, 0, 1, 0, 0, 12, 0, 0, 0, 0, 1, 0, 6, 0, 12];
    const kicks = new Set([0, 3, 6, 8, 11, 14]);
    const lead = [
      [[0, 81, 8], [8, 82, 8]],
      [[0, 82, 8], [8, 81, 8]],
      [[0, 87, 6], [6, 86, 6], [12, 81, 4]],
      [[0, 75, 16]],
    ];
    return {
      bpm: 152, length: 64,
      play(step, t, spb) {
        const bar = (step / 16) | 0, s = step % 16;
        const r = roots[bar];
        Inst.bass(t, r - 12 + bassPat[s], spb * 0.85, 0.2, 1500);
        if (kicks.has(s)) Inst.kick(t, 0.45);
        if (s === 4 || s === 12) Inst.snare(t, 0.24);
        Inst.hat(t, s % 2 ? 0.02 : 0.045);
        if (s === 0 || s === 10) Inst.stab(t, [r + 12, r + 13, r + 18], spb * 2, 0.03, 'square');
        if (bar === 3 && s >= 8 && s % 2 === 0) Inst.tom(t, 55 - (s - 8) * 2, 0.22);
        for (const m of notesAt(lead[bar], s)) Inst.lead(t, m[1], spb * m[2] * 0.98, 0.03, 'sawtooth', 1800);
      },
    };
  })(),

  // A slow fall, on death. Plays once.
  death: {
    bpm: 70, length: 32, once: true,
    play(step, t, spb) {
      const line = [[0, 76, 4], [4, 75, 4], [8, 72, 4], [12, 71, 4], [16, 68, 6], [22, 64, 10]];
      for (const m of notesAt(line, step)) Inst.fall(t, m[1], spb * m[2], 0.08);
      if (step === 0) { Inst.pad(t, [57, 60, 64], spb * 16, 0.04); Inst.kick(t, 0.5); }
      if (step === 16) { Inst.pad(t, [53, 56, 60], spb * 16, 0.04); Inst.bass(t, 29, spb * 16, 0.16, 400); }
    },
  },
};

const Music = {
  name: null, track: null, step: 0, nextTime: 0, timer: null,
  start() {
    if (this.timer) return;
    this.timer = setInterval(() => this.tick(), 25);
    if (this.name) this.restart();
  },
  play(name) {
    if (this.name === name) return;
    this.name = name;
    this.restart();
  },
  restart() {
    this.track = TRACKS[this.name] || null;
    this.step = 0;
    if (Sound.ctx) this.nextTime = Sound.ctx.currentTime + 0.08;
  },
  tick() {
    const c = Sound.ctx;
    if (!c || c.state !== 'running' || !this.track) return;
    if (this.nextTime < c.currentTime - 0.2) this.nextTime = c.currentTime + 0.05;
    const spb = 60 / this.track.bpm / 4;
    while (this.nextTime < c.currentTime + 0.12) {
      if (this.track.once && this.step >= this.track.length) { this.track = null; return; }
      this.track.play(this.step % this.track.length, this.nextTime, spb);
      this.step++;
      this.nextTime += spb;
    }
  },
};

const GLYPHS = {};
for (const ch in FONT_SRC) {
  const rows = FONT_SRC[ch].split('|'), cells = [];
  rows.forEach((row, r) => { for (let c = 0; c < 5; c++) if (row[c] === '#') cells.push(c, r); });
  GLYPHS[ch] = cells;
}
const textCache = new Map();
resizeListeners.push(() => textCache.clear());

function textWidth(str, px, track = 1) { return str.length ? str.length * (5 + track) * px - track * px : 0; }

function textSprite(str, px, color, glow, track) {
  const key = str + '|' + px + '|' + color + '|' + glow + '|' + track;
  let s = textCache.get(key);
  if (s) return s;
  if (textCache.size > 500) textCache.clear();
  const pad = Math.ceil(glow * 2 + 1);
  const w = textWidth(str, px, track) + pad * 2, h = 7 * px + pad * 2;
  const k = Math.max(1, RES);
  const c = makeCanvas(w * k, h * k), g = c.getContext('2d');
  g.scale(k, k);
  g.fillStyle = color;
  if (glow) { g.shadowColor = color; g.shadowBlur = glow * k; }
  const dot = px * k >= 2.6 ? px * 0.84 : px;
  const up = str.toUpperCase();
  for (let i = 0; i < up.length; i++) {
    const cells = GLYPHS[up[i]]; if (!cells) continue;
    const ox = pad + i * (5 + track) * px;
    for (let j = 0; j < cells.length; j += 2) g.fillRect(ox + cells[j] * px, pad + cells[j + 1] * px, dot, dot);
  }
  s = { c, w, h, pad };
  textCache.set(key, s);
  return s;
}

// y is the top of the letters. align: 'left' | 'center' | 'right'
function drawText(str, x, y, px, color, align = 'left', glow = 0, track = 1) {
  str = String(str);
  if (!str.length) return 0;
  const s = textSprite(str, px, color, glow, track);
  const tw = s.w - s.pad * 2;
  let dx = x;
  if (align === 'center') dx = x - tw / 2; else if (align === 'right') dx = x - tw;
  ctx.drawImage(s.c, dx - s.pad, y - s.pad, s.w, s.h);
  return tw;
}

// Serif text for the flight manual, with word wrapping.
const SERIF = "Georgia, 'Times New Roman', Times, serif";
function wrapLines(text, maxW, font) {
  ctx.font = font;
  const out = [];
  for (const para of text.split('\n')) {
    const words = para.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
    }
    out.push(line);
  }
  return out;
}

const SPR = {};
function glowDisc(r, outer, mid, core, glowR) {
  const k = Math.max(2, RES);
  const R = glowR || r * 2.1;
  const size = R * 2 + 2;
  const c = makeCanvas(size * k, size * k), g = c.getContext('2d');
  g.scale(k, k);
  const cx = size / 2;
  const grad = g.createRadialGradient(cx, cx, r * 0.4, cx, cx, R);
  grad.addColorStop(0, outer); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.beginPath(); g.arc(cx, cx, R, 0, TAU); g.fill();
  g.fillStyle = mid; g.beginPath(); g.arc(cx, cx, r, 0, TAU); g.fill();
  g.fillStyle = core; g.beginPath(); g.arc(cx, cx, r * 0.55, 0, TAU); g.fill();
  return { c, w: size, h: size };
}
function softGlow(r, color) {
  const k = Math.max(2, RES) * 0.5;
  const size = r * 2;
  const c = makeCanvas(size * k, size * k), g = c.getContext('2d');
  g.scale(k, k);
  const grad = g.createRadialGradient(r, r, 0, r, r, r);
  grad.addColorStop(0, color); grad.addColorStop(0.35, color.replace(/[\d.]+\)$/, '0.35)')); grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, size, size);
  return { c, w: size, h: size };
}
function capsule(len, wid, outer, core, angleRight) {
  const k = Math.max(2, RES);
  const pad = wid * 1.6;
  const w = (angleRight ? len : wid) + pad * 2, h = (angleRight ? wid : len) + pad * 2;
  const c = makeCanvas(w * k, h * k), g = c.getContext('2d');
  g.scale(k, k);
  g.shadowColor = outer; g.shadowBlur = wid * 1.4 * k;
  const rr = (x, y, ww, hh, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + ww, y, x + ww, y + hh, r); g.arcTo(x + ww, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + ww, y, r); g.fill(); };
  g.fillStyle = outer;
  if (angleRight) rr(pad, pad, len, wid, wid / 2); else rr(pad, pad, wid, len, wid / 2);
  g.shadowBlur = 0; g.fillStyle = core;
  if (angleRight) rr(pad + len * 0.18, pad + wid * 0.28, len * 0.64, wid * 0.44, wid * 0.22);
  else rr(pad + wid * 0.28, pad + len * 0.18, wid * 0.44, len * 0.64, wid * 0.22);
  return { c, w, h };
}

function blit(sp, x, y, scale = 1) {
  const w = sp.w * scale, h = sp.h * scale;
  ctx.drawImage(sp.c, x - w / 2, y - h / 2, w, h);
}
function blitRot(sp, x, y, a, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  const w = sp.w * scale, h = sp.h * scale;
  ctx.drawImage(sp.c, -w / 2, -h / 2, w, h);
  ctx.restore();
}

function drawPlayerShip(pilot, x, y, bank, t, scale = 1, alpha = 1) {
  const sp = SHIP_PATHS[pilot.id];
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale * (1 - 0.26 * Math.abs(bank)), scale);
  ctx.globalAlpha = alpha;
  // engine flame
  ctx.globalCompositeOperation = 'lighter';
  const fl = 7 + Math.sin(t * 60) * 2 + Math.random() * 2;
  for (const e of sp.engines) {
    const gr = ctx.createLinearGradient(0, e[1], 0, e[1] + fl + 6);
    gr.addColorStop(0, 'rgba(255,240,200,0.95)'); gr.addColorStop(0.4, pilot.trim); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.moveTo(e[0] - 2.6, e[1] - 1); ctx.lineTo(e[0] + 2.6, e[1] - 1); ctx.lineTo(e[0], e[1] + fl + 6); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = pilot.hull; ctx.fill(sp.hull);
  // lit from the left: shade the right half, more when banking
  ctx.save(); ctx.clip(sp.hull);
  ctx.fillStyle = 'rgba(10,14,30,' + (0.22 + 0.2 * Math.max(0, bank)) + ')';
  ctx.fillRect(0, -30, 30, 60);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.15 * Math.max(0, -bank)) + ')';
  ctx.fillRect(-30, -30, 30 + bank * 4, 60);
  ctx.restore();
  ctx.fillStyle = pilot.trim; ctx.fill(sp.trim);
  ctx.strokeStyle = 'rgba(8,10,20,0.55)'; ctx.lineWidth = 1; ctx.stroke(sp.hull);
  const cp = sp.canopy;
  ctx.fillStyle = pilot.canopy;
  ctx.beginPath(); ctx.ellipse(cp[0], cp[1], cp[2], cp[3], 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.ellipse(cp[0] - cp[2] * 0.35, cp[1] - cp[3] * 0.3, cp[2] * 0.3, cp[3] * 0.4, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawShadow(path, x, y, rot = 0, scale = 0.7, alpha = 0.28) {
  ctx.save();
  ctx.translate(x + 12, y + 20); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
  ctx.fill(path);
  ctx.restore();
}


// ---- Ground ---------------------------------------------------------------------------
// Four regions, each generated once into a seamless tile that scrolls forever.
const TILE_H = 720;

function genTile(region) {
  const k = 2;
  const c = makeCanvas(W * k, TILE_H * k), g = c.getContext('2d');
  g.scale(k, k);
  const R = mulberry32(9127 + region * 7919);
  const rr = (a, b) => a + R() * (b - a);
  const rpick = arr => arr[Math.floor(R() * arr.length)];
  // Draw fn at y, plus a copy shifted by a tile height if it crosses an edge.
  const wrap = (y, ext, fn) => {
    fn(0);
    if (y - ext < 0) { g.save(); g.translate(0, TILE_H); fn(TILE_H); g.restore(); }
    if (y + ext > TILE_H) { g.save(); g.translate(0, -TILE_H); fn(-TILE_H); g.restore(); }
  };
  const blob = (x, y, r, color) => {
    const n = 9, ph = rr(0, TAU), wob = [];
    for (let i = 0; i < n; i++) wob.push(rr(0.72, 1.12));
    wrap(y, r * 1.2, () => {
    g.fillStyle = color; g.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = ph + i / n * TAU, q = wob[i % n];
      const px = x + Math.cos(a) * r * q, py = y + Math.sin(a) * r * q;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.fill();
    });
  };
  const S = y => TAU * y / TILE_H;

  if (region === 0) {
    // COASTLINE: sea to the west, farmland and a coastal road to the east.
    const coast = y => 236 + 54 * Math.sin(S(y)) + 26 * Math.sin(2 * S(y) + 1.3) + 11 * Math.sin(5 * S(y) + 0.4);
    const sea = g.createLinearGradient(0, 0, 300, 0);
    sea.addColorStop(0, '#0d2c47'); sea.addColorStop(1, '#16496a');
    g.fillStyle = sea; g.fillRect(0, 0, W, TILE_H);
    // swell lines
    g.strokeStyle = 'rgba(120,190,220,0.13)'; g.lineWidth = 1.2;
    for (let i = 0; i < 240; i++) {
      const y = rr(0, TILE_H), x = rr(0, coast(y) - 30), l = rr(5, 16);
      wrap(y, 4, () => { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 2, x + l, y); g.stroke(); });
    }
    // shallows
    const band = (off, color) => {
      g.fillStyle = color; g.beginPath(); g.moveTo(W, 0);
      for (let y = 0; y <= TILE_H; y += 4) g.lineTo(coast(y) + off, y);
      g.lineTo(W, TILE_H); g.closePath(); g.fill();
    };
    band(-46, 'rgba(40,120,150,0.35)');
    band(-22, 'rgba(80,170,180,0.4)');
    band(-8, 'rgba(150,210,200,0.45)');
    band(0, '#d9c48f');     // beach
    band(12, '#48673b');    // land
    // foam
    g.strokeStyle = 'rgba(240,250,255,0.55)'; g.lineWidth = 1.5; g.setLineDash([6, 5]);
    g.beginPath(); for (let y = 0; y <= TILE_H; y += 4) { const x = coast(y) - 4; if (y === 0) g.moveTo(x, y); else g.lineTo(x, y); } g.stroke();
    g.setLineDash([]);
    // rocks and an islet
    for (let i = 0; i < 10; i++) { const y = rr(0, TILE_H), x = rr(20, coast(y) - 60); blob(x, y, rr(3, 8), '#4a5560'); blob(x - 1, y - 1, rr(2, 4), '#6d7883'); }
    { const y = 520, x = 70; blob(x, y, 34, 'rgba(80,170,180,0.4)'); blob(x, y, 24, '#d9c48f'); blob(x + 2, y, 18, '#4f6f3f'); }
    // fields
    const fieldCols = ['#6b7d3f', '#7d8a4a', '#566e37', '#8a7a45', '#5e7a42'];
    for (let i = 0; i < 16; i++) {
      const y = rr(0, TILE_H), x = coast(y) + rr(40, 190), w = rr(40, 80), h = rr(40, 90), a = rr(-0.15, 0.15), col = rpick(fieldCols);
      wrap(y, 70, () => {
        g.save(); g.translate(x, y); g.rotate(a);
        g.fillStyle = col; g.fillRect(-w / 2, -h / 2, w, h);
        g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 1;
        for (let s = -w / 2 + 4; s < w / 2; s += 5) { g.beginPath(); g.moveTo(s, -h / 2); g.lineTo(s, h / 2); g.stroke(); }
        g.strokeStyle = 'rgba(30,40,20,0.35)'; g.strokeRect(-w / 2, -h / 2, w, h);
        g.restore();
      });
    }
    // road
    const road = y => coast(y) + 34 + 14 * Math.sin(3 * S(y) + 2);
    g.strokeStyle = '#5d584c'; g.lineWidth = 8;
    g.beginPath(); for (let y = 0; y <= TILE_H; y += 4) { if (y === 0) g.moveTo(road(y), y); else g.lineTo(road(y), y); } g.stroke();
    g.strokeStyle = 'rgba(240,220,160,0.5)'; g.lineWidth = 1; g.setLineDash([5, 7]);
    g.beginPath(); for (let y = 0; y <= TILE_H; y += 4) { if (y === 0) g.moveTo(road(y), y); else g.lineTo(road(y), y); } g.stroke();
    g.setLineDash([]);
    // houses along the road
    for (let i = 0; i < 26; i++) {
      const y = rr(0, TILE_H), side = R() < 0.5 ? -1 : 1, x = road(y) + side * rr(10, 22), s = rr(5, 9);
      const roof = rpick(['#b5533c', '#8c4a3a', '#c9b79a', '#6f7c86']);
      wrap(y, 12, () => {
        g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x - s / 2 + 2, y - s / 2 + 3, s, s);
        g.fillStyle = roof; g.fillRect(x - s / 2, y - s / 2, s, s);
        g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x - s / 2, y - s / 2, s / 2, s);
      });
    }
    // woods
    for (let i = 0; i < 70; i++) {
      const y = rr(0, TILE_H), x = clamp(coast(y) + rr(30, 260), coast(y) + 26, W + 10), n = 3 + Math.floor(R() * 6);
      for (let j = 0; j < n; j++) {
        const tx = x + rr(-14, 14), ty = y + rr(-14, 14), r = rr(3.5, 7);
        blob(tx + 2, ty + 3, r, 'rgba(10,20,10,0.35)');
        blob(tx, ty, r, rpick(['#2c4a28', '#335530', '#27422a']));
        blob(tx - r * 0.3, ty - r * 0.3, r * 0.45, 'rgba(120,170,90,0.35)');
      }
    }
  } else if (region === 1) {
    // FOUNDRY: deck plates, pipework, a molten channel and chemical tanks.
    g.fillStyle = '#23262c'; g.fillRect(0, 0, W, TILE_H);
    for (let y = 0; y < TILE_H; y += 60) for (let x = 0; x < W; x += 60) {
      g.fillStyle = rpick(['#2a2e35', '#262a30', '#30343b', '#2c3036']);
      g.fillRect(x + 1, y + 1, 58, 58);
      g.fillStyle = 'rgba(255,255,255,0.04)'; g.fillRect(x + 1, y + 1, 58, 2);
      g.fillStyle = '#3b4049';
      for (const [dx, dy] of [[5, 5], [55, 5], [5, 55], [55, 55]]) { g.beginPath(); g.arc(x + dx, y + dy, 1.4, 0, TAU); g.fill(); }
      if (R() < 0.12) { g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1; for (let s = 8; s < 58; s += 6) { g.beginPath(); g.moveTo(x + s, y + 10); g.lineTo(x + s, y + 50); g.stroke(); } }
    }
    // hazard stripes
    for (let i = 0; i < 7; i++) {
      const x = Math.floor(rr(0, 7)) * 60 + 1, y = Math.floor(rr(0, 12)) * 60 + 1;
      g.save(); g.beginPath(); g.rect(x, y + 20, 58, 18); g.clip();
      g.fillStyle = '#1a1a1a'; g.fillRect(x, y + 20, 58, 18);
      g.fillStyle = '#d9a322';
      for (let s = -20; s < 70; s += 12) { g.beginPath(); g.moveTo(x + s, y + 38); g.lineTo(x + s + 6, y + 38); g.lineTo(x + s + 24, y + 20); g.lineTo(x + s + 18, y + 20); g.fill(); }
      g.restore();
    }
    // molten channel
    const chan = y => 96 + 34 * Math.sin(S(y) + 0.6) + 10 * Math.sin(3 * S(y));
    const channel = (wid, color, blur) => {
      g.save(); g.strokeStyle = color; g.lineWidth = wid; g.lineCap = 'round';
      if (blur) { g.shadowColor = '#ff6a1a'; g.shadowBlur = blur; }
      g.beginPath(); for (let y = -10; y <= TILE_H + 10; y += 4) { if (y === -10) g.moveTo(chan(y), y); else g.lineTo(chan(y), y); } g.stroke();
      g.restore();
    };
    channel(30, '#15171b'); channel(22, '#3a1f12'); channel(14, '#c83e0c', 18); channel(7, '#ff8a2a', 10); channel(2.5, '#ffe0a0');
    // crust flecks on the melt
    for (let i = 0; i < 60; i++) { const y = rr(0, TILE_H), x = chan(y) + rr(-5, 5); blob(x, y, rr(1, 2.4), 'rgba(60,20,10,0.7)'); }
    // pipes
    const pipeH = (y, x0, x1, r) => {
      const gr = g.createLinearGradient(0, y - r, 0, y + r);
      gr.addColorStop(0, '#5a616c'); gr.addColorStop(0.35, '#9aa3ae'); gr.addColorStop(1, '#2f343b');
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x0 + 3, y - r + 4, x1 - x0, r * 2);
      g.fillStyle = gr; g.fillRect(x0, y - r, x1 - x0, r * 2);
      g.fillStyle = '#434951'; for (let x = x0 + 20; x < x1; x += 46) g.fillRect(x, y - r - 1, 5, r * 2 + 2);
    };
    const pipeV = (x, y0, y1, r) => {
      const gr = g.createLinearGradient(x - r, 0, x + r, 0);
      gr.addColorStop(0, '#5a616c'); gr.addColorStop(0.35, '#9aa3ae'); gr.addColorStop(1, '#2f343b');
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x - r + 4, y0 + 3, r * 2, y1 - y0);
      g.fillStyle = gr; g.fillRect(x - r, y0, r * 2, y1 - y0);
      g.fillStyle = '#434951'; for (let y = y0 + 20; y < y1; y += 46) g.fillRect(x - r - 1, y, r * 2 + 2, 5);
    };
    pipeV(300, -10, TILE_H + 10, 7); pipeV(318, -10, TILE_H + 10, 4);
    pipeH(150, 140, W + 10, 6); pipeH(430, 180, 300, 5); pipeH(610, 300, W + 10, 8);
    pipeV(410, 150, 610, 5);
    // tanks and vents
    const tank = (x, y, r) => wrap(y, r + 6, () => {
      g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.arc(x + 5, y + 7, r, 0, TAU); g.fill();
      const gr = g.createRadialGradient(x - r * 0.4, y - r * 0.4, 2, x, y, r);
      gr.addColorStop(0, '#9aa3ae'); gr.addColorStop(1, '#3a4048');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      g.strokeStyle = '#2a2e34'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r * 0.7, 0, TAU); g.stroke();
      g.fillStyle = '#d9a322'; g.fillRect(x - 3, y - r + 3, 6, 6);
    });
    tank(210, 60, 30); tank(250, 330, 24); tank(430, 290, 34); tank(200, 540, 22); tank(455, 700, 26);
    const vent = (x, y, r) => wrap(y, r, () => {
      g.fillStyle = '#15171b'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      g.strokeStyle = '#3d434c'; g.lineWidth = 1.5;
      for (let s = -r + 3; s < r; s += 4) { const h = Math.sqrt(r * r - s * s); g.beginPath(); g.moveTo(x - h, y + s); g.lineTo(x + h, y + s); g.stroke(); }
      g.strokeStyle = '#4a515b'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
    });
    for (let i = 0; i < 9; i++) vent(rr(180, 460), rr(0, TILE_H), rr(7, 13));
    // glow pools of heat
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 14; i++) { const y = rr(0, TILE_H), x = chan(y); wrap(y, 40, () => { const gr = g.createRadialGradient(x, y, 0, x, y, 40); gr.addColorStop(0, 'rgba(255,100,30,0.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - 40, y - 40, 80, 80); }); }
    g.globalCompositeOperation = 'source-over';
  } else if (region === 2) {
    // DUNE SEA: long ridges with lit and shadowed faces, rocks, a dry riverbed.
    const base = g.createLinearGradient(0, 0, W, 0);
    base.addColorStop(0, '#b98a4f'); base.addColorStop(1, '#c99c5f');
    g.fillStyle = base; g.fillRect(0, 0, W, TILE_H);
    for (let i = 0; i < 18; i++) {
      const y0 = i * 40 + rr(-6, 6), k1 = randi(1, 3), k2 = randi(3, 6), a1 = rr(8, 18), a2 = rr(2, 6), p1 = rr(0, TAU), p2 = rr(0, TAU);
      const ridge = x => y0 + a1 * Math.sin(TAU * k1 * x / W + p1) + a2 * Math.sin(TAU * k2 * x / W + p2);
      wrap(y0, 40, () => {
        // lit face above
        g.fillStyle = 'rgba(235,195,130,0.55)'; g.beginPath(); g.moveTo(0, ridge(0));
        for (let x = 0; x <= W; x += 6) g.lineTo(x, ridge(x));
        for (let x = W; x >= 0; x -= 6) g.lineTo(x, ridge(x) - 12 - 4 * Math.sin(x * 0.02 + p2));
        g.closePath(); g.fill();
        // shadow face below
        g.fillStyle = 'rgba(120,75,35,0.42)'; g.beginPath(); g.moveTo(0, ridge(0));
        for (let x = 0; x <= W; x += 6) g.lineTo(x, ridge(x));
        for (let x = W; x >= 0; x -= 6) g.lineTo(x, ridge(x) + 9 + 5 * Math.sin(x * 0.03 + p1));
        g.closePath(); g.fill();
        g.strokeStyle = 'rgba(90,55,25,0.35)'; g.lineWidth = 1; g.beginPath();
        for (let x = 0; x <= W; x += 6) { if (x === 0) g.moveTo(x, ridge(x)); else g.lineTo(x, ridge(x)); }
        g.stroke();
      });
    }
    // ripples
    g.strokeStyle = 'rgba(110,70,30,0.12)'; g.lineWidth = 1;
    for (let i = 0; i < 420; i++) { const x = rr(0, W), y = rr(0, TILE_H), l = rr(4, 10); wrap(y, 3, () => { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y + 1.5, x + l, y); g.stroke(); }); }
    // dry riverbed
    const bed = y => 360 + 60 * Math.sin(S(y) + 2.2) + 18 * Math.sin(4 * S(y));
    g.strokeStyle = 'rgba(95,60,30,0.28)'; g.lineWidth = 16; g.lineCap = 'round';
    g.beginPath(); for (let y = -10; y <= TILE_H + 10; y += 5) { if (y === -10) g.moveTo(bed(y), y); else g.lineTo(bed(y), y); } g.stroke();
    g.strokeStyle = 'rgba(225,205,170,0.35)'; g.lineWidth = 5;
    g.beginPath(); for (let y = -10; y <= TILE_H + 10; y += 5) { if (y === -10) g.moveTo(bed(y) + 2, y); else g.lineTo(bed(y) + 2, y); } g.stroke();
    // rocks
    for (let i = 0; i < 26; i++) {
      const x = rr(0, W), y = rr(0, TILE_H), r = rr(3, 12);
      blob(x + r * 0.5, y + r * 0.7, r, 'rgba(70,40,20,0.35)');
      blob(x, y, r, rpick(['#7b5a3a', '#6a4c33', '#86664a']));
      blob(x - r * 0.3, y - r * 0.3, r * 0.5, 'rgba(230,190,140,0.35)');
    }
    // a buried ruin
    wrap(200, 40, () => {
      g.strokeStyle = 'rgba(80,55,35,0.55)'; g.lineWidth = 3;
      g.strokeRect(60, 180, 54, 40); g.strokeRect(74, 190, 26, 20);
      g.beginPath(); g.moveTo(114, 200); g.lineTo(150, 200); g.stroke();
    });
  } else {
    // NIGHT GRID: city blocks, lit windows, neon avenues.
    g.fillStyle = '#060913'; g.fillRect(0, 0, W, TILE_H);
    const BL = 80, ROAD = 10;
    for (let by = 0; by < TILE_H; by += BL) for (let bx = 0; bx < W; bx += BL) {
      const x0 = bx + ROAD / 2, y0 = by + ROAD / 2, s = BL - ROAD;
      g.fillStyle = '#0b1122'; g.fillRect(x0, y0, s, s);
      if (R() < 0.12) { // park or plaza
        g.fillStyle = R() < 0.5 ? '#0c1d1c' : '#12122a'; g.fillRect(x0 + 4, y0 + 4, s - 8, s - 8);
        g.strokeStyle = 'rgba(95,225,230,0.25)'; g.lineWidth = 1; g.beginPath(); g.arc(x0 + s / 2, y0 + s / 2, s / 4, 0, TAU); g.stroke();
        continue;
      }
      let yy = y0 + 3;
      while (yy < y0 + s - 8) {
        const hh = rr(10, 26); let xx = x0 + 3;
        while (xx < x0 + s - 8) {
          const ww = rr(10, 28), bw = Math.min(ww, x0 + s - 3 - xx), bh = Math.min(hh, y0 + s - 3 - yy);
          g.fillStyle = rpick(['#111a33', '#0f172d', '#152040', '#0d1428']); g.fillRect(xx, yy, bw - 2, bh - 2);
          g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(xx, yy, bw - 2, 1.5);
          for (let wy = yy + 3; wy < yy + bh - 4; wy += 4) for (let wx = xx + 3; wx < xx + bw - 4; wx += 4) {
            if (R() < 0.22) { g.fillStyle = R() < 0.7 ? 'rgba(255,210,122,' + rr(0.35, 0.9) + ')' : 'rgba(127,232,255,' + rr(0.35, 0.9) + ')'; g.fillRect(wx, wy, 1.6, 1.6); }
          }
          xx += ww;
        }
        yy += hh;
      }
    }
    // road markings
    g.strokeStyle = 'rgba(95,225,230,0.18)'; g.lineWidth = 1; g.setLineDash([4, 6]);
    for (let y = 0; y < TILE_H; y += BL) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    for (let x = 0; x <= W; x += BL) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, TILE_H); g.stroke(); }
    g.setLineDash([]);
    // neon avenues
    g.save(); g.shadowBlur = 8;
    g.strokeStyle = 'rgba(255,63,164,0.75)'; g.shadowColor = '#ff3fa4'; g.lineWidth = 1.5;
    for (const x of [160, 400]) { g.beginPath(); g.moveTo(x - 4, 0); g.lineTo(x - 4, TILE_H); g.moveTo(x + 4, 0); g.lineTo(x + 4, TILE_H); g.stroke(); }
    g.strokeStyle = 'rgba(95,225,230,0.7)'; g.shadowColor = '#5fe1e6';
    for (const y of [240, 560]) { g.beginPath(); g.moveTo(0, y - 4); g.lineTo(W, y - 4); g.moveTo(0, y + 4); g.lineTo(W, y + 4); g.stroke(); }
    g.restore();
    g.globalCompositeOperation = 'lighter';
    for (const x of [160, 400]) for (const y of [240, 560]) {
      const gr = g.createRadialGradient(x, y, 0, x, y, 30); gr.addColorStop(0, 'rgba(255,255,255,0.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(x - 30, y - 30, 60, 60);
    }
    // tail lights along avenues
    for (let i = 0; i < 90; i++) {
      const vert = R() < 0.5;
      const x = vert ? rpick([160, 400]) + rpick([-2, 2]) : rr(0, W), y = vert ? rr(0, TILE_H) : rpick([240, 560]) + rpick([-2, 2]);
      g.fillStyle = R() < 0.5 ? 'rgba(255,90,90,0.8)' : 'rgba(255,245,220,0.8)'; g.fillRect(x - 0.8, y - 0.8, 1.6, 1.6);
    }
    g.globalCompositeOperation = 'source-over';
  }
  return c;
}

function genCloud(seed) {
  const R = mulberry32(seed);
  const w = 180, h = 120, k = 1;
  const c = makeCanvas(w * k, h * k), g = c.getContext('2d');
  for (let i = 0; i < 14; i++) {
    const x = 40 + R() * 100, y = 35 + R() * 50, r = 16 + R() * 26;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  return c;
}

const Ground = {
  tiles: [], region: 0, prev: -1, fade: 1, offset: 0,
  clouds: [], cloudSprites: [], warmT: 0,
  init() {
    this.tiles[0] = genTile(0);
    for (let i = 0; i < 3; i++) this.cloudSprites.push(genCloud(31 + i * 17));
    for (let i = 0; i < 5; i++) this.clouds.push({ x: rand(-60, W + 60), y: rand(-120, H), s: rand(0.8, 1.8), sp: rand(1.6, 2.4), i: i % 3 });
  },
  tile(i) { if (!this.tiles[i]) this.tiles[i] = genTile(i); return this.tiles[i]; },
  // Generate the remaining tiles one at a time while the title is showing.
  warm(dt) {
    this.warmT += dt;
    if (this.warmT < 0.6) return;
    this.warmT = 0;
    for (let i = 0; i < 4; i++) if (!this.tiles[i]) { this.tiles[i] = genTile(i); return; }
  },
  setRegion(i, instant) {
    if (i === this.region) return;
    this.prev = this.region; this.region = i; this.fade = instant ? 1 : 0;
    this.tile(i);
  },
  update(dt) {
    this.offset = (this.offset + GROUND_SPEED * dt) % TILE_H;
    if (this.fade < 1) this.fade = Math.min(1, this.fade + dt / 3.5);
    for (const cl of this.clouds) {
      cl.y += GROUND_SPEED * cl.sp * dt;
      if (cl.y > H + 140) { cl.y = -140 - rand(0, 200); cl.x = rand(-60, W + 60); cl.s = rand(0.8, 1.8); }
    }
  },
  drawTile(i, alpha) {
    const t = this.tile(i), y = Math.floor(this.offset * RES) / RES;
    ctx.globalAlpha = alpha;
    ctx.drawImage(t, 0, y - TILE_H, W, TILE_H + 0.5);
    ctx.drawImage(t, 0, y, W, TILE_H + 0.5);
    ctx.globalAlpha = 1;
  },
  draw() {
    if (this.fade < 1 && this.prev >= 0) this.drawTile(this.prev, 1);
    this.drawTile(this.region, this.fade < 1 ? easeInOut(this.fade) : 1);
    ctx.fillStyle = 'rgba(4,6,14,0.3)';
    ctx.fillRect(0, 0, W, H);
  },
  drawClouds() {
    ctx.globalAlpha = this.region === 3 ? lerp(0.14, 0.06, this.fade) : 0.14;
    for (const cl of this.clouds) {
      const sp = this.cloudSprites[cl.i];
      ctx.drawImage(sp, cl.x - 90 * cl.s, cl.y - 60 * cl.s, 180 * cl.s, 120 * cl.s);
    }
    ctx.globalAlpha = 1;
  },
};

  score: 0, bests: { campaign: 0, endless: 0 }, newBest: false,
  wave: 0, time: 0,
  chain: 0, mult: 1, lastKill: -99,
  bossesMet: 0,
  autoFire: false,
  shake: 0, flash: 0, flashColor: '255,240,210',
  bombT: 0, bombQueued: false,
  gameOverT: 0,
  banner: null, patternFlash: null,
};

const player = { pilot: PILOTS[0], x: W / 2, y: H - 110, vx: 0, vy: 0, bank: 0, t: 0, alive: true };
const shots = [], enemies = [], ebullets = [], pods = [], parts = [], texts = [], arcs = [], warnings = [];
let boss = null;

const wIdx = () => Math.max(0, Game.wave - 1);
const endless = () => Game.mode === 'endless';
const bestScore = () => Game.bests[Game.mode] || 0;
// Endless: +2% enemy health and +1% enemy bullet speed every wave, for ever.
// Campaign: the original curves, which level off around wave 20.
const waveHpMul = () => endless() ? Math.pow(ENDLESS_HP_STEP, wIdx()) : 1 + 0.085 * wIdx();
const waveBulletMul = () => endless() ? Math.pow(ENDLESS_BULLET_STEP, wIdx()) : 1 + Math.min(0.35, wIdx() * 0.02);
const waveFireMul = () => 1 + Math.min(1, wIdx() * 0.055);       // up to twice as often
const waveFormMul = () => 1 + Math.min(0.5, wIdx() * 0.028);     // up to 50% larger
// Endless: from wave 20 your damage, bullet speed and handling grow 2% a wave.
const heroGrow = () => endless() && Game.wave > ENDLESS_HERO_FROM ? Math.pow(ENDLESS_HERO_STEP, Game.wave - ENDLESS_HERO_FROM) : 1;
const maxLevel = () => endless() ? MAX_LEVEL_ENDLESS : MAX_LEVEL;
const wingMax = () => endless() ? WING_MAX_ENDLESS : WING_MAX;
const startBombs = () => BASE_BOMBS + player.pilot.bombs;

function addScore(n) { Game.score += n; }

function floatText(x, y, text, color = C.ink, px = 1.5, life = 0.9) {

}
function banner(title, sub, color = C.ink, dur = 2.6) { Game.banner = { title, sub, color, t: 0, dur }; }

function part(o) { if (parts.length < 900) parts.push(o); }

function explosion(x, y, size = 1, palette = 'fire') {
  const glow = palette === 'plasma' ? SPR.gViolet : palette === 'arc' ? SPR.gBlue : SPR.gOrange;
  part({ k: 'glow', x, y, r: 16 * size, life: 0.38, max: 0.38, spr: glow });
  part({ k: 'glow', x, y, r: 9 * size, life: 0.16, max: 0.16, spr: SPR.gWhite });
  part({ k: 'ring', x, y, r: 3 * size, grow: 90 * size, life: 0.32, max: 0.32, c: '255,210,150', w: 2 });
  const n = Math.min(26, 6 + 5 * size);
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), s = rand(50, 240) * Math.sqrt(size);
    part({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.18, 0.5), max: 0.5, c: pick(['255,225,160', '255,150,60', '255,255,255']), drag: 2.5 });
  }
  for (let i = 0; i < 1 + size * 2; i++) {
    part({ k: 'smoke', x: x + rand(-6, 6) * size, y: y + rand(-6, 6) * size, vx: rand(-15, 15), vy: rand(-10, 25), r: rand(5, 10) * size, grow: 16 * size, life: rand(0.5, 0.9), max: 0.9 });
  }
  for (let i = 0; i < size * 2; i++) {
    const a = rand(TAU), s = rand(40, 160);
    part({ k: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: rand(TAU), vr: rand(-12, 12), r: rand(1.5, 3.5), life: rand(0.4, 0.8), max: 0.8, drag: 1.5 });
  }
  Sound.play('explode', clamp(Math.round(size), 1, 3));
}

function sparks(x, y, n, c = '255,230,180', speed = 120) {
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), s = rand(0.3, 1) * speed;
    part({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.1, 0.3), max: 0.3, c, drag: 3 });
  }
}

function updateParticles(dt) {
  for (const p of parts) {
    p.life -= dt;
    if (p.life <= 0) { p.dead = true; continue; }
    if (p.vx !== undefined) {
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    if (p.grow) p.r += p.grow * dt;
    if (p.vr) p.rot += p.vr * dt;
  }
  compact(parts);
  for (const t of texts) { t.life -= dt; t.y -= 26 * dt; if (t.life <= 0) t.dead = true; }
  compact(texts);
  for (const a of arcs) { a.life -= dt; if (a.life <= 0) a.dead = true; }
  compact(arcs);
  for (const w of warnings) { w.t -= dt; if (w.t <= 0) w.dead = true; }
  compact(warnings);
}

function drawParticles(additive) {
  if (additive) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const a = p.life / p.max;
      if (p.k === 'glow') { ctx.globalAlpha = a; ctx.drawImage(p.spr.c, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); }
      else if (p.k === 'spark') {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(' + p.c + ',' + a.toFixed(3) + ')'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
      } else if (p.k === 'ring') {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(' + p.c + ',' + (a * 0.8).toFixed(3) + ')'; ctx.lineWidth = p.w * a + 0.5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  } else {
    for (const p of parts) {
      const a = p.life / p.max;
      if (p.k === 'smoke') {
        ctx.fillStyle = 'rgba(38,36,40,' + (a * 0.45).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
      } else if (p.k === 'debris') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(30,28,30,' + a.toFixed(3) + ')'; ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
        ctx.restore();
      } else if (p.k === 'trail') {
        ctx.fillStyle = 'rgba(200,210,220,' + (a * 0.35).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - a), 0, TAU); ctx.fill();
      }
    }
  }
}

// ---- Player ------------------------------------------------------------------------------
function resetPlayer() {
  const pl = PILOTS[Game.pilotIdx], d = diff();
  Object.assign(player, {
    pilot: pl, x: W / 2, y: H + 40, vx: 0, vy: 0, bank: 0, t: 0,
    weapon: 0, level: 1,
    wingLevel: 0, wingType: 0, wings: [], wingCounts: [0, 0, 0],
    ships: Math.max(1, d.ships + pl.ships), bombs: BASE_BOMBS + pl.bombs,
    alive: true, invuln: 2.5, respawnT: 0, enterT: 0.9,
    fireT: 0, fireT2: 0, slow: false, coreGlow: 0,
  });
}

function respawn() {
  const p = player;
  p.alive = true; p.x = W / 2; p.y = H + 40; p.vx = p.vy = 0; p.bank = 0;
  p.enterT = 0.9; p.invuln = RESPAWN_INVULN;
  p.bombs = Math.max(p.bombs, startBombs());
  Pointer.dx = Pointer.dy = 0;
  Sound.play('respawn');
  Music.play(boss ? 'boss' : 'combat');
}

function killPlayer() {
  const p = player;
  if (!p.alive) return;
  p.alive = false;
  explosion(p.x, p.y, 3);
  part({ k: 'ring', x: p.x, y: p.y, r: 6, grow: 420, life: 0.6, max: 0.6, c: '255,255,255', w: 4 });
  Sound.play('death');
  Music.play('death');
  Game.shake = Math.max(Game.shake, 0.7);
  Game.flash = 0.35; Game.flashColor = '255,120,90';
  Game.chain = 0; Game.mult = 1; Game.lastKill = -99;
  const lost = Math.min(2, p.level - 1);
  p.level -= lost;
  if (p.wingLevel > 0) p.wingLevel--;
  p.wings.length = 0;
  if (lost > 0) dropPod(p.x, Math.min(p.y - 10, H - 40), 'P');
  p.ships--;
  if (p.ships <= 0) { p.ships = 0; Game.gameOverT = 2.8; }
  else p.respawnT = 1.5;
}

function updatePlayer(dt) {
  const p = player, pl = p.pilot;
  p.t += dt;
  if (!p.alive) {
    if (p.respawnT > 0) { p.respawnT -= dt; if (p.respawnT <= 0) respawn(); }
    return;
  }
  if (p.invuln > 0) p.invuln -= dt;
  const px0 = p.x;
  if (p.enterT > 0) {
    p.enterT -= dt;
    const k = 1 - Math.max(0, p.enterT) / 0.9;
    p.y = lerp(H + 40, H - 110, easeOut(k));
    Pointer.dx = Pointer.dy = 0;
  } else {
    let ix = 0, iy = 0;
    if (Input.held('left')) ix -= 1;
    if (Input.held('right')) ix += 1;
    if (Input.held('up')) iy -= 1;
    if (Input.held('down')) iy += 1;
    if (ix && iy) { ix *= Math.SQRT1_2; iy *= Math.SQRT1_2; }
    p.slow = Input.held('slow');
    const spd = pl.speed * heroGrow() * (p.slow ? 0.5 : 1);
    let tvx = ix * spd, tvy = iy * spd;
    let dragX = 0, dragY = 0;
    if (Pointer.dx || Pointer.dy) {
      const m = Math.hypot(Pointer.dx, Pointer.dy);
      if (m > 160) { Pointer.dx *= 160 / m; Pointer.dy *= 160 / m; }
      const cap = pl.speed * 2.4 * dt;
      let mx = Pointer.dx, my = Pointer.dy;
      const mm = Math.hypot(mx, my);
      if (mm > cap) { mx *= cap / mm; my *= cap / mm; }
      Pointer.dx -= mx; Pointer.dy -= my;
      if (pl.handling) { tvx += mx / dt; tvy += my / dt; } else { dragX = mx; dragY = my; }
    }
    if (pl.handling) {
      const k = 1 - Math.exp(-pl.handling * dt);
      p.vx += (tvx - p.vx) * k; p.vy += (tvy - p.vy) * k;
    } else { p.vx = tvx; p.vy = tvy; }
    p.x += p.vx * dt + dragX; p.y += p.vy * dt + dragY;
    if (p.x < 14) { p.x = 14; p.vx = Math.max(0, p.vx); }
    if (p.x > W - 14) { p.x = W - 14; p.vx = Math.min(0, p.vx); }
    if (p.y < 26) { p.y = 26; p.vy = Math.max(0, p.vy); }
    if (p.y > H - 24) { p.y = H - 24; p.vy = Math.min(0, p.vy); }
  }
  const bankT = clamp((p.x - px0) / dt / pl.speed, -1, 1);
  p.bank += (bankT - p.bank) * Math.min(1, dt * 9);

  const firing = Input.held('fire') || Game.autoFire || Pointer.dragging;
  p.fireT -= dt; p.fireT2 -= dt;
  if (firing) fireWeapon(p);
  else { p.fireT = Math.max(p.fireT, 0); p.fireT2 = Math.max(p.fireT2, 0); }
}
