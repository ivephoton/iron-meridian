const BPATH = {
  wardenHull: P2('M0,46 L30,32 L42,-6 L28,-40 L-28,-40 L-42,-6 L-30,32 Z'),
  wardenArm: P2('M28,-12 L92,-6 L94,20 L30,22 Z M-28,-12 L-92,-6 L-94,20 L-30,22 Z'),
  seraphBody: P2('M0,40 L16,8 L12,-26 L0,-38 L-12,-26 L-16,8 Z'),
  levBody: P2('M0,58 C34,56 58,36 64,10 C70,-18 56,-46 30,-58 L-30,-58 C-56,-46 -70,-18 -64,10 C-58,36 -34,56 0,58 Z'),
  levJaw: P2('M-22,40 L0,66 L22,40 L12,44 L0,56 L-12,44 Z'),
};

function drawBoss() {
  const b = boss;
  if (!b) return;
  const fl = b.flash > 0;
  const col = c => fl ? '#fff4ee' : c;
  const t = b.t;
  ctx.save();
  if (b.phase === 'dying') ctx.translate(rand(-2, 2), rand(-2, 2));
  const x = b.x, y = b.y;
  switch (b.def.id) {
    case 'warden': {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.save(); ctx.translate(x + 18, y + 30); ctx.scale(0.8, 0.8); ctx.fill(BPATH.wardenHull); ctx.fill(BPATH.wardenArm); ctx.restore();
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = col('#4b535e'); ctx.fill(BPATH.wardenArm);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.2; ctx.stroke(BPATH.wardenArm);
      for (const s of [-1, 1]) {
        // wing battery pods
        const gr = ctx.createRadialGradient(s * 62, 2, 3, s * 66, 8, 26);
        gr.addColorStop(0, col('#8e98a4')); gr.addColorStop(1, col('#3e454f'));
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s * 66, 8, 23, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#e8b64c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(s * 66, 8, 17, 0, TAU); ctx.stroke();
        ctx.fillStyle = '#23282f';
        for (const o of [-8, 0, 8]) ctx.fillRect(s * 66 + o - 2, 22, 4, 12);
        ctx.fillStyle = '#ff9a3c'; ctx.beginPath(); ctx.arc(s * 66, 8, 4 + Math.sin(t * 6 + s) * 1, 0, TAU); ctx.fill();
        ctx.fillStyle = '#2a3038'; ctx.fillRect(s * 90 - 3, -2, 6, 26);
      }
      const hg = ctx.createLinearGradient(-40, 0, 40, 0);
      hg.addColorStop(0, col('#7c8591')); hg.addColorStop(0.5, col('#5c6570')); hg.addColorStop(1, col('#3b424c'));
      ctx.fillStyle = hg; ctx.fill(BPATH.wardenHull);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.5; ctx.stroke(BPATH.wardenHull);
      ctx.strokeStyle = 'rgba(232,182,76,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-26, -34); ctx.lineTo(26, -34); ctx.moveTo(-22, 30); ctx.lineTo(0, 40); ctx.lineTo(22, 30); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      for (const [rx, ry] of [[-30, -20], [30, -20], [-34, 8], [34, 8], [-18, 26], [18, 26]]) { ctx.beginPath(); ctx.arc(rx, ry, 2, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#1e2229'; ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
      blit(SPR.gRed, x, y, 0.75 + Math.sin(t * 5) * 0.1);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd6d9'; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
      break;
    }
    case 'hydra': {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(x + 18, y + 26, 44, 36, 0, 0, TAU); ctx.fill();
      // necks
      for (let i = 0; i < 3; i++) {
        const h = b.heads[i];
        const sx = x + (i - 1) * 22, sy = y + 10;
        ctx.strokeStyle = col('#2b4d49'); ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(lerp(sx, h.x, 0.5) + Math.sin(t * 2 + i) * 10, lerp(sy, h.y, 0.3), h.x, h.y); ctx.stroke();
        ctx.strokeStyle = 'rgba(140,220,180,0.25)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(lerp(sx, h.x, 0.5) + Math.sin(t * 2 + i) * 10, lerp(sy, h.y, 0.3), h.x, h.y); ctx.stroke();
      }
      // body
      const gr = ctx.createRadialGradient(x - 12, y - 22, 4, x, y - 8, 46);
      gr.addColorStop(0, col('#5f9c8a')); gr.addColorStop(1, col('#1f3b38'));
      ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y - 8, 44, 38, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.strokeStyle = 'rgba(180,255,120,0.18)'; ctx.lineWidth = 1;
      for (let row = 0; row < 4; row++) for (let c = -3; c <= 3; c++) {
        const sx = x + c * 11 + (row % 2) * 5, sy = y - 32 + row * 13;
        ctx.beginPath(); ctx.arc(sx, sy, 5, 0.2, Math.PI - 0.2); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'lighter';
      blit(SPR.gGreen, x, y - 10, 0.5 + Math.sin(t * 3) * 0.08);
      ctx.globalCompositeOperation = 'source-over';
      // heads
      for (let i = 0; i < 3; i++) {
        const h = b.heads[i], open = h.open > 0 ? 1 : 0;
        const a = Math.atan2(player.y - h.y, player.x - h.x) - Math.PI / 2;
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(clamp(a, -0.9, 0.9));
        ctx.fillStyle = col('#3f7a6f');
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(14, -2); ctx.lineTo(9, 12 + open * 3); ctx.lineTo(3, 18); ctx.lineTo(-3, 18); ctx.lineTo(-9, 12 + open * 3); ctx.lineTo(-14, -2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.2; ctx.stroke();
        if (open) { ctx.fillStyle = '#1a0f12'; ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(5, 10); ctx.lineTo(0, 20); ctx.fill(); }
        ctx.fillStyle = '#b6ff5e';
        ctx.beginPath(); ctx.arc(-6, 0, 2.6, 0, TAU); ctx.arc(6, 0, 2.6, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(232,182,76,0.8)'; ctx.fillRect(-1, -12, 2, 8);
        ctx.restore();
      }
      break;
    }
    case 'seraph': {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(x + 18, y + 28, 70, 26, 0, 0, TAU); ctx.fill();
      // halo
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(232,182,76,' + (0.55 + Math.sin(t * 3) * 0.15) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, y - 40, 24, 8, 0, 0, TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      // wings: layered feathers fanning outward
      for (const s of [-1, 1]) {
        for (let i = 0; i < 6; i++) {
          const a = (-40 + i * 16) * DEG + Math.sin(t * 1.6 + i * 0.3) * 0.05;
          const len = 64 - i * 5;
          ctx.save(); ctx.translate(x + s * 14, y - 8); ctx.scale(s, 1); ctx.rotate(a);
          const fg = ctx.createLinearGradient(0, 0, len, 0);
          fg.addColorStop(0, col('#e9e0c8')); fg.addColorStop(1, col(i % 2 ? '#9fb4d8' : '#c9d6ea'));
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.ellipse(len / 2, 0, len / 2, 6 - i * 0.4, 0, 0, TAU); ctx.fill();
          ctx.strokeStyle = 'rgba(60,70,100,0.35)'; ctx.lineWidth = 0.8; ctx.stroke();
          ctx.restore();
        }
      }
      ctx.save(); ctx.translate(x, y);
      const bg = ctx.createLinearGradient(-16, 0, 16, 0);
      bg.addColorStop(0, col('#f6efdd')); bg.addColorStop(1, col('#b8ac8e'));
      ctx.fillStyle = bg; ctx.fill(BPATH.seraphBody);
      ctx.strokeStyle = '#e8b64c'; ctx.lineWidth = 1.6; ctx.stroke(BPATH.seraphBody);
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
      blit(SPR.gCyan, x, y + 2, 0.55 + Math.sin(t * 4) * 0.08);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#5fe1e6'; ctx.beginPath(); ctx.ellipse(x, y + 2, 5, 8, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x, y + 2, 2, 4, 0, 0, TAU); ctx.fill();
      break;
    }
    case 'leviathan': {
      // tail trailing off the top of the screen
      for (let i = 5; i >= 1; i--) {
        const tx = x + Math.sin(t * 1.4 - i * 0.7) * (8 + i * 4), ty = y - 50 - i * 26, r = 30 - i * 3.5;
        ctx.fillStyle = col(i % 2 ? '#2c3643' : '#34404f'); ctx.beginPath(); ctx.arc(tx, ty, r, 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,106,61,0.5)'; ctx.beginPath(); ctx.arc(tx, ty, 2.5, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.save(); ctx.translate(x + 20, y + 30); ctx.scale(0.85, 0.85); ctx.fill(BPATH.levBody); ctx.restore();
      ctx.save(); ctx.translate(x, y);
      const lg = ctx.createRadialGradient(-20, -20, 6, 0, 0, 70);
      lg.addColorStop(0, col('#5a6a7c')); lg.addColorStop(1, col('#222a34'));
      ctx.fillStyle = lg; ctx.fill(BPATH.levBody);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2; ctx.stroke(BPATH.levBody);
      // dorsal plates
      ctx.fillStyle = col('#465466');
      for (let i = 0; i < 5; i++) { const py = -44 + i * 17; ctx.beginPath(); ctx.moveTo(-12 + i, py); ctx.lineTo(0, py - 9); ctx.lineTo(12 - i, py); ctx.lineTo(0, py + 6); ctx.fill(); }
      // shoulders
      for (const s of [-1, 1]) {
        const sg = ctx.createRadialGradient(s * 70, -16, 4, s * 76, -8, 30);
        sg.addColorStop(0, col('#7a8a9c')); sg.addColorStop(1, col('#2e3844'));
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(s * 76, -8, 28, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
        for (let v = -2; v <= 2; v++) { ctx.beginPath(); ctx.moveTo(s * 76 + v * 6, -26); ctx.lineTo(s * 76 + v * 6, -18); ctx.stroke(); }
      }
      ctx.fillStyle = col('#1b2129'); ctx.fill(BPATH.levJaw);
      ctx.restore();
      ctx.globalCompositeOperation = 'lighter';
      for (const s of [-1, 1]) blit(SPR.gOrange, x + s * 76, y - 4, 0.45 + Math.sin(t * 5 + s) * 0.08);
      blit(SPR.gOrange, x, y + 30, 0.6);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ff6a3d';
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * 76, y - 4, 6, 0, TAU); ctx.fill(); }
      ctx.beginPath(); ctx.arc(x, y + 30, 8, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffe2c8'; ctx.beginPath(); ctx.arc(x, y + 30, 3.5, 0, TAU); ctx.fill();
      break;
    }
  }
  ctx.restore();
}


// ---- Waves ---------------------------------------------------------------------------------------
const GROUPS = [
  { id: 'dartV', from: 1, w: 3 },
  { id: 'dartSwoop', from: 1, w: 3 },
  { id: 'dartSweep', from: 1, w: 2.2 },
  { id: 'drones', from: 1, w: 2 },
  { id: 'tanks', from: 2, w: 2.4 },
  { id: 'column', from: 2, w: 1.6 },
  { id: 'spinner', from: 3, w: 1.5 },
  { id: 'gunship', from: 3, w: 1.1 },
  { id: 'kamikaze', from: 4, w: 2 },
  { id: 'frigate', from: 8, w: 0.8 },
];
const GROUP_EXTRA_TIME = { spinner: 1.5, gunship: 3, frigate: 6, drones: 1 };

const Director = {
  events: [], t: 0, bossWave: false, clearT: 0, nextT: 0,
  afterBoss() {
    Ground.setRegion(Math.floor(Game.wave / 5) % REGIONS.length);
    this.nextT = 4.5;
    Music.play('combat');
  },
};

function fsize(base) { return Math.max(2, Math.round(base * diff().formation * waveFormMul())); }
function dartShots() {
  if (Game.wave === 1 && Director.t < 8) return 0;
  return chance(Math.min(0.8, 0.25 + 0.045 * Game.wave)) ? 1 : 0;
}

function pickGroup(n, i, forced) {
  if (forced.length && (i === 1 || i === 3 || i === 5)) return forced.shift();
  const pool = GROUPS.filter(g => g.from <= n);
  let total = 0; for (const g of pool) total += g.w;
  let r = Math.random() * total;
  for (const g of pool) { r -= g.w; if (r <= 0) return g.id; }
  return pool[0].id;
}

function buildWave(n) {
  const ev = [];
  const forced = GROUPS.filter(g => g.from === n && n > 1).map(g => g.id);
  const groups = Math.min(17, 7 + Math.floor(n * 0.6));
  const gapBase = Math.max(1.7, 3.5 - n * 0.09);
  const carrierAt = randi(1, Math.max(1, groups - 3));
  const extraCarrier = n >= 6 && chance(0.4) ? randi(2, groups - 1) : -1;
  let t = 2.4;
  for (let i = 0; i < groups; i++) {
    const g = i === 0 && n === 1 ? 'dartV' : pickGroup(n, i, forced);
    ev.push({ t, id: g });
    if (i === carrierAt || i === extraCarrier) ev.push({ t: t + 1.1, id: 'carrier' });
    if (n >= 5 && i > 0 && chance(Math.min(0.45, (n - 4) * 0.05))) ev.push({ t: t + rand(0.6, 1.3), id: pickGroup(n, i, []) });
    t += gapBase * rand(0.85, 1.2) + (GROUP_EXTRA_TIME[g] || 0);
  }
  ev.sort((a, b) => a.t - b.t);
  return ev;
}

function spawnGroup(id) {
  const n = Game.wave;
  switch (id) {
    case 'dartV': {
      const cnt = fsize(5), f = newFormation(cnt), x0 = rand(100, W - 100), shots = dartShots();
      for (let i = 0; i < cnt; i++) {
        const k = i === 0 ? 0 : Math.ceil(i / 2) * (i % 2 ? 1 : -1);
        spawnEnemy('dart', clamp(x0 + k * 30, 20, W - 20), -20 - Math.abs(k) * 26, {
          mode: 'v', speed: 150, turnY: rand(250, 360), side: k < 0 ? -1 : k > 0 ? 1 : (chance(0.5) ? 1 : -1), formation: f, shots: i < 2 ? shots : dartShots(),
        });
      }
      break;
    }
    case 'dartSwoop': {
      const cnt = fsize(6), f = newFormation(cnt), left = chance(0.5), dy = rand(-40, 40);
      const base = [[-30, 110 + dy], [W * 0.92, 30 + dy], [W * 0.98, 590 + dy], [-40, 430 + dy]];
      const path = left ? base : base.map(([px, py]) => [W - px, py]);
      for (let i = 0; i < cnt; i++) spawnEnemy('dart', path[0][0], path[0][1], { mode: 'swoop', path, dur: 4.6, t: -i * 0.2, formation: f, shots: dartShots() });
      break;
    }
    case 'dartSweep': {
      const cnt = fsize(6), f = newFormation(cnt), left = chance(0.5), y0 = rand(80, 230);
      for (let i = 0; i < cnt; i++) spawnEnemy('dart', left ? -20 : W + 20, y0, { mode: 'sweep', vx: (left ? 1 : -1) * 175, y0, ph: i * 0.5, t: -i * 0.19, formation: f, shots: dartShots() });
      break;
    }
    case 'column': {
      const cnt = fsize(5), f = newFormation(cnt), x = clamp(player.x, 30, W - 30);
      warnings.push({ x, t: 0.75 });
      for (let i = 0; i < cnt; i++) spawnEnemy('dart', x, -20, { mode: 'column', speed: 340, t: -0.7 - i * 0.13, formation: f, shots: 0, fast: true });
      break;
    }
    case 'drones': {
      const cnt = n >= 6 ? 3 : 2;
      for (let i = 0; i < cnt; i++) {
        const x = (i + 1) * W / (cnt + 1) + rand(-24, 24);
        spawnEnemy('drone', x, -20, { ty: rand(90, 230), hx: x, ph: rand(TAU), side: x < W / 2 ? -1 : 1, t: -i * 0.35 });
      }
      break;
    }
    case 'carrier': {
      const left = chance(0.5);
      spawnEnemy('carrier', left ? -30 : W + 30, rand(90, 210), { vx: (left ? 1 : -1) * 58, vy: 5 });
      break;
    }
    case 'tanks': {
      const cnt = randi(2, 3) + (n >= 7 ? 1 : 0);
      for (let i = 0; i < cnt; i++) {
        const vx = rand(-12, 12), vy = rand(8, 26);
        spawnEnemy('tank', rand(40, W - 40), -24 - i * 46, { vx, vy, hullA: Math.atan2(vy, vx), tur: Math.PI / 2, tread: 0, fireT: rand(1, 2.2) });
      }
      break;
    }
    case 'spinner': {
      const cnt = n >= 9 && chance(0.4) ? 2 : 1;
      for (let i = 0; i < cnt; i++) {
        const x = cnt === 1 ? rand(120, W - 120) : (i ? W * 0.72 : W * 0.28);
        spawnEnemy('spinner', x, -24, { ty: rand(120, 220), spin: 0, sa: rand(TAU), dir: chance(0.5) ? 1 : -1 });
      }
      break;
    }
    case 'gunship':
      spawnEnemy('gunship', rand(120, W - 120), -40, { ty: rand(130, 190) });
      break;
    case 'kamikaze': {
      const cnt = fsize(4), f = cnt >= 4 ? newFormation(cnt) : null;
      for (let i = 0; i < cnt; i++) spawnEnemy('kamikaze', rand(30, W - 30), -20, { speed: 110, ang: Math.PI / 2, t: -i * 0.35, formation: f });
      break;
    }
    case 'frigate':
      spawnEnemy('frigate', rand(150, W - 150), -60, { ty: rand(140, 180) });
      break;
  }
}

function startWave(n) {
  Game.wave = n;
  const D = Director;
  D.t = 0; D.clearT = 0; D.nextT = 0;
  const region = Math.floor((n - 1) / 5) % REGIONS.length;
  if (Ground.region !== region && Ground.fade >= 1) Ground.setRegion(region, true);
  if (n % 5 === 0) {
    D.bossWave = true;
    const def = BOSSES[(n / 5 - 1) % BOSSES.length];
    D.events = [
      { t: 0.6, fn: () => { banner('WARNING', def.name + ' INBOUND', C.alarm, 2.8); Sound.play('warning'); } },
      { t: 3.6, fn: spawnBoss },
      { t: 18, id: 'carrier' },   // every wave sends at least one pod carrier, boss waves included
    ];
  } else {
    D.bossWave = false;
    D.events = buildWave(n);
    banner('WAVE ' + n, REGIONS[region], C.ink, 2.4);
    Music.play('combat');
  }
}

function updateDirector(dt) {
  const D = Director;
  D.t += dt;
  while (D.events.length && D.events[0].t <= D.t) {
    const ev = D.events.shift();
    if (ev.fn) ev.fn(); else spawnGroup(ev.id);
  }
  if (D.nextT > 0) {
    D.nextT -= dt;
    if (D.nextT <= 0) startWave(Game.wave + 1);
    return;
  }
  if (D.bossWave) return;
  if (!D.events.length) {
    if (enemies.length === 0) {
      D.clearT += dt;
      if (D.clearT > 1.4) startWave(Game.wave + 1);
    } else {
      D.clearT = 0;
      // Nudge stragglers along so a wave can never stall.
      if (D.t > 90) for (const e of enemies) if (!e.dead) escapeEnemy(e);
    }
  }
}

// ---- Runs --------------------------------------------------------------------------------------
function clearWorld() {
  shots.length = enemies.length = ebullets.length = pods.length = parts.length = texts.length = arcs.length = warnings.length = 0;
  boss = null;
}

function newRun() {
  clearWorld();
  Object.assign(Game, {
    score: 0, newBest: false, chain: 0, mult: 1, lastKill: -99, bossesMet: 0, time: 0,
    bombT: 0, gameOverT: 0, shake: 0, flash: 0, banner: null, patternFlash: null, paused: false,
  });
  resetPlayer();
  Ground.setRegion(0, true);
  Pointer.dx = Pointer.dy = 0;
  Game.state = 'play';
  startWave(1);
}

function endRun() {
  if (Game.score > bestScore()) { Game.bests[Game.mode] = Game.score; Game.newBest = Game.score > 0; }
  Game.paused = false;
  Game.state = 'gameover';
  UI.sel = 0;
}

function updatePlay(dt) {
  Game.time += dt;
  Ground.update(dt);
  updateDirector(dt);
  updatePlayer(dt);
  updateWings(dt);
  updateShots(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateEnemyBullets(dt);
  updateBomb(dt);
  checkPlayerHits();
  updatePods(dt);
  updateParticles(dt);
  if (Game.chain > 0 && Game.time - Game.lastKill > CHAIN_WINDOW) { Game.chain = 0; Game.mult = 1; }
  if (Game.shake > 0) Game.shake = Math.max(0, Game.shake - dt * 1.8);
  if (Game.flash > 0) Game.flash = Math.max(0, Game.flash - dt * 2.2);
  if (Game.banner) { Game.banner.t += dt; if (Game.banner.t > Game.banner.dur) Game.banner = null; }
  if (Game.patternFlash) { Game.patternFlash.t += dt; if (Game.patternFlash.t > 2.4) Game.patternFlash = null; }
  if (Game.gameOverT > 0) {
    Game.gameOverT -= dt;
    if (Game.gameOverT <= 0) endRun();
  }
}

function drawPlayWorld() {
  const sh = Game.shake;
  ctx.save();
  if (sh > 0) ctx.translate(rand(-1, 1) * sh * 7, rand(-1, 1) * sh * 7);
  Ground.draw();
  drawEnemies(true);
  drawParticles(false);
  Ground.drawClouds();
  drawEnemies(false);
  drawBoss();
  drawShots();
  drawWings();
  drawPlayer();
  drawPods();
  drawParticles(true);
  drawEnemyBullets();
  for (const w of warnings) {
    const a = Math.floor(w.t * 10) % 2 ? 0.9 : 0.35;
    ctx.strokeStyle = 'rgba(255,77,94,' + (a * 0.5) + ')'; ctx.lineWidth = 1; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(w.x, 30); ctx.lineTo(w.x, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = a;
    drawText('↓', w.x + 0.5, 34, 2.4, C.alarm, 'center', 3);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (Game.flash > 0) {
    ctx.fillStyle = 'rgba(' + Game.flashColor + ',' + (Game.flash * 0.55).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function drawPlayer() {
  const p = player;
  if (!p.alive) return;
  const blink = p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0;
  drawShadow(SHIP_PATHS[p.pilot.id].hull, p.x, p.y, 0, 0.7, 0.3);
  drawPlayerShip(p.pilot, p.x, p.y, p.bank, p.t, 1, blink ? 0.35 : 1);
  if (p.invuln > 0 && p.enterT <= 0) {
    ctx.strokeStyle = 'rgba(95,225,230,' + (0.25 + Math.sin(p.t * 20) * 0.1) + ')'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, TAU); ctx.stroke();
  }
  // the core, the only part that takes hits
  const cr = p.pilot.core;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.9;
  ctx.drawImage(SPR.gWhite.c, p.x - cr * 3.2, p.y - cr * 3.2, cr * 6.4, cr * 6.4);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x, p.y, cr * 0.8, 0, TAU); ctx.fill();
  if (p.slow) {
    ctx.strokeStyle = 'rgba(95,225,230,0.95)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(p.x, p.y, cr + 5, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(95,225,230,0.5)';
    ctx.beginPath(); ctx.arc(p.x, p.y, cr + 10, 0, TAU); ctx.stroke();
    ctx.beginPath();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(p.x + dx * (cr + 12), p.y + dy * (cr + 12)); ctx.lineTo(p.x + dx * (cr + 18), p.y + dy * (cr + 18)); }
    ctx.stroke();
  }
}


// ---- Interface ------------------------------------------------------------------------------------
const UI = {
  sel: 0, t: 0,
  buttons: [], prevButtons: [],
  page: 0, mSel: 0, manualFrom: 'pause',
  wrapCache: new Map(),
  button(x, y, w, h, fn) { this.buttons.push({ x, y, w, h, fn }); },
};

function wrapCached(text, width, font) {
  const key = text + '|' + width + '|' + font;
  let v = UI.wrapCache.get(key);
  if (!v) { v = wrapLines(text, width, font); UI.wrapCache.set(key, v); }
  return v;
}
function serif(text, x, y, size, color, opts = {}) {
  const font = (opts.italic ? 'italic ' : '') + (opts.bold ? '700 ' : '') + size + 'px ' + SERIF;
  const lines = opts.width ? wrapCached(text, opts.width, font) : [text];
  ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'top';
  ctx.textAlign = opts.align || 'left';
  const lh = opts.lh || Math.round(size * 1.32);
  lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lh));
  ctx.textAlign = 'left';
  return lines.length * lh;
}

function processTaps() {
  const taps = Pointer.taps.splice(0);
  for (const tap of taps) {
    for (let i = UI.prevButtons.length - 1; i >= 0; i--) {
      const b = UI.prevButtons[i];
      if (tap.x >= b.x && tap.x <= b.x + b.w && tap.y >= b.y && tap.y <= b.y + b.h) { b.fn(); break; }
    }
  }
}

const BOMB_BTN = { x: 48, y: H - 60, r: 32 };   // bottom left

function hudButtonAt(x, y) {
  if (dist2(x, y, W - 26, 28) < 30 * 30) { openManual('pause'); return true; }
  if (dist2(x, y, BOMB_BTN.x, BOMB_BTN.y) < (BOMB_BTN.r + 8) * (BOMB_BTN.r + 8)) { useBomb(); return true; }
  return false;
}

function openManual(from) {
  UI.manualFrom = from;
  UI.mSel = 0;
  if (from === 'pause') { if (Game.paused || Game.state !== 'play') return; Game.paused = true; }
  else Game.state = 'manual';
  Pointer.dragId = null; Pointer.dx = Pointer.dy = 0;
  Sound.play('page');
}
function closeManual() {
  if (UI.manualFrom === 'pause') { Game.paused = false; Pointer.dx = Pointer.dy = 0; }
  else { Game.state = 'title'; UI.sel = 1; }
  Sound.play('menuBack');
}
function toggleAuto() {
  Game.autoFire = !Game.autoFire;
  if (Game.state === 'play' && !Game.paused) floatText(player.x, player.y - 40, Game.autoFire ? 'AUTO-FIRE ON' : 'AUTO-FIRE OFF', C.signal, 1.4);
  Sound.play('menuMove');
}
function toggleMute() { Sound.setMuted(!Sound.muted); if (!Sound.muted) Sound.play('menuSelect'); }
function toggleMusic() { Sound.setMusicMuted(!Sound.musicMuted); Sound.play('menuMove'); }

// ---- Menu input --------------------------------------------------------------------------------------
function menuMove(delta, count) {
  UI.sel = (UI.sel + delta + count) % count;
  Sound.play('menuMove');
}

const TITLE_ITEMS = () => ['CAMPAIGN', 'ENDLESS', 'FLIGHT MANUAL', Sound.muted ? 'SOUND: OFF' : 'SOUND: ON'];
const MODE_NAME = { campaign: 'CAMPAIGN', endless: 'ENDLESS' };
function titleChoose(i) {
  UI.sel = i;
  if (i === 0 || i === 1) {
    Game.mode = i === 0 ? 'campaign' : 'endless';
    Game.state = 'difficulty'; UI.sel = Game.diff; Sound.play('menuSelect');
  } else if (i === 2) openManual('title');
  else toggleMute();
}
function diffChoose(i) { Game.diff = i; Game.state = 'pilot'; UI.sel = Game.pilotIdx; Sound.play('menuSelect'); }
function pilotChoose(i) { Game.pilotIdx = i; Sound.play('menuSelect'); newRun(); }
const OVER_ITEMS = ['FLY AGAIN', 'CHANGE PILOT', 'TITLE'];
function overChoose(i) {
  Sound.play('menuSelect');
  if (i === 0) newRun();
  else if (i === 1) { Game.state = 'pilot'; UI.sel = Game.pilotIdx; Music.play('menu'); }
  else { Game.state = 'title'; UI.sel = 0; Music.play('menu'); }
}

function manualItems() {
  const items = [];
  if (UI.manualFrom === 'pause') items.push({ id: 'resume', label: 'RESUME' });
  else items.push({ id: 'back', label: 'BACK' });
  items.push({ id: 'auto', label: 'AUTO-FIRE: ' + (Game.autoFire ? 'ON' : 'OFF') });
  items.push({ id: 'sound', label: 'SOUND: ' + (Sound.muted ? 'OFF' : 'ON') });
  items.push({ id: 'music', label: 'MUSIC: ' + (Sound.musicMuted ? 'OFF' : 'ON') });
  if (UI.manualFrom === 'pause') items.push({ id: 'abandon', label: 'ABANDON' });
  return items;
}
function manualActivate(id) {
  if (id === 'resume' || id === 'back') closeManual();
  else if (id === 'auto') toggleAuto();
  else if (id === 'sound') toggleMute();
  else if (id === 'music') toggleMusic();
  else if (id === 'abandon') { Sound.play('menuBack'); endRun(); Music.play('menu'); }
}
function turnPage(d) { UI.page = (UI.page + d + MANUAL_PAGES.length) % MANUAL_PAGES.length; Sound.play('page'); }

function handleMenuInput() {
  // Global toggles
  if (Input.hit('mute')) toggleMute();
  if (Input.hit('music')) toggleMusic();
  if (Input.hit('auto')) toggleAuto();

  const manualOpen = Game.state === 'manual' || (Game.state === 'play' && Game.paused);
  if (manualOpen) {
    const items = manualItems();
    if (Input.hit('left')) turnPage(-1);
    if (Input.hit('right')) turnPage(1);
    if (Input.hit('up')) { UI.mSel = (UI.mSel - 1 + items.length) % items.length; Sound.play('menuMove'); }
    if (Input.hit('down')) { UI.mSel = (UI.mSel + 1) % items.length; Sound.play('menuMove'); }
    if (UI.manualFrom === 'pause' && Input.hit('abandon')) { manualActivate('abandon'); return; }
    if (Input.hit('pause') || Input.hit('back')) { closeManual(); return; }
    if (Input.hit('confirm')) manualActivate(items[Math.min(UI.mSel, items.length - 1)].id);
    return;
  }
  switch (Game.state) {
    case 'title': {
      const n = TITLE_ITEMS().length;
      if (Input.hit('up')) menuMove(-1, n);
      if (Input.hit('down')) menuMove(1, n);
      if (Input.hit('confirm')) titleChoose(UI.sel);
      break;
    }
    case 'difficulty':
      if (Input.hit('up')) menuMove(-1, DIFFS.length);
      if (Input.hit('down')) menuMove(1, DIFFS.length);
      if (Input.hit('confirm')) diffChoose(UI.sel);
      else if (Input.hit('back')) { Game.state = 'title'; UI.sel = 0; Sound.play('menuBack'); }
      break;
    case 'pilot':
      if (Input.hit('left') || Input.hit('up')) menuMove(-1, PILOTS.length);
      if (Input.hit('right') || Input.hit('down')) menuMove(1, PILOTS.length);
      if (Input.hit('confirm')) pilotChoose(UI.sel);
      else if (Input.hit('back')) { Game.state = 'difficulty'; UI.sel = Game.diff; Sound.play('menuBack'); }
      break;
    case 'gameover':
      if (Input.hit('up')) menuMove(-1, OVER_ITEMS.length);
      if (Input.hit('down')) menuMove(1, OVER_ITEMS.length);
      if (Input.hit('confirm')) overChoose(UI.sel);
      break;
    case 'play':
      if (Input.hit('pause')) { openManual('pause'); break; }
      if (Input.hit('bomb')) useBomb();
      break;
  }
}

// ---- Shared drawing ------------------------------------------------------------------------------------
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function menuItem(label, x, y, selected, fn, px = 2.4) {
  const w = textWidth(label, px) + 60, h = 7 * px + 16;
  UI.button(x - w / 2, y - 8, w, h, fn);
  if (selected) {
    const pulse = 0.5 + Math.sin(UI.t * 6) * 0.5;
    ctx.fillStyle = 'rgba(232,182,76,' + (0.1 + pulse * 0.05) + ')';
    ctx.fillRect(x - w / 2, y - 8, w, h);
    drawText(label, x, y, px, C.brass, 'center', 6);
    drawText('>', x - w / 2 + 10 + pulse * 3, y, px, C.brass, 'left');
    drawText('<', x + w / 2 - 10 - pulse * 3, y, px, C.brass, 'right');
  } else drawText(label, x, y, px, 'rgba(242,234,216,0.72)', 'center');
}

// A row of level pips that fits whatever the cap is.
function drawPips(x, y, width, total, filled, color) {
  const gap = total > 10 ? 1 : 1.5, pw = (width - gap * (total - 1)) / total;
  for (let i = 0; i < total; i++) {
    ctx.fillStyle = i < filled ? color : 'rgba(242,234,216,0.15)';
    ctx.fillRect(x + i * (pw + gap), y, pw, 5);
  }
}

function hint(text, y) { drawText(text, W / 2, y, 1.2, 'rgba(242,234,216,0.5)', 'center'); }

function meridianLine(alpha = 0.3) {
  ctx.strokeStyle = 'rgba(232,182,76,' + alpha + ')'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 + 0.5, 0); ctx.lineTo(W / 2 + 0.5, H); ctx.stroke();
  const off = (UI.t * 20) % 30;
  for (let y = -30 + off, i = 0; y < H; y += 30, i++) {
    const long = Math.round((y - off) / 30) % 3 === 0;
    ctx.beginPath(); ctx.moveTo(W / 2 - (long ? 7 : 3), y + 0.5); ctx.lineTo(W / 2 + (long ? 7 : 3), y + 0.5); ctx.stroke();
  }
}

    // the two dials this ladder turns

  const sx = 70, sy = 452;

// ---- HUD --------------------------------------------------------------------------------------------------
function drawHUD() {
  const p = player;
  const g = ctx.createLinearGradient(0, 0, 0, 60);
  g.addColorStop(0, 'rgba(4,6,12,0.7)'); g.addColorStop(1, 'rgba(4,6,12,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 60);
  const gb = ctx.createLinearGradient(0, H - 56, 0, H);
  gb.addColorStop(0, 'rgba(4,6,12,0)'); gb.addColorStop(1, 'rgba(4,6,12,0.65)');
  ctx.fillStyle = gb; ctx.fillRect(0, H - 56, W, 56);

  drawText('SCORE', 14, 10, 1.1, 'rgba(242,234,216,0.55)');
  drawText(fmt(Game.score), 14, 22, 2.4, C.ink, 'left', 2);
  drawText('BEST', W - 54, 10, 1.1, 'rgba(242,234,216,0.55)', 'right');
  drawText(fmt(Math.max(bestScore(), Game.score)), W - 54, 22, 1.6, 'rgba(242,234,216,0.8)', 'right');
  drawText((endless() ? 'ENDLESS · WAVE ' : 'WAVE ') + Game.wave, W / 2, 10, 1.2, endless() ? 'rgba(232,182,76,0.8)' : 'rgba(242,234,216,0.6)', 'center');
  drawText(REGIONS[Ground.region] + (endless() && Game.wave > ENDLESS_HERO_FROM ? ' · ×' + heroGrow().toFixed(2) : ''), W / 2, 22, 1.1, 'rgba(232,182,76,0.6)', 'center');

  // chain
  if (Game.chain > 0) {
    const rem = clamp(1 - (Game.time - Game.lastKill) / CHAIN_WINDOW, 0, 1);
    drawText('×' + Game.mult, 14, 46, 2.6, Game.mult > 1 ? C.brass : C.ink, 'left', Game.mult > 1 ? 5 : 0);
    drawText('CHAIN ' + Game.chain, 14 + textWidth('×' + Game.mult, 2.6) + 8, 48, 1.1, 'rgba(242,234,216,0.7)');
    ctx.fillStyle = 'rgba(242,234,216,0.15)'; ctx.fillRect(14, 68, 80, 2);
    ctx.fillStyle = C.brass; ctx.fillRect(14, 68, 80 * rem, 2);
  }

  // pause button
  ctx.fillStyle = 'rgba(8,12,22,0.55)'; ctx.beginPath(); ctx.arc(W - 26, 28, 17, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(242,234,216,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = C.ink; ctx.fillRect(W - 31, 21, 3.5, 14); ctx.fillRect(W - 24.5, 21, 3.5, 14);

  // boss bar
  if (boss) {
    const frac = boss.hp / boss.maxHp;
    const bx = 60, by = 84, bw = W - 120;
    drawText(boss.def.name, bx, by - 13, 1.4, C.alarm, 'left', 3);
    if (boss.loop) drawText('×' + (boss.loop + 1), bx + bw, by - 13, 1.4, C.alarm, 'right');
    ctx.fillStyle = 'rgba(8,12,22,0.7)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 10);
    const fill = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    fill.addColorStop(0, '#ff4d5e'); fill.addColorStop(1, '#e8b64c');
    ctx.fillStyle = fill;
    const shown = boss.phase === 'enter' ? Math.min(1, boss.enterT / 2.6) : frac;
    ctx.fillRect(bx, by, bw * shown, 6);
    ctx.fillStyle = 'rgba(8,12,22,0.8)';
    for (let i = 1; i < 10; i++) ctx.fillRect(bx + bw * i / 10 - 0.5, by, 1, 6);
  }
  if (Game.patternFlash) {
    const f = Game.patternFlash, a = f.t < 0.2 ? f.t / 0.2 : f.t > 1.8 ? Math.max(0, 1 - (f.t - 1.8) / 0.6) : 1;
    const blink = f.t < 0.6 && Math.floor(f.t * 10) % 2 ? 0.4 : 1;
    ctx.globalAlpha = a * blink;
    drawText('< ' + f.text + ' >', W / 2, 104, 1.8, C.brass, 'center', 5);
    ctx.globalAlpha = 1;
  }

  // ships in reserve, bottom right
  const reserve = Math.max(0, p.ships - (p.alive ? 1 : 0));
  for (let i = 0; i < Math.min(reserve, 6); i++) drawPlayerShip(p.pilot, W - 22 - i * 20, H - 34, 0, 0, 0.42, 0.9);
  if (reserve > 6) drawText('+' + (reserve - 6), W - 22 - 6 * 20, H - 39, 1.2, C.ink, 'right');

  // weapon badge and wingman badge
  const w = WEAPONS[p.weapon];
  const cx = W / 2;
  ctx.fillStyle = w.color; roundRect(cx - 100, H - 40, 15, 22, 7); ctx.fill();
  drawText(w.key, cx - 92.5, H - 35, 1.6, '#0b0f1a', 'center');
  drawText(w.name, cx - 80, H - 40, 1.4, C.ink);
  drawPips(cx - 80, H - 25, 66, maxLevel(), p.level, w.glow);
  if (p.level >= maxLevel()) drawText('MAX', cx - 10, H - 26, 1, C.brass);
  if (p.wingLevel > 0) {
    const g = WING_TYPES[p.wingType];
    ctx.fillStyle = g.color;
    for (const sx of [cx + 20, cx + 30]) { ctx.beginPath(); ctx.moveTo(sx, H - 40); ctx.lineTo(sx + 4, H - 31); ctx.lineTo(sx - 4, H - 31); ctx.fill(); }
    drawText(endless() ? 'WING ×' + wingTotal() : g.name, cx + 40, H - 40, 1.3, C.ink);
    drawPips(cx + 40, H - 25, 56, wingMax(), p.wingLevel, g.glow);
    if (endless()) {
      // one dot per drone, in its own gun's colour
      player.wings.forEach((wg, i) => {
        ctx.fillStyle = WING_TYPES[wg.type].color;
        ctx.beginPath(); ctx.arc(cx + 22 + (i % 8) * 7, H - 46 - ((i / 8) | 0) * 6, 2, 0, TAU); ctx.fill();
      });
    }
  }
  if (Game.autoFire) drawText('AUTO', W - 26, 50, 1.1, C.signal, 'center');

  // bomb button, bottom left: tap or click it, or press X / K
  {
    const { x: bx, y: by, r } = BOMB_BTN, ready = p.bombs > 0 && Game.bombT <= 0 && p.alive;
    ctx.fillStyle = ready ? 'rgba(232,182,76,0.22)' : 'rgba(8,12,22,0.45)';
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
    ctx.strokeStyle = ready ? C.brass : 'rgba(242,234,216,0.25)'; ctx.lineWidth = 2; ctx.stroke();
    drawText('BOMB', bx, by - 12, 1.5, ready ? C.brass : 'rgba(242,234,216,0.4)', 'center');
    // one pip per bomb in hand
    const n = p.bombs, gap = 9, x0 = bx - (Math.min(n, 5) - 1) * gap / 2;
    for (let i = 0; i < Math.min(n, 5); i++) {
      ctx.fillStyle = ready ? C.brass : 'rgba(242,234,216,0.4)';
      ctx.beginPath(); ctx.arc(x0 + i * gap, by + 7, 3, 0, TAU); ctx.fill();
    }
    if (n > 5) drawText('+' + (n - 5), bx, by + 13, 1, C.ink, 'center');
  }

  // banner
  const b = Game.banner;
  if (b) {
    const a = b.t < 0.25 ? b.t / 0.25 : b.t > b.dur - 0.4 ? Math.max(0, (b.dur - b.t) / 0.4) : 1;
    const warn = b.title === 'WARNING';
    ctx.globalAlpha = a;
    const y = 290;
    if (warn) {
      ctx.fillStyle = 'rgba(255,77,94,0.14)'; ctx.fillRect(0, y - 26, W, 96);
      ctx.save(); ctx.beginPath(); ctx.rect(0, y - 26, W, 8); ctx.rect(0, y + 62, W, 8); ctx.clip();
      ctx.fillStyle = 'rgba(255,77,94,0.75)';
      for (let x = -40 + (b.t * 60) % 20; x < W + 20; x += 20) { ctx.beginPath(); ctx.moveTo(x, y + 70); ctx.lineTo(x + 10, y + 70); ctx.lineTo(x + 28, y - 26); ctx.lineTo(x + 18, y - 26); ctx.fill(); }
      ctx.restore();
      if (Math.floor(b.t * 4) % 2 === 0) drawText(b.title, W / 2, y, 5, C.alarm, 'center', 10);
    } else {
      const ext = Math.min(1, b.t / 0.5) * 150;
      ctx.strokeStyle = b.color === C.alarm ? 'rgba(255,77,94,0.7)' : 'rgba(232,182,76,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W / 2 - ext, y - 12.5); ctx.lineTo(W / 2 + ext, y - 12.5); ctx.moveTo(W / 2 - ext, y + 64.5); ctx.lineTo(W / 2 + ext, y + 64.5); ctx.stroke();
      drawText(b.title, W / 2, y, 5, b.color, 'center', 8);
    }
    if (b.sub) drawText(b.sub, W / 2, y + 44, 1.6, warn ? C.ink : C.brass, 'center');
    ctx.globalAlpha = 1;
  }

  for (const t of texts) {
    const half = textWidth(t.text, t.px) / 2 + 8;
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
    drawText(t.text, clamp(t.x, half, W - half), t.y, t.px, t.color, 'center', 3);
  }
  ctx.globalAlpha = 1;
}

// ---- Flight manual ----------------------------------------------------------------------------------------
const MANUAL_PAGES = ['CONTROLS', 'WEAPONS', 'PODS', 'PILOTS', 'NOTES'];
const PX = 24, PY = 30, PW = W - 48, PH = H - 60;
const INK = C.paperInk, INK2 = 'rgba(29,35,48,0.62)';

function drawManual() {
  ctx.fillStyle = 'rgba(3,5,10,0.72)'; ctx.fillRect(0, 0, W, H);
  // paper
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(PX + 6, PY + 8, PW, PH);
  ctx.fillStyle = C.paper; ctx.fillRect(PX, PY, PW, PH);
  ctx.fillStyle = 'rgba(120,100,60,0.05)';
  for (let y = PY + 8; y < PY + PH; y += 4) ctx.fillRect(PX, y, PW, 1);
  ctx.strokeStyle = C.paperRule; ctx.lineWidth = 1;
  ctx.strokeRect(PX + 8.5, PY + 8.5, PW - 17, PH - 17);

  // header
  drawText('IRON MERIDIAN · FLIGHT MANUAL', PX + 22, PY + 22, 1.1, INK2);
  const pg = (UI.page + 1) + ' / ' + MANUAL_PAGES.length;
  drawText(pg, PX + PW - 48, PY + 22, 1.2, INK, 'right');
  drawText('<', PX + PW - 88, PY + 22, 1.2, INK, 'right');
  drawText('>', PX + PW - 24, PY + 22, 1.2, INK, 'right');
  UI.button(PX + PW - 104, PY + 12, 36, 28, () => turnPage(-1));
  UI.button(PX + PW - 40, PY + 12, 36, 28, () => turnPage(1));
  drawText(MANUAL_PAGES[UI.page], PX + 22, PY + 46, 3.4, INK);
  // stamp
  ctx.save();
  ctx.translate(PX + PW - 78, PY + 58); ctx.rotate(-0.12);
  ctx.strokeStyle = 'rgba(184,50,47,0.75)'; ctx.lineWidth = 2; ctx.strokeRect(-46, -14, 92, 28);
  ctx.lineWidth = 1; ctx.strokeRect(-42, -10, 84, 20);
  drawText(UI.manualFrom === 'pause' ? 'PAUSED' : 'BRIEFING', 0, -5, 1.5, 'rgba(184,50,47,0.85)', 'center');
  ctx.restore();
  // tabs
  let tx = PX + 22;
  MANUAL_PAGES.forEach((name, i) => {
    const tw = textWidth(name, 1.2);
    UI.button(tx - 6, PY + 80, tw + 12, 26, () => { if (UI.page !== i) { UI.page = i; Sound.play('page'); } });
    drawText(name, tx, PY + 88, 1.2, i === UI.page ? INK : INK2);
    if (i === UI.page) { ctx.fillStyle = C.stamp; ctx.fillRect(tx, PY + 100, tw, 2); }
    tx += tw + 17;
  });
  ctx.fillStyle = C.paperRule; ctx.fillRect(PX + 22, PY + 110, PW - 44, 1);

  const cx = PX + 22, cy = PY + 124, cw = PW - 44;
  [manualControls, manualWeapons, manualPods, manualPilots, manualNotes][UI.page](cx, cy, cw);

  // controls
  ctx.fillStyle = C.paperRule; ctx.fillRect(PX + 22, PY + PH - 124, PW - 44, 1);
  const items = manualItems();
  UI.mSel = Math.min(UI.mSel, items.length - 1);
  const layout = [];
  const toggles = items.filter(it => ['auto', 'sound', 'music'].includes(it.id));
  const actions = items.filter(it => !['auto', 'sound', 'music'].includes(it.id));
  const bw3 = (cw - 20) / 3;
  toggles.forEach((it, i) => layout.push({ it, x: cx + i * (bw3 + 10), y: PY + PH - 110, w: bw3, h: 32 }));
  const bw2 = actions.length === 2 ? (cw - 10) / 2 : cw;
  actions.forEach((it, i) => layout.push({ it, x: cx + i * (bw2 + 10), y: PY + PH - 68, w: bw2, h: 34 }));
  for (const L of layout) {
    const idx = items.indexOf(L.it), sel = idx === UI.mSel;
    UI.button(L.x, L.y, L.w, L.h, () => { UI.mSel = idx; manualActivate(L.it.id); });
    const danger = L.it.id === 'abandon';
    if (sel) { ctx.fillStyle = danger ? C.stamp : INK; ctx.fillRect(L.x, L.y, L.w, L.h); }
    ctx.strokeStyle = danger ? C.stamp : INK; ctx.lineWidth = 1.5; ctx.strokeRect(L.x + 0.75, L.y + 0.75, L.w - 1.5, L.h - 1.5);
    const px = L.it.id === 'resume' || L.it.id === 'back' || danger ? 1.6 : 1.25;
    drawText(L.it.label, L.x + L.w / 2, L.y + L.h / 2 - 3.5 * px, px, sel ? C.paper : (danger ? C.stamp : INK), 'center');
  }
  const foot = UI.manualFrom === 'pause'
    ? (Pointer.touchMode ? 'TAP TABS TO TURN PAGES' : '←→ PAGES · ↑↓ SELECT · ESC RESUME · Q ABANDON')
    : (Pointer.touchMode ? 'TAP TABS TO TURN PAGES' : '←→ PAGES · ↑↓ SELECT · X BACK');
  drawText(foot, W / 2, PY + PH - 24, 1, INK2, 'center');
}

function manualControls(x, y, w) {
  const rows = [
    ['Move', 'Arrow keys or WASD', 'Drag anywhere on screen'],
    ['Fire', 'Z, J or Space, held', 'Fires automatically on touch'],
    ['Auto-fire', 'F toggles it', 'Toggle below'],
    ['Bomb', 'X or K', 'The round BOMB button, bottom left'],
    ['Precision', 'Hold Shift or C for half speed', '—'],
    ['Pause', 'Esc or P opens this manual', 'The pause button, top right'],
    ['Abandon', 'Q, while paused', 'ABANDON below'],
    ['Sound', 'M mutes everything · N mutes the music', 'Toggles below'],
  ];
  const c1 = 74, c2 = 150, c3 = w - c1 - c2 - 10;
  drawText('ACTION', x, y, 1, INK2); drawText('KEYBOARD', x + c1, y, 1, INK2); drawText('TOUCH / MOUSE', x + c1 + c2 + 10, y, 1, INK2);
  let yy = y + 16;
  for (const [a, k, t] of rows) {
    const h1 = serif(k, x + c1, yy, 12, INK, { width: c2 - 6, lh: 14 });
    const h2 = serif(t, x + c1 + c2 + 10, yy, 12, INK, { width: c3, lh: 14 });
    serif(a, x, yy, 12, INK, { bold: true });
    const h = Math.max(h1, h2, 14);
    yy += h + 6;
    ctx.fillStyle = 'rgba(185,174,147,0.6)'; ctx.fillRect(x, yy - 3, w, 1);
  }
  yy += 10;
  yy += serif('Only the glowing core takes hits, not the whole ship. Hold precision to see a ring around exactly where it sits.', x, yy, 12.5, INK, { width: w, italic: true, lh: 16 }) + 8;
  serif('In menus, use the arrow keys, Z or Enter to choose and X or Esc to go back, or just tap.', x, yy, 12, INK2, { width: w, lh: 15 });
}

function manualWeapons(x, y, w) {
  const desc = [
    'Spread cannon. One stream widening to seven across the lane.',
    'Piercing beams that drill through a whole column of hulls. One beam, up to seven.',
    'Slow orbs that detonate and splash everything nearby. One small orb up to five, and the splash keeps growing.',
    'Seeking warheads plus a light nose gun. Two warheads per volley up to eight; twin nose gun from level 3, triple from level 8.',
    'Chain lightning with screen-wide reach. Never misses, but strikes two targets per pulse up to eight, weaker with each jump. Two chains from level 3, three from level 8. Weakest against a lone boss.',
    'Shells that burst into shrapnel a short way ahead of you. One shell up to three, six splinters up to sixteen. Murder on formations, poor against a single hull.',
    'Sawblades that ricochet off the walls and cut anything they touch, again and again. One blade up to four, three bounces up to eight.',
  ];
  let yy = y;
  WEAPONS.forEach((wp, i) => {
    ctx.fillStyle = wp.color; roundRect(x, yy + 1, 15, 21, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(29,35,48,0.5)'; ctx.lineWidth = 1; roundRect(x, yy + 1, 15, 21, 7); ctx.stroke();
    drawText(wp.key, x + 8, yy + 6, 1.4, '#0b0f1a', 'center');
    drawText(wp.name, x + 26, yy + 2, 1.5, INK);
    const h = serif(desc[i], x + 26, yy + 15, 11, INK, { width: w - 26, lh: 13 });
    yy += Math.max(26, h + 20);
  });
  ctx.fillStyle = C.paperRule; ctx.fillRect(x, yy + 2, w, 1);
  serif('Every weapon runs from level 1 to level 10. Past level five each pod adds damage rather than another barrel. Losing a ship costs two levels.', x, yy + 10, 11.5, INK, { width: w, lh: 14, italic: true });
}

function manualPods(x, y, w) {
  const rows = [
    ['gold', 'Gold round P raises the level of the weapon you are flying, up to ten.'],
    ['capsule', 'A coloured capsule switches to that weapon and keeps the level you already have. The letter you are flying raises the level instead.'],
    ['bomb', 'A dark B token is a spare bomb, up to ten in hand. Tanks, spinners, gunships and frigates carry them, and so does every boss.'],
    ['ship', 'A green 1UP token is a spare ship, up to nine in reserve. The heavier craft carry them, rarely.'],
    ['wing', 'A wingman token puts a drone on each side of you. The same letter again raises them a level, up to three; a different letter changes their gun and keeps the level they already have.'],
  ];
  let yy = y;
  for (const [icon, text] of rows) {
    if (icon === 'gold') {
      ctx.fillStyle = '#e8b64c'; ctx.beginPath(); ctx.arc(x + 8, yy + 8, 8, 0, TAU); ctx.fill();
      drawText('P', x + 8.5, yy + 3.5, 1.3, '#5a3a06', 'center');
    } else if (icon === 'capsule') {
      ctx.fillStyle = '#46e0ff'; roundRect(x + 2, yy, 12, 17, 5); ctx.fill();
    } else if (icon === 'bomb') {
      ctx.fillStyle = '#333a45'; ctx.beginPath(); ctx.arc(x + 8, yy + 8, 8, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#a8801f'; ctx.lineWidth = 1.5; ctx.stroke();
      drawText('B', x + 8.5, yy + 4, 1.2, '#ebe3cf', 'center');
    } else if (icon === 'ship') {
      ctx.fillStyle = '#1d3a2a'; roundRect(x, yy, 17, 17, 5); ctx.fill();
      ctx.strokeStyle = '#3f8a5c'; ctx.lineWidth = 1.2; roundRect(x, yy, 17, 17, 5); ctx.stroke();
      drawPlayerShip(player.pilot, x + 8.5, yy + 9, 0, 0, 0.3);
    } else {
      ctx.fillStyle = '#1b2230';
      ctx.beginPath();
      ctx.moveTo(x + 8, yy - 1); ctx.lineTo(x + 17, yy + 5); ctx.lineTo(x + 17, yy + 13); ctx.lineTo(x + 8, yy + 18);
      ctx.lineTo(x - 1, yy + 13); ctx.lineTo(x - 1, yy + 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe066';
      for (const sx of [3.5, 12.5]) { ctx.beginPath(); ctx.moveTo(x + sx, yy + 4); ctx.lineTo(x + sx + 2.5, yy + 10); ctx.lineTo(x + sx - 2.5, yy + 10); ctx.fill(); }
    }
    yy += Math.max(22, serif(text, x + 28, yy + 1, 11, INK, { width: w - 28, lh: 13 }) + 8);
  }
  ctx.fillStyle = C.paperRule; ctx.fillRect(x, yy, w, 1);
  yy += 9;
  drawText('WINGMEN', x, yy, 1.4, C.stamp);
  serif('僚机', x + textWidth('WINGMEN', 1.4) + 10, yy - 2, 13, C.stamp);
  yy += 15;
  WING_TYPES.forEach(g => {
    ctx.fillStyle = g.color;
    ctx.beginPath(); ctx.moveTo(x + 6, yy); ctx.lineTo(x + 11, yy + 10); ctx.lineTo(x + 1, yy + 10); ctx.fill();
    drawText(g.key + '  ' + g.name, x + 20, yy + 1, 1.2, INK);
    serif(g.kind, x + 104, yy, 11, INK, { lh: 13 });
    yy += 16;
  });
  yy += 2;
  yy += serif('Level 2 lifts their rate of fire; level 3 puts a second drone on each side. Losing a ship costs one wingman level. Wingmen fire whenever you do and cannot be hit. In Endless a token adds a drone of that gun instead, up to five of each kind, and trains the flight to level 15 once a kind is full.', x, yy, 11, INK, { width: w, lh: 13 }) + 8;
  ctx.fillStyle = C.paperRule; ctx.fillRect(x, yy, w, 1);
  serif('Pods bounce off the edges. Every cycling token changes type every five seconds and disappears once it has shown all of them: 35 seconds for a weapon capsule, 15 for a wingman token. A gold P, bomb or ship token lasts 35 seconds. All of them blink for their last three seconds.', x, yy + 9, 11, INK2, { width: w, lh: 13, italic: true });
}

function manualPilots(x, y, w) {
  const d = diff();
  let yy = y;
  PILOTS.forEach(pl => {
    drawPlayerShip(pl, x + 16, yy + 20, 0, UI.t, 0.85);
    drawText(pl.name, x + 44, yy + 4, 1.7, INK);
    serif(pl.role, x + 44, yy + 20, 12, INK, { italic: true, width: w - 44, lh: 14 });
    const ships = (pl.ships > 0 ? '+' : pl.ships < 0 ? '−' : '±') + Math.abs(pl.ships);
    const core = pl.core < 3 ? 'small' : pl.core > 4 ? 'large' : 'standard';
    serif('Ships ' + ships + '  ·  Bombs ' + (BASE_BOMBS + pl.bombs) + '  ·  Core ' + core + '  ·  Damage ×' + pl.damage + '  ·  Rate ×' + pl.fireRate, x + 44, yy + 36, 10.5, INK2);
    yy += 66;
  });
  yy += 2;
  serif('Ships are added to or taken from the level’s starting count (' + d.ships + ' on level ' + d.numeral + '), and you always get at least one. Aegis carries momentum through every turn, so it drifts before it changes direction.', x, yy, 11.5, INK, { width: w, lh: 15 });
}

function manualNotes(x, y, w) {
  const notes = [
    ['MODES', 'Campaign runs the wave curves the game was tuned around. Endless never stops: enemies gain 2% health and 1% bullet speed every wave, your weapon and wingmen train to level 15, wingman tokens add drones instead of swapping guns (five of each kind), and from wave 20 your damage, bullet speed and handling each grow 2% a wave.'],
    ['BOMBS', 'A bomb erases every enemy bullet on screen (10 points each), damages everything for about a second and a half, and makes you untouchable for nearly three seconds.'],
    ['LOSING A SHIP', 'Costs two weapon levels and one wingman level; the lost power drops as a gold P where you went down. The next ship flies in with three seconds of invulnerability and bombs refilled.'],
    ['CHAIN', 'Each kill within 1.6 seconds of the last extends your chain. Every five kills adds ×1 to the multiplier, up to ×8. Losing a ship resets it.'],
    ['FORMATIONS', 'Destroy every ship in a formation of four or more, with none escaping, for 200 points per ship times your multiplier.'],
    ['PICKUPS', 'Any pod is worth 250 points. A power-up at full power is worth 5,000 more; a bomb, ship or wingman token you cannot use is worth 2,000 to 3,000. Every wave sends at least one pod carrier.'],
    ['BOSSES', 'Every fifth wave: Warden, Hydra, Seraph, Leviathan, then round again, tougher. Worth 20,000 times the bosses you have met.'],
  ];
  let yy = y;
  for (const [h, t] of notes) {
    drawText(h, x, yy, 1.3, C.stamp);
    yy += 12;
    yy += serif(t, x, yy, 11.5, INK, { width: w, lh: 14 }) + 9;
  }
  if (UI.manualFrom === 'pause') {
    const line = 'WAVE ' + Game.wave + ' · ' + REGIONS[Ground.region] + ' · ' + player.pilot.name + ' · ' + diff().name;
    drawText(line, x, yy + 2, 1.1, INK2);
  }
}

// ---- Game over --------------------------------------------------------------------------------------------
function drawGameOver() {
  ctx.fillStyle = 'rgba(4,6,12,0.72)'; ctx.fillRect(0, 0, W, H);
  vignette();
  drawText('GAME OVER', W / 2, 170, 5.5, C.alarm, 'center', 10);
  ctx.fillStyle = 'rgba(232,182,76,0.5)'; ctx.fillRect(W / 2 - 150, 230, 300, 1);
  drawText('SCORE', W / 2, 258, 1.4, 'rgba(242,234,216,0.6)', 'center');
  drawText(fmt(Game.score), W / 2, 278, 4.2, C.ink, 'center', 6);
  if (Game.newBest && Math.floor(UI.t * 3) % 2 === 0) drawText('NEW BEST', W / 2, 322, 2, C.brass, 'center', 6);
  else drawText('BEST ' + fmt(bestScore()), W / 2, 324, 1.5, 'rgba(242,234,216,0.7)', 'center');
  const info = MODE_NAME[Game.mode] + ' · WAVE ' + Game.wave + ' · ' + player.pilot.name + ' · ' + diff().name;
  drawText(info, W / 2, 360, 1.3, C.brass, 'center');
  ctx.fillStyle = 'rgba(232,182,76,0.5)'; ctx.fillRect(W / 2 - 150, 386, 300, 1);
  OVER_ITEMS.forEach((it, i) => menuItem(it, W / 2, 430 + i * 44, UI.sel === i, () => overChoose(i)));
  hint(Pointer.touchMode ? 'TAP TO CHOOSE' : '↑↓ MOVE · Z OR ENTER CHOOSE', 600);
}


// ---- Main loop ----------------------------------------------------------------------------------------
let lastFrame = performance.now();

function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#05070c';
  ctx.fillRect(0, 0, W, H);
  switch (Game.state) {
    case 'title': drawTitle(); break;
    case 'difficulty': drawDifficulty(); break;
    case 'pilot': drawPilot(); break;
    case 'manual': drawTitle(); UI.buttons.length = 0; drawManual(); break;
    case 'play':
      drawPlayWorld();
      drawHUD();
      if (Game.paused) drawManual();
      break;
    case 'gameover': drawPlayWorld(); drawGameOver(); break;
  }
}

function frame(now) {
  let dt = (now - lastFrame) / 1000;
  lastFrame = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  UI.t += dt;

  processTaps();
  handleMenuInput();
  UI.buttons = [];

  if (Game.state === 'play') {
    if (!Game.paused && dt > 0) {
      const steps = Math.ceil(dt / (1 / 60));
      const h = dt / steps;
      for (let i = 0; i < steps && Game.state === 'play' && !Game.paused; i++) updatePlay(h);
    }
  } else {
    Ground.update(dt);
    Ground.warm(dt);
    if (Game.state === 'gameover') updateParticles(dt);
  }

  render();
  UI.prevButtons = UI.buttons;
  Input.endFrame();
  requestAnimationFrame(frame);
}

// Audio suspends whenever the page is backgrounded, the screen locks or the tab closes.
// Coming back resumes sound and leaves a run paused on the manual.
function backgrounded() {
  if (Game.state === 'play' && !Game.paused) openManual('pause');
  Input.down.clear();
  Pointer.dragId = null;
  Sound.suspend();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) backgrounded();
  else { Sound.resume(); lastFrame = performance.now(); }
});
window.addEventListener('pagehide', backgrounded);
window.addEventListener('pageshow', () => { if (!document.hidden) Sound.resume(); });
document.addEventListener('freeze', backgrounded);

// ---- Boot ----------------------------------------------------------------------------------------------
resize();
buildSprites();
Ground.init();
Music.play('menu');
canvas.focus({ preventScroll: true });
requestAnimationFrame(t => { lastFrame = t; requestAnimationFrame(frame); });

</script>
